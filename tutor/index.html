<!doctype html>
<html lang="ko" data-palette="graphite" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>다움진로진학컨설팅 — 진학 및 학습 맞춤엔진</title>
<style>
  :root {
    /* graphite 팔레트 + DA.UM 브랜드 */
    --ink-0:#ffffff;  --ink-50:#f7f8f9; --ink-100:#eceef1; --ink-200:#dfe3e8;
    --ink-300:#c8ced6; --ink-400:#9aa4b0; --ink-500:#6b7683; --ink-600:#4e5865;
    --ink-700:#3a4351; --ink-800:#262d38; --ink-900:#141a22;
    --brand-500:#12707c;
    --success-500:#1f9d55; --warn-500:#b7791f; --danger-500:#c0392b;
    --surface-0: var(--ink-0);
  }
  html, body { height: 100%; margin: 0; background: var(--ink-50); color: var(--ink-900); font-family: 'Pretendard','Inter',-apple-system,BlinkMacSystemFont,sans-serif; }
  * { box-sizing: border-box; word-break: keep-all; }

  /* 레이아웃 셸 */
  .shell { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }
  .side { background: var(--ink-0); border-right: 1px solid var(--ink-100); padding: 14px 10px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 4px 6px 14px; border-bottom: 1px solid var(--ink-100); margin-bottom: 10px; }
  .brand .mk { width: 32px; height: 32px; border-radius: 8px; background: var(--brand-500); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; flex: 0 0 auto; }
  .brand .nm { font-size: 13px; font-weight: 700; line-height: 1.25; color: var(--ink-900); }
  .brand .nm small { display: block; font-size: 11px; font-weight: 500; color: var(--ink-500); margin-top: 2px; }

  .nav-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px; font-size: 13px; color: var(--ink-700); text-decoration: none; cursor: pointer; user-select: none; }
  .nav-item:hover { background: var(--ink-50); color: var(--ink-900); }
  .nav-item.active { background: var(--brand-500); color: #fff; }
  .nav-item .ic { width: 18px; text-align: center; font-size: 13px; opacity: .85; }
  .nav-item.active .ic { opacity: 1; }
  .nav-section-label { font-size: 10px; letter-spacing: .08em; color: var(--ink-400); padding: 10px 10px 4px; text-transform: uppercase; }
  .nav-more { font-size: 12px; color: var(--ink-500); padding: 6px 10px; cursor: pointer; }
  .nav-more:hover { color: var(--brand-500); }
  .nav-more .caret { display: inline-block; transition: transform .15s; }
  .nav-more.open .caret { transform: rotate(90deg); }
  .back-link { display: flex; align-items: center; gap: 8px; margin-top: 12px; padding: 8px 10px; border-top: 1px solid var(--ink-100); font-size: 12px; color: var(--ink-500); text-decoration: none; }
  .back-link:hover { color: var(--brand-500); }

  /* 메인 영역 */
  .main { display: flex; flex-direction: column; min-width: 0; }
  .top { position: sticky; top: 0; z-index: 20; background: var(--ink-0); border-bottom: 1px solid var(--ink-100); padding: 10px 20px; display: flex; align-items: center; gap: 12px; }
  .top .hamb { display: none; width: 36px; height: 36px; border: 1px solid var(--ink-200); border-radius: 8px; background: #fff; cursor: pointer; font-size: 18px; align-items: center; justify-content: center; }
  .search { flex: 1; max-width: 520px; position: relative; }
  .search input { width: 100%; height: 36px; border: 1px solid var(--ink-200); border-radius: 10px; padding: 0 36px 0 36px; font-size: 13px; background: var(--ink-50); color: var(--ink-900); outline: none; }
  .search input:focus { border-color: var(--brand-500); background: #fff; }
  .search .mg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--ink-500); font-size: 14px; }
  .search .clear { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); border: none; background: transparent; color: var(--ink-500); cursor: pointer; display: none; }
  #srDrop { position: absolute; top: 42px; left: 0; right: 0; background: #fff; border: 1px solid var(--ink-200); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.08); max-height: 420px; overflow-y: auto; display: none; }
  #srDrop .sr-section { padding: 6px 12px; font-size: 10px; letter-spacing: .06em; color: var(--ink-400); background: var(--ink-50); position: sticky; top: 0; }
  #srDrop .sr-item { display: flex; justify-content: space-between; gap: 10px; padding: 8px 12px; cursor: pointer; border-bottom: 1px solid var(--ink-50); }
  #srDrop .sr-item:hover { background: var(--ink-50); }
  #srDrop .sr-t { font-size: 13px; color: var(--ink-900); font-weight: 600; }
  #srDrop .sr-sub { font-size: 12px; color: var(--ink-500); margin-top: 2px; }
  #srDrop .sr-empty { padding: 14px; color: var(--ink-500); font-size: 13px; text-align: center; }

  .top .right { margin-left: auto; display: flex; align-items: center; gap: 10px; color: var(--ink-500); font-size: 12px; }
  .top .right button { height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--ink-200); background: #fff; cursor: pointer; font-size: 12px; color: var(--ink-700); }
  .top .right button:hover { color: var(--brand-500); border-color: var(--brand-500); }

  #route { padding: 20px; min-height: calc(100vh - 56px); }

  /* 공통 UI */
  .hero { margin-bottom: 16px; }
  .hero .micro { font-size: 11px; color: var(--brand-500); font-weight: 600; letter-spacing: .04em; }
  .hero h1 { margin: 4px 0 6px; font-size: 20px; color: var(--ink-900); }
  .hero p { margin: 0; color: var(--ink-600); font-size: 13px; }

  .kpis { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin-bottom: 14px; }
  .kpi { background: #fff; border: 1px solid var(--ink-100); border-radius: 10px; padding: 12px 14px; }
  .kpi .k { font-size: 11px; color: var(--ink-500); }
  .kpi .v { font-size: 16px; font-weight: 700; color: var(--ink-900); line-height: 1.3; margin-top: 2px; }

  .panels { display: grid; gap: 14px; }
  .panels.two { grid-template-columns: 1fr 1fr; }
  .panels.three { grid-template-columns: 2fr 1fr 1fr; }
  .panel { background: #fff; border: 1px solid var(--ink-100); border-radius: 10px; padding: 14px; min-width: 0; }
  .ph { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; gap: 8px; }
  .pt { font-size: 13px; font-weight: 700; color: var(--ink-900); }
  .pa { font-size: 11px; color: var(--ink-500); }

  .tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .tbl th { text-align: left; padding: 8px 10px; color: var(--ink-500); font-weight: 500; font-size: 11px; letter-spacing: .02em; border-bottom: 1px solid var(--ink-100); white-space: nowrap; }
  .tbl td { padding: 8px 10px; color: var(--ink-800); border-bottom: 1px solid var(--ink-50); }
  .tbl td.num, .tbl th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .tbl tr:last-child td { border-bottom: none; }
  .tbl tr.row-link { cursor: pointer; }
  .tbl tr.row-link:hover td { background: var(--ink-50); }
  .tbl td .mini-btn { height: 24px; padding: 0 8px; border-radius: 6px; border: 1px solid var(--ink-200); background: #fff; cursor: pointer; font-size: 11px; color: var(--ink-700); }
  .tbl td .mini-btn:hover { color: var(--brand-500); border-color: var(--brand-500); }

  .pill { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; background: var(--ink-100); color: var(--ink-700); }
  .pill.pill-ok { background: #DCF4E6; color: var(--success-500); }
  .pill.pill-warn { background: #FBEBD0; color: var(--warn-500); }
  .pill.pill-danger { background: #FBE1DE; color: var(--danger-500); }
  .pill.pill-brand { background: #E4F0F2; color: var(--brand-500); }

  .empty { text-align: center; padding: 20px; color: var(--ink-500); font-size: 13px; }
  .err-note { background: #FBE1DE; color: var(--danger-500); padding: 10px 12px; border-radius: 8px; font-size: 12px; }
  .skl { height: 10px; background: linear-gradient(90deg, var(--ink-100), var(--ink-50), var(--ink-100)); background-size: 200% 100%; border-radius: 5px; animation: shimmer 1.2s infinite; }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

  /* 가이드 카드 */
  .steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 14px; }
  .step { background: #fff; border: 1px solid var(--ink-100); border-radius: 10px; padding: 12px 14px; }
  .step .no { font-size: 10px; color: var(--brand-500); font-weight: 700; }
  .step .ti { font-size: 14px; font-weight: 700; color: var(--ink-900); margin: 4px 0; }
  .step .de { font-size: 11.5px; color: var(--ink-600); line-height: 1.5; }
  .core { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .ccard { display: block; background: var(--ink-50); border: 1px solid var(--ink-100); border-radius: 10px; padding: 10px 12px; text-decoration: none; color: inherit; cursor: pointer; }
  .ccard:hover { background: #fff; border-color: var(--brand-500); }
  .ccard .ck { font-size: 10px; color: var(--brand-500); }
  .ccard .ct { font-size: 13px; font-weight: 700; color: var(--ink-900); margin-top: 2px; }
  .ccard .cd { font-size: 11px; color: var(--ink-500); margin-top: 2px; }

  /* 학생 요약 페이지 */
  .stu-head { display: flex; gap: 14px; align-items: center; margin-bottom: 16px; background: #fff; border: 1px solid var(--ink-100); border-radius: 12px; padding: 14px 16px; }
  .stu-head .av { width: 48px; height: 48px; border-radius: 50%; background: var(--brand-500); color: #fff; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; font-size: 18px; flex: 0 0 auto; }
  .stu-head .nm { font-size: 18px; font-weight: 700; color: var(--ink-900); }
  .stu-head .sub { font-size: 12px; color: var(--ink-500); margin-top: 2px; }
  .stu-head .right-btns { margin-left: auto; display: flex; gap: 8px; }
  .btn { height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--ink-200); background: #fff; cursor: pointer; font-size: 12px; color: var(--ink-700); display: inline-flex; align-items: center; gap: 4px; }
  .btn:hover { color: var(--brand-500); border-color: var(--brand-500); }
  .btn.primary { background: var(--brand-500); color: #fff; border-color: var(--brand-500); }
  .btn.primary:hover { background: #0c5560; color: #fff; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
  .kv { display: grid; grid-template-columns: 80px 1fr; gap: 6px 10px; font-size: 12.5px; }
  .kv .k { color: var(--ink-500); }
  .kv .v { color: var(--ink-800); }

  /* 모달 */
  .modal-mask { position: fixed; inset: 0; background: rgba(23,20,16,.4); display: none; align-items: center; justify-content: center; z-index: 50; padding: 20px; }
  .modal-mask.show { display: flex !important; }
  .modal { background: #fff; border-radius: 12px; padding: 18px 20px; width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; }
  .modal h3 { margin: 0 0 12px; font-size: 15px; color: var(--ink-900); }
  .modal label { display: block; font-size: 11px; color: var(--ink-600); margin: 8px 0 2px; }
  .modal input, .modal select, .modal textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--ink-200); border-radius: 8px; font-size: 13px; background: #fff; color: var(--ink-900); font-family: inherit; }
  .modal textarea { min-height: 70px; resize: vertical; }
  .modal .foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }

  /* 토스트 */
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink-900); color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 12.5px; z-index: 100; opacity: 0; transition: opacity .2s; }
  .toast.show { opacity: 1; }

  /* 모바일 */
  @media (max-width: 820px) {
    .shell { grid-template-columns: 1fr; }
    .side { position: fixed; z-index: 40; top: 0; left: 0; width: 260px; transform: translateX(-100%); transition: transform .2s; box-shadow: 0 0 40px rgba(0,0,0,.1); }
    .side.open { transform: translateX(0); }
    .top .hamb { display: inline-flex; }
    .kpis { grid-template-columns: repeat(2, 1fr); }
    .panels.two, .panels.three { grid-template-columns: 1fr; }
    .steps, .core { grid-template-columns: repeat(2, 1fr); }
    .grid2, .grid3 { grid-template-columns: 1fr; }
    #route { padding: 14px; }
    /* 테이블 → 카드 전환 */
    .tbl.m-cards { display: block; }
    .tbl.m-cards thead { display: none; }
    .tbl.m-cards tbody, .tbl.m-cards tr { display: block; }
    .tbl.m-cards tr { background: var(--ink-50); border-radius: 10px; padding: 8px 10px; margin-bottom: 8px; }
    .tbl.m-cards td { display: flex; justify-content: space-between; padding: 4px 0; border: none; gap: 10px; }
    .tbl.m-cards td::before { content: attr(data-label); font-size: 11px; color: var(--ink-500); flex: 0 0 90px; }
    .tbl.m-cards td.num { text-align: right; }
    #mobile-mask { position: fixed; inset: 0; background: rgba(0,0,0,.3); z-index: 39; display: none; }
    #mobile-mask.show { display: block; }
  }
</style>
</head>
<body>
<div class="shell">
  <aside class="side" id="side">
    <div class="brand">
      <div class="mk">다</div>
      <div class="nm">다움진로진학컨설팅<small>진학 및 학습 맞춤엔진</small></div>
    </div>
    <nav id="nav"></nav>
    <a class="back-link" href="../index.html">← 경상북도 진로학업설계 플랫폼</a>
  </aside>
  <div class="main">
    <div class="top">
      <button class="hamb" id="hamb" aria-label="메뉴">☰</button>
      <div class="search">
        <span class="mg">🔎</span>
        <input id="srInput" type="search" placeholder="학생·기관·검사·상담 검색…" autocomplete="off" />
        <button class="clear" id="srClear" aria-label="지우기">✕</button>
        <div id="srDrop"></div>
      </div>
      <div class="right">
        <span id="ts"></span>
        <button id="refresh">새로고침</button>
      </div>
    </div>
    <div id="route">
      <div class="skl" style="width:40%; margin-bottom:10px"></div>
      <div class="skl" style="width:85%; margin-bottom:6px"></div>
      <div class="skl" style="width:70%"></div>
    </div>
  </div>
</div>
<div id="mobile-mask"></div>
<div class="modal-mask" id="modal"></div>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/sql-wasm.js"></script>
<script src="data/db.js"></script>
<script src="data/queries.js"></script>
<script src="data/overrides.js"></script>
<script src="shim.js"></script>
<script src="sections/routes.js"></script>
<script src="sections/main.js"></script>
</body>
</html>
