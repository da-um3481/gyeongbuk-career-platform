    return name + '#' + ks.map(function (k) { return k + '=' + params[k]; }).join('&');
  }

  /* 같은 쿼리를 파라미터만 바꿔 여러 번 받아둔 경우, 없는 조합은 합집합으로 대신합니다. */
  var byName = {};
  Object.keys(DATA).forEach(function (k) {
    var n = k.split('#')[0];
    (byName[n] = byName[n] || []).push(DATA[k].rows || []);
  });

  window.agentdb = {
    executeQuery: async function (name, params) {
      params = params || {};
      var k = keyOf(name, params);
      if (DATA[k]) return { rows: DATA[k].rows || [] };
      if (MUT[name]) {
        throw new Error('이 파일은 오프라인 스냅샷(읽기 전용)입니다. 저장·수정은 온라인 대시보드에서 해 주세요.');
      }
      var groups = byName[name];
      if (groups) {
        var seen = {}, out = [];
        groups.forEach(function (rows) {
          rows.forEach(function (r) {
            var s = JSON.stringify(r);
            if (!seen[s]) { seen[s] = 1; out.push(r); }
          });
        });
        return { rows: out };
      }
      throw new Error('오프라인 스냅샷에 "' + name + '" 데이터가 없습니다.');
    },
    getSchema: async function () { return { tables: [] }; },
    getAppInfo: async function () {
      return { id: APP.id || 'offline', name: APP.title || '오프라인 보드', scope: 'workspace' };
    },
    print: function () { window.print(); },
    downloadPdf: function () { window.print(); }
  };

  window.__offlineInfo = { snapshot_at: SNAP, app: APP.title || '', queries: Object.keys(DATA).length };

  /* ---------- 하단 배지 ---------- */
  function badge() {
    if (document.getElementById('od-badge')) return;
    var css = document.createElement('style');
    css.textContent = [
      '#od-badge{position:fixed;right:14px;bottom:14px;z-index:2147483000;display:flex;align-items:center;gap:8px;',
      'padding:7px 11px;border-radius:999px;background:#FFFEFB;border:1px solid #DFD7C3;color:#4A4234;',
      'font:600 11.5px/1.35 "Pretendard","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;',
      'box-shadow:0 2px 10px rgba(31,27,21,.14)}',
      '#od-badge i{width:7px;height:7px;border-radius:50%;background:#A0501F;display:inline-block}',
      '#od-badge b{color:#A0501F;font-weight:700}',
      '#od-badge a{color:#A0501F;text-decoration:none;border-bottom:1px solid #E4C7B4}',
      '#od-badge a:hover{border-bottom-color:#A0501F}',
      '@media print{#od-badge{display:none}}'
    ].join('');
    document.head.appendChild(css);
    var el = document.createElement('div');
    el.id = 'od-badge';
    el.innerHTML = '<i></i><span>오프라인 스냅샷 <b>' + (SNAP || '') + '</b> · 읽기 전용</span><a href="index.html">전체 보드</a>';
    document.body.appendChild(el);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', badge);
  else badge();
})();

</script>

  <script>
// 학습 콘텐츠·문제뱅크 트래커
var g = window.gsDash;

var state = {
  matrix: [],
  contents: [],
  questions: [],
  // filters per tab
  matrixSubject: '',
  contentSearch: '',
  contentSubject: '',
  contentType: '',
  contentDiff: '',
  qSearch: '',
  qSubject: '',
  qType: '',
  qDiff: '',
};

// --- helpers ---
function pad(n) { return String(n).padStart(2, '0'); }

function diffPill(d) {
  if (d === '하') return '<span class="diff-pill diff-easy">하</span>';
  if (d === '중') return '<span class="diff-pill diff-med">중</span>';
  if (d === '상') return '<span class="diff-pill diff-hard">상</span>';
  return '<span class="diff-pill" style="background:var(--ink-100);color:var(--ink-600)">—</span>';
}

function rateClass(r) {
  if (r == null) return '';
  if (r >= 80) return 'rate-high';
  if (r >= 60) return 'rate-mid';
  return 'rate-low';
}

function barClass(r) {
  if (r >= 80) return 'bar-high';
  if (r >= 60) return 'bar-mid';
  return 'bar-low';
}

function countBadge(n) {
  if (!n || Number(n) === 0) return '<span class="count-cell count-0">0</span>';
  return '<span class="count-cell count-some">' + n + '</span>';
}

function stars(r) {
  if (r == null) return '<span style="color:var(--ink-300)">—</span>';
  var full = Math.round(Number(r));
  var s = '';
  for (var i = 0; i < 5; i++) s += (i < full) ? '★' : '☆';
  return '<span class="star" title="' + r + '점">' + s + '</span><span class="num" style="color:var(--ink-500);margin-left:4px;font-size:11px">' + r + '</span>';
}

function unique(arr, key) {
  var seen = {}, out = [];
  arr.forEach(function (r) {
    var v = r[key];
    if (v && !seen[v]) { seen[v] = true; out.push(v); }
  });
  return out.sort();
}

function selectOptions(values, selected, placeholder) {
  var opts = ['<option value="">' + placeholder + '</option>'];
  values.forEach(function (v) {
    opts.push('<option value="' + g.esc(v) + '"' + (selected === v ? ' selected' : '') + '>' + g.esc(v) + '</option>');
  });
  return opts.join('');
}

// --- Tab 1: 단원별 리소스 매트릭스 ---
function renderMatrix() {
  var container = document.getElementById('tab-matrix');
  var rows = state.matrix.filter(function (r) {
    return !state.matrixSubject || r.subject_name === state.matrixSubject;
  });

  var tableRows = rows.map(function (r) {
    var rate = r.avg_correct_rate != null ? Number(r.avg_correct_rate) : null;
    var rateHtml = rate != null
      ? '<span class="mini-bar ' + barClass(rate) + '"><div style="width:' + rate + '%"></div></span><span class="num ' + rateClass(rate) + '">' + rate + '%</span>'

      '<td style="text-align:center;border-left:2px solid var(--ink-200)">' + countBadge(r.question_count) + '</td>' +
      '<td class="num" style="text-align:center;color:var(--success-500)">' + (r.q_easy || 0) + '</td>' +
      '<td class="num" style="text-align:center;color:var(--brand-500)">' + (r.q_medium || 0) + '</td>' +
      '<td class="num" style="text-align:center;color:var(--danger-500)">' + (r.q_hard || 0) + '</td>' +
      '<td style="min-width:160px;border-left:2px solid var(--ink-200)">' + rateHtml + '</td>' +
      '<td style="text-align:center">' + stars(r.avg_rating) + '</td>' +

  }).join('');

  if (!tableRows) {
    tableRows = '<tr><td colspan="15" style="padding:30px;text-align:center;color:var(--ink-500)">조건에 맞는 단원이 없습니다</td></tr>';
  }

  var subjects = unique(state.matrix, 'subject_name');
  var controlsHtml =
    '<div class="controls">' +
      '<select id="mtx-subject">' + selectOptions(subjects, state.matrixSubject, '전체 과목') + '</select>' +
      '<div style="margin-left:auto;font-size:12px;color:var(--ink-500)">' +
        '<span class="count-cell count-some">N</span> 리소스 있음  ' +
        '<span class="count-cell count-0">0</span> 없음 (보강 필요)' +
      '</div>' +
    '</div>';

  container.innerHTML = controlsHtml +
    '<div class="scroll-x">' +
      '<table class="sheet">' +
        '<thead>' +
          '<tr class="group-row">' +
            '<th class="subject-head" rowspan="2">과목</th>' +
            '<th rowspan="2">#</th>' +
            '<th rowspan="2">단원</th>' +
            '<th rowspan="2">난이도</th>' +
            '<th colspan="5">학습 콘텐츠</th>' +
            '<th colspan="4" style="border-left:2px solid var(--ink-200)">문제 뱅크</th>' +
            '<th colspan="2" style="border-left:2px solid var(--ink-200)">품질 지표</th>' +
          '</tr>' +
          '<tr>' +
            '<th style="text-align:center">총</th>' +
            '<th style="text-align:center">교재</th>' +
            '<th style="text-align:center">영상</th>' +
            '<th style="text-align:center">문제집</th>' +
            '<th style="text-align:center">실습</th>' +
            '<th style="text-align:center;border-left:2px solid var(--ink-200)">총 문항</th>' +
            '<th style="text-align:center">하</th>' +
            '<th style="text-align:center">중</th>' +
            '<th style="text-align:center">상</th>' +
            '<th style="border-left:2px solid var(--ink-200)">평균 정답률</th>' +
            '<th style="text-align:center">콘텐츠 평점</th>' +
          '</tr>' +
        '</thead>' +
        '<tbody>' + tableRows + '</tbody>' +
      '</table>' +
    '</div>' +
    '<div class="t-micro" style="color:var(--ink-500);margin-top:8px;text-align:right">총 ' + rows.length + '단원 표시</div>';

  var sel = document.getElementById('mtx-subject');
  if (sel) sel.addEventListener('change', function (e) { state.matrixSubject = e.target.value; renderMatrix(); });
}

// --- Tab 2: 학습 콘텐츠 리스트 ---
function renderContents() {
  var container = document.getElementById('tab-contents');
  var rows = state.contents.filter(function (r) {
    if (state.contentSearch && (r.title || '').indexOf(state.contentSearch) < 0 && (r.content_code || '').indexOf(state.contentSearch) < 0) return false;
    if (state.contentSubject && r.subject_name !== state.contentSubject) return false;
    if (state.contentType && r.content_type !== state.contentType) return false;
    if (state.contentDiff && r.difficulty !== state.contentDiff) return false;
    return true;
  });

  var tableRows = rows.map(function (r) {
    return '<tr>' +
      '<td class="num" style="color:var(--ink-500);font-size:11px">' + g.esc(r.content_code || '') + '</td>' +
      '<td><div class="content-title">' + g.esc(r.title) + '</div><div class="content-meta">' + g.esc(r.tags || '') + '</div></td>' +
      '<td>' + g.esc(r.subject_name || '—') + '</td>' +
      '<td style="color:var(--ink-600);font-size:12px">' + g.esc(r.unit_name || '—') + '</td>' +
      '<td><span class="type-pill">' + g.esc(r.content_type || '—') + '</span></td>' +
      '<td style="color:var(--ink-600);font-size:12px">' + g.esc(r.format || '—') + '</td>' +
      '<td style="text-align:center">' + diffPill(r.difficulty) + '</td>' +
      '<td class="num" style="text-align:center">' + (r.estimated_minutes || 0) + '분</td>' +
      '<td style="color:var(--ink-600);font-size:12px">' + g.esc(r.author || '—') + '</td>' +
      '<td class="num" style="text-align:center">' + (r.usage_count || 0) + '</td>' +
      '<td style="text-align:center">' + stars(r.avg_rating) + '</td>' +
      '<td style="text-align:center">' + g.tag(r.status || '—', r.status === '활성' ? 'success' : 'neutral') + '</td>' +
      '</tr>';
  }).join('');

  if (!tableRows) {
    tableRows = '<tr><td colspan="12" style="padding:30px;text-align:center;color:var(--ink-500)">조건에 맞는 콘텐츠가 없습니다</td></tr>';
  }

  var subjects = unique(state.contents, 'subject_name');
  var types = unique(state.contents, 'content_type');
  var diffs = ['하', '중', '상'];

  var controlsHtml =
    '<div class="controls">' +
      '<input id="c-search" type="text" placeholder="제목·코드 검색…" value="' + g.esc(state.contentSearch) + '" style="width:200px">' +
      '<select id="c-subject">' + selectOptions(subjects, state.contentSubject, '전체 과목') + '</select>' +
      '<select id="c-type">' + selectOptions(types, state.contentType, '전체 유형') + '</select>' +
      '<select id="c-diff">' + selectOptions(diffs, state.contentDiff, '전체 난이도') + '</select>' +
    '</div>';

  container.innerHTML = controlsHtml +
    '<div class="scroll-x">' +
      '<table class="sheet">' +
        '<thead><tr>' +
          '<th>코드</th>' +
          '<th>제목 / 태그</th>' +
          '<th>과목</th>' +
          '<th>단원</th>' +
          '<th>유형</th>' +
          '<th>형식</th>' +
          '<th style="text-align:center">난이도</th>' +
          '<th style="text-align:center">소요</th>' +
          '<th>작성자</th>' +
          '<th style="text-align:center">사용</th>' +
          '<th style="text-align:center">평점</th>' +
          '<th style="text-align:center">상태</th>' +
        '</tr></thead>' +
        '<tbody>' + tableRows + '</tbody>' +
      '</table>' +
    '</div>' +
    '<div class="t-micro" style="color:var(--ink-500);margin-top:8px;text-align:right">총 ' + rows.length + '건 표시</div>';

  var cs = document.getElementById('c-search'); if (cs) cs.addEventListener('input', function (e) { state.contentSearch = e.target.value.trim(); renderContents(); });
  var csub = document.getElementById('c-subject'); if (csub) csub.addEventListener('change', function (e) { state.contentSubject = e.target.value; renderContents(); });
  var ct = document.getElementById('c-type'); if (ct) ct.addEventListener('change', function (e) { state.contentType = e.target.value; renderContents(); });
  var cd = document.getElementById('c-diff'); if (cd) cd.addEventListener('change', function (e) { state.contentDiff = e.target.value; renderContents(); });
}

// --- Tab 3: 문제 뱅크 ---
function renderQuestions() {
  var container = document.getElementById('tab-questions');
  var rows = state.questions.filter(function (r) {
    if (state.qSearch) {
      var hay = (r.question_text || '') + ' ' + (r.question_code || '') + ' ' + (r.tags || '');
      if (hay.indexOf(state.qSearch) < 0) return false;
    }
    if (state.qSubject && r.subject_name !== state.qSubject) return false;
    if (state.qType && r.question_type !== state.qType) return false;
    if (state.qDiff && r.difficulty !== state.qDiff) return false;
    return true;
  });

  var tableRows = rows.map(function (r) {
    var rate = r.correct_rate != null ? Number(r.correct_rate) : null;
    var rateHtml = rate != null
      ? '<span class="mini-bar ' + barClass(rate) + '"><div style="width:' + rate + '%"></div></span><span class="num ' + rateClass(rate) + '">' + rate + '%</span>'
      : '<span style="color:var(--ink-300)">—</span>';
    return '<tr>' +
      '<td class="num" style="color:var(--ink-500);font-size:11px;white-space:nowrap">' + g.esc(r.question_code || '') + '</td>' +
      '<td>' + g.esc(r.subject_name || '—') + '</td>' +
      '<td style="color:var(--ink-600);font-size:12px">' + g.esc(r.unit_name || '—') + '</td>' +
      '<td><span class="type-pill">' + g.esc(r.question_type || '—') + '</span></td>' +
      '<td style="text-align:center">' + diffPill(r.difficulty) + '</td>' +
      '<td class="q-text">' + g.esc(r.question_text || '') +
        '<div class="q-answer">정답: ' + g.esc(r.correct_answer || '—') + '</div>' +
        (r.tags ? '<div class="q-tags">#' + g.esc(r.tags).split(',').join(' #') + '</div>' : '') +
      '</td>' +
      '<td class="num" style="text-align:center">' + (r.usage_count || 0) + '</td>' +
      '<td style="min-width:160px">' + rateHtml + '</td>' +
      '</tr>';
  }).join('');

  if (!tableRows) {
    tableRows = '<tr><td colspan="8" style="padding:30px;text-align:center;color:var(--ink-500)">조건에 맞는 문제가 없습니다</td></tr>';
  }

  var subjects = unique(state.questions, 'subject_name');
  var types = unique(state.questions, 'question_type');
  var diffs = ['하', '중', '상'];

  var controlsHtml =
    '<div class="controls">' +
      '<input id="q-search" type="text" placeholder="문제·태그·코드 검색…" value="' + g.esc(state.qSearch) + '" style="width:220px">' +
      '<select id="q-subject">' + selectOptions(subjects, state.qSubject, '전체 과목') + '</select>' +
      '<select id="q-type">' + selectOptions(types, state.qType, '전체 유형') + '</select>' +
      '<select id="q-diff">' + selectOptions(diffs, state.qDiff, '전체 난이도') + '</select>' +
    '</div>';

  container.innerHTML = controlsHtml +
    '<div class="scroll-x">' +
      '<table class="sheet">' +
        '<thead><tr>' +
          '<th>코드</th>' +
          '<th>과목</th>' +
          '<th>단원</th>' +
          '<th>유형</th>' +
          '<th style="text-align:center">난이도</th>' +
          '<th>문제 / 정답</th>' +
          '<th style="text-align:center">사용</th>' +
          '<th>정답률</th>' +
        '</tr></thead>' +
        '<tbody>' + tableRows + '</tbody>' +
      '</table>' +
    '</div>' +
    '<div class="t-micro" style="color:var(--ink-500);margin-top:8px;text-align:right">총 ' + rows.length + '문항 표시</div>';

  var qs = document.getElementById('q-search'); if (qs) qs.addEventListener('input', function (e) { state.qSearch = e.target.value.trim(); renderQuestions(); });
  var qsub = document.getElementById('q-subject'); if (qsub) qsub.addEventListener('change', function (e) { state.qSubject = e.target.value; renderQuestions(); });
  var qt = document.getElementById('q-type'); if (qt) qt.addEventListener('change', function (e) { state.qType = e.target.value; renderQuestions(); });
  var qd = document.getElementById('q-diff'); if (qd) qd.addEventListener('change', function (e) { state.qDiff = e.target.value; renderQuestions(); });
}

// --- Tabs ---
function switchTab(name) {
  document.querySelectorAll('.tab').forEach(function (t) {
    t.classList.toggle('active', t.dataset.tab === name);
  });
  document.getElementById('tab-matrix').style.display = name === 'matrix' ? 'block' : 'none';
  document.getElementById('tab-contents').style.display = name === 'contents' ? 'block' : 'none';
  document.getElementById('tab-questions').style.display = name === 'questions' ? 'block' : 'none';
  if (name === 'matrix') renderMatrix();
  else if (name === 'contents') renderContents();
  else if (name === 'questions') renderQuestions();
}

function updateTs() {
  var el = document.getElementById('ts');
  if (el) {
    var now = new Date();
    el.textContent = '업데이트: ' + pad(now.getHours()) + ':' + pad(now.getMinutes());
  }
}

function showErr(msg) {
  document.getElementById('root').insertAdjacentHTML('beforeend',
    '<div style="padding:16px;color:var(--danger-500)">오류: ' + g.esc(msg) + ' <button onclick="location.reload()">다시 시도</button></div>');
}

async function init() {
  console.log('[init] contents/questions tracker starting');
  try {
    var kpiRes = await window.agentdb.executeQuery('kpis', {});
    var k = kpiRes.rows[0] || {};
    document.getElementById('kpis').innerHTML = g.kpiRow([
      { label: '학습 콘텐츠', value: g.fmtInt(k.total_contents) + '건' },
      { label: '문제 뱅크', value: g.fmtInt(k.total_questions) + '문항' },
      { label: '관리 과목', value: g.fmtInt(k.subject_count) + '개' },
      { label: '등록 단원', value: g.fmtInt(k.unit_count) + '개' },
      { label: '콘텐츠 평균 평점', value: (k.avg_content_rating ?? '—'), accent: 'good', sub: '5점 만점' },
      { label: '문제 평균 정답률', value: (k.avg_correct_rate ?? '—') + '%' },
    ]);

    var mRes = await window.agentdb.executeQuery('unit_matrix', {});
    state.matrix = mRes.rows;

    var cRes = await window.agentdb.executeQuery('contents_list', {});
    state.contents = cRes.rows;

    var qRes = await window.agentdb.executeQuery('questions_list', {});
    state.questions = qRes.rows;

    console.log('[data] matrix=', state.matrix.length, 'contents=', state.contents.length, 'questions=', state.questions.length);

    document.querySelectorAll('.tab').forEach(function (t) {
      t.addEventListener('click', function () { switchTab(t.dataset.tab); });
    });

    renderMatrix();
    updateTs();
    console.log('[render] done');
  } catch (e) {
    console.error('[error]', e.message);
    showErr(e.message);
  }
}

init();

</script>
</body>
</html>
