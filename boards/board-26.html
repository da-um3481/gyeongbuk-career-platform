    var bad = built.rows.filter(function (r) { return r.bad.length > 0; });

    var previewRows = built.rows.slice(0, 10);
    var cols = t.columns.filter(function (c) { return map[c.key] !== undefined; });
    var head = cols.map(function (c) { return '<th>' + esc(c.label) + '</th>'; }).join('') + '<th>검사</th>';
    var bodyHtml = previewRows.map(function (r) {
      var tds = cols.map(function (c) {
        var v = r.data[c.key];
        return '<td>' + (v === null || v === '' ? '—' : esc(v)) + '</td>';
      }).join('');
      var mark = r.bad.length
        ? '<td class="bad">' + esc(r.bad.join(', ')) + ' 확인</td>'
        : '<td>OK</td>';
      return '<tr class="' + (r.bad.length ? 'bad' : '') + '">' + tds + mark + '</tr>';
    }).join('');

    document.getElementById('cv-map').innerHTML = mapHtml;
    document.getElementById('cv-preview-body').innerHTML =
      '<div class="cv-scroll"><table class="cv-table"><thead><tr>' + head + '</tr></thead><tbody>' + bodyHtml + '</tbody></table></div>' +
      (built.rows.length > 10 ? '<div class="cv-hint">앞 10줄만 표시합니다. 전체 ' + built.rows.length + '줄.</div>' : '') +
      (built.truncated ? '<div class="cv-note err">한 번에 최대 ' + MAX_ROWS + '줄까지 등록합니다. 앞 ' + MAX_ROWS + '줄만 처리합니다.</div>' : '');

    var warn = '';
    if (built.missing.length) {
      warn += '<div class="cv-note err">필수 열이 없습니다: ' + esc(built.missing.join(', ')) + '</div>';
    }
    if (bad.length) {
      warn += '<div class="cv-note err">형식이 맞지 않는 줄 ' + bad.length + '개 — 아래 표에서 빨간 줄을 확인하세요. 해당 줄은 등록에서 제외됩니다.</div>';
    }
    if (!built.missing.length && !bad.length) {
      warn += '<div class="cv-note ok">검사 통과: ' + valid.length + '건을 등록할 수 있습니다.</div>';
    }
    document.getElementById('cv-preview-body').insertAdjacentHTML('beforeend', warn);

    document.getElementById('cv-preview-card').style.display = 'block';
    document.getElementById('cv-import').disabled = (valid.length === 0 || built.missing.length > 0);
    setCount('전체 ' + built.total + '줄 · 등록 가능 ' + valid.length + '건' + (bad.length ? ' · 제외 ' + bad.length + '건' : ''));
  }

  // ---------- 등록 ----------
  async function doImport() {
    var built = state.built;
    if (!built) return;
    var valid = built.rows.filter(function (r) { return r.bad.length === 0; });
    if (!valid.length) return;

    var btn = document.getElementById('cv-import');
    btn.disabled = true;
    btn.textContent = '등록 중…';
    try {
      var payload = JSON.stringify(valid.map(function (r) { return r.data; }));
      var res = await window.agentdb.executeQuery(state.target.query, { payload: payload });
      var inserted = (res.affected_rows != null) ? res.affected_rows : (res.row_count || 0);
      var skipped = valid.length - inserted;
      console.log('[event] import done: ' + inserted + ' inserted / ' + valid.length + ' sent');

      var msg = '<div class="cv-note ok"><b>' + inserted + '건</b>의 ' + esc(state.target.noun) +
        '를 등록했습니다.</div>';
      if (skipped > 0) {
        msg += '<div class="cv-note info">' + skipped + '건은 이미 등록되어 있어 건너뛰었거나, ' +
          (state.target.id === 'students' ? '학생코드가 중복' : '학생코드·과목·단원·평가명이 기존 데이터와 연결되지 않아') +
          ' 반영되지 않았습니다. 값 표기를 확인해 주세요.</div>';
      }
      document.getElementById('cv-result').innerHTML = msg;
      document.getElementById('cv-result-card').style.display = 'block';
      setCount('등록 완료 · ' + inserted + '건 반영');
    } catch (e) {
      console.error('[error]', e.message);
      document.getElementById('cv-result').innerHTML =
        '<div class="cv-note err">등록 실패: ' + esc(e.message) + '</div>';
      document.getElementById('cv-result-card').style.display = 'block';
    } finally {
      btn.textContent = '등록';
      btn.disabled = false;
    }
  }

  // ---------- 초기화 ----------
  function boot() {
    console.log('[init] starting');
    var sel = document.getElementById('cv-target');
    sel.innerHTML = TARGETS.map(function (t) {
      return '<option value="' + t.id + '">' + esc(t.label) + '</option>';
    }).join('');
    state.target = TARGETS[0];
    renderColumns();

    sel.addEventListener('change', function (e) {
      state.target = targetById(e.target.value);
      renderColumns();
      reset();
      console.log('[event] target = ' + state.target.id);
    });

    document.getElementById('cv-file').addEventListener('change', function (e) {
      var f = e.target.files && e.target.files[0];
      if (!f) return;
      var reader = new FileReader();
      reader.onload = function () {
        document.getElementById('csv-text').value = String(reader.result || '');
        console.log('[event] file loaded: ' + f.name);
        preview();
      };
      reader.onerror = function () { setCount('파일을 읽지 못했습니다.'); };
      reader.readAsText(f, 'utf-8');
    });

    document.getElementById('cv-sample').addEventListener('click', function () {
      document.getElementById('csv-text').value = state.target.sample;
      reset();
      setCount('예시를 채웠습니다. 미리보기를 눌러 확인하세요.');
    });

    document.getElementById('cv-clear').addEventListener('click', function () {
      document.getElementById('csv-text').value = '';
      document.getElementById('cv-file').value = '';
      reset();
    });

    document.getElementById('cv-preview').addEventListener('click', preview);
    document.getElementById('cv-import').addEventListener('click', doImport);

    document.getElementById('ts').textContent = '기준 ' +
      new Date().toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').hidden = false;
    console.log('[init] done');
  }

  window.Csv = { boot: boot, parseCSV: parseCSV, buildRows: buildRows, TARGETS: TARGETS };
})();

</script>
  <script>
// 진입점 — CSV 일괄 등록 화면을 초기화합니다.
(function () {
  function boot() {
    if (!window.Csv || typeof window.Csv.boot !== 'function') {
      console.error('[error] Csv module missing');
      var el = document.getElementById('error');
      if (el) {
        el.textContent = 'Error: csv module failed to load';
        el.style.display = 'flex';
        document.getElementById('loading').style.display = 'none';
      }
      return;
    }
    window.Csv.boot();
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();

</script>
