<html lang="ko" data-palette="graphite" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>다움진로진학컨설팅 — 진학 및 학습 맞춤엔진</title>
<style>
  :root {
    --ink-0:#FFFEFB; --ink-50:#F3EFE5; --ink-100:#ECE6D7; --ink-200:#DFD7C3; --ink-300:#C8BEA5;
    --ink-400:#9A8E72; --ink-500:#6E6450; --ink-600:#4A4234; --ink-700:#322C22; --ink-800:#1F1B15; --ink-900:#100E0B;
    --brand-500:#A0501F; --success-500:#0F8A5E; --warn-500:#B86E16; --danger-500:#B42318;
    --surface-0: var(--ink-0);
  }
  html, body { height: 100%; margin: 0; background: var(--ink-50); color: var(--ink-900); font-family: 'Pretendard','Inter',-apple-system,BlinkMacSystemFont,sans-serif; }
  * { box-sizing: border-box; word-break: keep-all; }

  /* 레이아웃 셸 */
  .shell { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }
  .side { background: var(--ink-0); border-right: 1px solid var(--ink-100); padding: 14px 10px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 4px 6px 14px; border-bottom: 1px solid var(--ink-100); margin-bottom: 10px; }
  .brand .mk { width: 32px; height: 32px; border-radius: 8px; background: var(--brand-500); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; flex: 0 0 auto; }
  .brand .nm { font-size: 13px; font-weight: 700; line-height: 1.25; color: var(--ink-900); }
  .brand .nm small { display: block; font-size: 11px; font-weight: 500; color: var(--ink-500); margin-top: 2px; }

  .nav-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px; font-size: 13px; color: var(--ink-700); text-decoration: none; cursor: pointer; user-select: none; }
  .nav-item:hover { background: var(--ink-50); color: var(--ink-900); }
  .nav-item.active { background: var(--brand-500); color: #fff; }
  .nav-item .ic { width: 18px; text-align: center; font-size: 13px; opacity: .85; }
  .nav-item.active .ic { opacity: 1; }
  .nav-section-label { font-size: 10px; letter-spacing: .08em; color: var(--ink-400); padding: 10px 10px 4px; text-transform: uppercase; }
  .nav-more { font-size: 12px; color: var(--ink-500); padding: 6px 10px; cursor: pointer; }
  .nav-more:hover { color: var(--brand-500); }
  .nav-more .caret { display: inline-block; transition: transform .15s; }
  .nav-more.open .caret { transform: rotate(90deg); }

  /* 메인 영역 */
  .main { display: flex; flex-direction: column; min-width: 0; }
  .top { position: sticky; top: 0; z-index: 20; background: var(--ink-0); border-bottom: 1px solid var(--ink-100); padding: 10px 20px; display: flex; align-items: center; gap: 12px; }
  .top .hamb { display: none; width: 36px; height: 36px; border: 1px solid var(--ink-200); border-radius: 8px; background: #fff; cursor: pointer; font-size: 18px; align-items: center; justify-content: center; }
  .search { flex: 1; max-width: 520px; position: relative; }
  .search input { width: 100%; height: 36px; border: 1px solid var(--ink-200); border-radius: 10px; padding: 0 36px 0 36px; font-size: 13px; background: var(--ink-50); color: var(--ink-900); outline: none; }
  .search input:focus { border-color: var(--brand-500); background: #fff; }
  .search .mg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--ink-500); font-size: 14px; }
  .search .clear { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); border: none; background: transparent; color: var(--ink-500); cursor: pointer; display: none; }
  #srDrop { position: absolute; top: 42px; left: 0; right: 0; background: #fff; border: 1px solid var(--ink-200); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.08); max-height: 420px; overflow-y: auto; display: none; }
  #srDrop .sr-section { padding: 6px 12px; font-size: 10px; letter-spacing: .06em; color: var(--ink-400); background: var(--ink-50); position: sticky; top: 0; }
  #srDrop .sr-item { display: flex; justify-content: space-between; gap: 10px; padding: 8px 12px; cursor: pointer; border-bottom: 1px solid var(--ink-50); }
  #srDrop .sr-item:hover { background: var(--ink-50); }
  #srDrop .sr-t { font-size: 13px; color: var(--ink-900); font-weight: 600; }
  #srDrop .sr-sub { font-size: 12px; color: var(--ink-500); margin-top: 2px; }
  #srDrop .sr-empty { padding: 14px; color: var(--ink-500); font-size: 13px; text-align: center; }

  .top .right { margin-left: auto; display: flex; align-items: center; gap: 10px; color: var(--ink-500); font-size: 12px; }
  .top .right button { height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--ink-200); background: #fff; cursor: pointer; font-size: 12px; color: var(--ink-700); }
  .top .right button:hover { color: var(--brand-500); border-color: var(--brand-500); }

  #route { padding: 20px; min-height: calc(100vh - 56px); }

  /* 공통 UI */
  .hero { margin-bottom: 16px; }
  .hero .micro { font-size: 11px; color: var(--brand-500); font-weight: 600; letter-spacing: .04em; }
  .hero h1 { margin: 4px 0 6px; font-size: 20px; color: var(--ink-900); }
  .hero p { margin: 0; color: var(--ink-600); font-size: 13px; }

  .kpis { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin-bottom: 14px; }
  .kpi { background: #fff; border: 1px solid var(--ink-100); border-radius: 10px; padding: 12px 14px; }
  .kpi .k { font-size: 11px; color: var(--ink-500); }
  .kpi .v { font-size: 16px; font-weight: 700; color: var(--ink-900); line-height: 1.3; margin-top: 2px; }

  .panels { display: grid; gap: 14px; }
  .panels.two { grid-template-columns: 1fr 1fr; }
  .panels.three { grid-template-columns: 2fr 1fr 1fr; }
  .panel { background: #fff; border: 1px solid var(--ink-100); border-radius: 10px; padding: 14px; min-width: 0; }
  .ph { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; gap: 8px; }
  .pt { font-size: 13px; font-weight: 700; color: var(--ink-900); }
  .pa { font-size: 11px; color: var(--ink-500); }

  .tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .tbl th { text-align: left; padding: 8px 10px; color: var(--ink-500); font-weight: 500; font-size: 11px; letter-spacing: .02em; border-bottom: 1px solid var(--ink-100); white-space: nowrap; }
  .tbl td { padding: 8px 10px; color: var(--ink-800); border-bottom: 1px solid var(--ink-50); }
  .tbl td.num, .tbl th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .tbl tr:last-child td { border-bottom: none; }
  .tbl tr.row-link { cursor: pointer; }
  .tbl tr.row-link:hover td { background: var(--ink-50); }
  .tbl td .mini-btn { height: 24px; padding: 0 8px; border-radius: 6px; border: 1px solid var(--ink-200); background: #fff; cursor: pointer; font-size: 11px; color: var(--ink-700); }
  .tbl td .mini-btn:hover { color: var(--brand-500); border-color: var(--brand-500); }

  .pill { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; background: var(--ink-100); color: var(--ink-700); }
  .pill.pill-ok { background: #DCF4E6; color: var(--success-500); }
  .pill.pill-warn { background: #FBEBD0; color: var(--warn-500); }
  .pill.pill-danger { background: #FBE1DE; color: var(--danger-500); }
  .pill.pill-brand { background: #FBE9DD; color: var(--brand-500); }

  .empty { text-align: center; padding: 20px; color: var(--ink-500); font-size: 13px; }
  .err-note { background: #FBE1DE; color: var(--danger-500); padding: 10px 12px; border-radius: 8px; font-size: 12px; }
  .skl { height: 10px; background: linear-gradient(90deg, var(--ink-100), var(--ink-50), var(--ink-100)); background-size: 200% 100%; border-radius: 5px; animation: shimmer 1.2s infinite; }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

  /* 가이드 카드 */
  .steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 14px; }
  .step { background: #fff; border: 1px solid var(--ink-100); border-radius: 10px; padding: 12px 14px; }
  .step .no { font-size: 10px; color: var(--brand-500); font-weight: 700; }
  .step .ti { font-size: 14px; font-weight: 700; color: var(--ink-900); margin: 4px 0; }
  .step .de { font-size: 11.5px; color: var(--ink-600); line-height: 1.5; }
  .core { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .ccard { display: block; background: var(--ink-50); border: 1px solid var(--ink-100); border-radius: 10px; padding: 10px 12px; text-decoration: none; color: inherit; cursor: pointer; }
  .ccard:hover { background: #fff; border-color: var(--brand-500); }
  .ccard .ck { font-size: 10px; color: var(--brand-500); }
  .ccard .ct { font-size: 13px; font-weight: 700; color: var(--ink-900); margin-top: 2px; }
  .ccard .cd { font-size: 11px; color: var(--ink-500); margin-top: 2px; }

  /* 학생 요약 페이지 */
  .stu-head { display: flex; gap: 14px; align-items: center; margin-bottom: 16px; background: #fff; border: 1px solid var(--ink-100); border-radius: 12px; padding: 14px 16px; }
  .stu-head .av { width: 48px; height: 48px; border-radius: 50%; background: var(--brand-500); color: #fff; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; font-size: 18px; flex: 0 0 auto; }
  .stu-head .nm { font-size: 18px; font-weight: 700; color: var(--ink-900); }
  .stu-head .sub { font-size: 12px; color: var(--ink-500); margin-top: 2px; }
  .stu-head .right-btns { margin-left: auto; display: flex; gap: 8px; }
  .btn { height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--ink-200); background: #fff; cursor: pointer; font-size: 12px; color: var(--ink-700); display: inline-flex; align-items: center; gap: 4px; }
  .btn:hover { color: var(--brand-500); border-color: var(--brand-500); }
  .btn.primary { background: var(--brand-500); color: #fff; border-color: var(--brand-500); }
  .btn.primary:hover { background: #8A4319; color: #fff; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
  .kv { display: grid; grid-template-columns: 80px 1fr; gap: 6px 10px; font-size: 12.5px; }
  .kv .k { color: var(--ink-500); }
  .kv .v { color: var(--ink-800); }

  /* 모달 */
  .modal-mask { position: fixed; inset: 0; background: rgba(23,20,16,.4); display: none; align-items: center; justify-content: center; z-index: 50; padding: 20px; }
  .modal-mask.show { display: flex !important; }
  .modal { background: #fff; border-radius: 12px; padding: 18px 20px; width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; }
  .modal h3 { margin: 0 0 12px; font-size: 15px; color: var(--ink-900); }
  .modal label { display: block; font-size: 11px; color: var(--ink-600); margin: 8px 0 2px; }
  .modal input, .modal select, .modal textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--ink-200); border-radius: 8px; font-size: 13px; background: #fff; color: var(--ink-900); font-family: inherit; }
  .modal textarea { min-height: 70px; resize: vertical; }
  .modal .foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }

  /* 토스트 */
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink-900); color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 12.5px; z-index: 100; opacity: 0; transition: opacity .2s; }
  .toast.show { opacity: 1; }

  /* 모바일 */
  @media (max-width: 820px) {
    .shell { grid-template-columns: 1fr; }
    .side { position: fixed; z-index: 40; top: 0; left: 0; width: 260px; transform: translateX(-100%); transition: transform .2s; box-shadow: 0 0 40px rgba(0,0,0,.1); }
    .side.open { transform: translateX(0); }
    .top .hamb { display: inline-flex; }
    .kpis { grid-template-columns: repeat(2, 1fr); }
    .panels.two, .panels.three { grid-template-columns: 1fr; }
    .steps, .core { grid-template-columns: repeat(2, 1fr); }
    .grid2, .grid3 { grid-template-columns: 1fr; }
    #route { padding: 14px; }
    /* 테이블 → 카드 전환 */
    .tbl.m-cards { display: block; }
    .tbl.m-cards thead { display: none; }
    .tbl.m-cards tbody, .tbl.m-cards tr { display: block; }
    .tbl.m-cards tr { background: var(--ink-50); border-radius: 10px; padding: 8px 10px; margin-bottom: 8px; }
    .tbl.m-cards td { display: flex; justify-content: space-between; padding: 4px 0; border: none; gap: 10px; }
    .tbl.m-cards td::before { content: attr(data-label); font-size: 11px; color: var(--ink-500); flex: 0 0 90px; }
    .tbl.m-cards td.num { text-align: right; }
    #mobile-mask { position: fixed; inset: 0; background: rgba(0,0,0,.3); z-index: 39; display: none; }
    #mobile-mask.show { display: block; }
  }

  /* --- 단독 실행판 부가 스타일 --- */
  html, body { font-family:'Pretendard','Inter','Malgun Gothic','Apple SD Gothic Neo',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
  #sa-badge { display:inline-flex; align-items:center; gap:5px; height:24px; padding:0 9px; border-radius:999px;
    background:#FBE9DD; color:var(--brand-500); font-size:11px; font-weight:700; cursor:help; }
  #sa-badge::before { content:''; width:6px; height:6px; border-radius:50%; background:var(--brand-500); }
  #sa-note { margin:2px 6px 10px; padding:8px 10px; border-radius:8px; background:var(--ink-50); border:1px dashed var(--ink-200);
    font-size:10.5px; line-height:1.5; color:var(--ink-500); }
  #sa-note b { color:var(--ink-700); }
</style>
</head>

/* =====================================================================

   - 이 파일은 서버·DB 없이 브라우저에서 단독 실행하기 위한 shim 입니다.
   - window.__DATA__ 에 내장된 스냅샷으로 등록 쿼리 결과를 대신 돌려줍니다.

(function () {

  var DATA = window.__DATA__ || {};

  function num(v){ var n = Number(v); return isFinite(n) ? n : null; }
  function today(){
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function iso10(v){ return v == null ? null : String(v).slice(0,10); }

  /* ---------- localStorage 복원 ---------- */
  try {

    try { localStorage.setItem(LS_KEY, JSON.stringify({ v:1, at:new Date().toISOString(), data:DATA })); }

  }

    if (!params) return name;
    var ks = Object.keys(params).filter(function(k){ return params[k] !== undefined; });

      if (!m) return;
      var sid = +m[1];
      DATA[k] = { rows: all.filter(function(r){ return +r.student_id === sid; }).sort(byCreated).slice(0,20)
        .map(function(r){ return { id:r.id, student_id:r.student_id,
          report_period_start:r.report_period_start, report_period_end:r.report_period_end,
          report_type:r.report_type, status:r.status, sent_date:r.sent_date || null, created_at:r.created_at }; }) };
    });

    if (DATA['wa_reports']) DATA['wa_reports'] = { rows: all.sort(byCreated).slice(0,100)
      .map(function(r){ return { id:r.id, student_id:r.student_id,
        report_period:period(r.report_period_start, r.report_period_end, r.report_type),
        student_name:r.student_name, created_at:r.created_at, sent_at:r.sent_date || null, status:r.status }; }) };

    if (DATA['wa_home_drafts']) DATA['wa_home_drafts'] = { rows: all.filter(function(r){ return !r.sent_date; })
      .sort(byCreated).slice(0,20)
      .map(function(r){ return { report_period:period(r.report_period_start, r.report_period_end, r.report_type),
        student_name:r.student_name, created_at:r.created_at, status:r.status }; }) };

    all.forEach(function(r){ DATA['wa_report_one#rid=' + r.id] = { rows:[r] }; });

    var sm = (DATA['wa_summary'] || {}).rows && DATA['wa_summary'].rows[0];
    if (sm) sm.unsent = all.filter(function(r){ return !r.sent_date; }).length;
  }

  function rebuildRoadmaps(){
    var tlist = Object.keys(TARGETS).map(function(id){ return TARGETS[id]; });
    var slist = Object.keys(STEPS).map(function(id){ return STEPS[id]; });

    Object.keys(DATA).forEach(function(k){
      var m = /^wa_stu_roadmap#sid=(\d+)$/.exec(k);
      if (!m) return;
      var sid = +m[1];
      DATA[k] = { rows: tlist.filter(function(t){ return +t.sid === sid; }).sort(function(a,b){ return a.__ord - b.__ord; })
        .map(function(t){
          var st = slist.filter(function(s){ return +s.target_id === +t.target_id; });
          return { target_id:t.target_id, university:t.university, department:t.department,
            admission_type:t.admission_type, target_year:t.target_year, required_grade:t.required_grade,
            priority:t.priority, target_status:t.target_status,
            step_count:st.length, done_steps:st.filter(function(s){ return s.status === '완료'; }).length };
        }) };
    });

    Object.keys(DATA).forEach(function(k){
      var m = /^wa_stu_roadmap_steps#sid=(\d+)$/.exec(k);
      if (!m) return;
      var sid = +m[1];
      DATA[k] = { rows: slist.filter(function(s){ return +s.sid === sid; }).sort(function(a,b){ return a.__ord - b.__ord; })
        .map(function(s){ return { id:s.id, target_id:s.target_id, university:s.university, department:s.department,
          school_year:s.school_year, semester:s.semester, category:s.category, title:s.title,
          target_date:s.target_date, status:s.status }; }) };
    });

    if (DATA['wa_roadmap']) {
      var rows = slist.map(function(s){
        var t = TARGETS[s.target_id]; if (!t) return null;
        return { student_name:(STUDENTS[t.sid] || {}).name || '',
          target_name: t.university + (t.department ? ' · ' + t.department : ''),
          step_order: s.id,
          step_name: (s.category ? s.category + ' · ' : '') + s.title,
          due_period: s.school_year ? (s.school_year + '학년 ' + s.semester + '학기') : (s.target_date || ''),
          status: s.status, __pri: t.priority == null ? 9999 : t.priority, __t: s.target_date || '' };
      }).filter(Boolean);
      rows.sort(function(a,b){
        return String(a.student_name).localeCompare(String(b.student_name)) || (a.__pri - b.__pri)
          || String(a.__t).localeCompare(String(b.__t)) || (a.step_order - b.step_order);
      });
      DATA['wa_roadmap'] = { rows: rows.slice(0,100).map(function(r){ delete r.__pri; delete r.__t; return r; }) };
    }
  }

  function rebuildCounsels(){
    Object.keys(DATA).forEach(function(k){
      var m = /^wa_stu_counsel#sid=(\d+)$/.exec(k);
      if (!m) return;
      var sid = +m[1];
      DATA[k] = { rows: COUNSELS.filter(function(c){ return +c.sid === sid; })
        .sort(function(a,b){ return String(b.session_date || '').localeCompare(String(a.session_date || '')); })
        .slice(0,10)
        .map(function(c){ return { session_date:c.session_date, counselor:c.counselor, topic:c.topic,
          content_preview:String(c.content || '').slice(0,140), prescription_preview:String(c.prescription || '').slice(0,120),
          next_date:c.next_date, status:c.status }; }) };
    });
    if (DATA['wa_counsel']) DATA['wa_counsel'] = { rows: COUNSELS
      .sort(function(a,b){ return String(b.session_date || '').localeCompare(String(a.session_date || '')); })
      .slice(0,100)
      .map(function(c){ return { session_date:c.session_date, student_name:(STUDENTS[c.sid] || {}).name || '',
        session_type:c.topic, counselor_name:c.counselor, summary:String(c.content || '').slice(0,80) }; }) };
  }

  function rebuildStudentRecent(sid){
    var k = 'wa_stu_recent#sid=' + sid;
    if (!DATA[k]) return;
    var cls = Object.keys(CLASSES).map(function(id){ return CLASSES[id]; })
      .filter(function(c){ return +c.student_id === sid; })
      .map(function(c){ return { kind:'수업', d:c.class_date, subject:c.subject_name, title:c.topic || '',
        status:c.attendance || c.status, score:null }; })
      .sort(function(a,b){ return String(b.d || '').localeCompare(String(a.d || '')); }).slice(0,10);
    var hw = Object.keys(HOMEWORK).map(function(id){ return HOMEWORK[id]; })
      .filter(function(h){ return +h.student_id === sid; })
      .map(function(h){ return { kind:'숙제', d:h.due_date, subject:h.subject_name, title:h.title,
        status:h.status, score:h.score }; })
      .sort(function(a,b){ return String(b.d || '').localeCompare(String(a.d || '')); }).slice(0,10);
    DATA[k] = { rows: cls.concat(hw).sort(function(a,b){ return String(b.d || '').localeCompare(String(a.d || '')); }).slice(0,20) };
  }

  /* ---------- 검색 (wa_search 대체) ---------- */
  function doSearch(kw){
    var q = kw.toLowerCase();
    var hit = function(v){ return v != null && String(v).toLowerCase().indexOf(q) >= 0; };
    var C = window.__SEARCH__ || {};
    var out = [];
    (C.students || []).forEach(function(s){
      if (hit(s.name) || hit(s.student_code) || hit(s.school))
        out.push({ kind:'student', ref_id:String(s.id), title:s.name,
          subtitle:[s.student_code, s.school, s.grade].filter(Boolean).join(' · '), as_of:null });
    });
    (C.orgs || []).forEach(function(o){
      if (hit(o.name) || hit(o.region))
        out.push({ kind:'org', ref_id:String(o.id), title:o.name,
          subtitle:[o.org_type, o.region].filter(Boolean).join(' · '), as_of:null });
    });
    (C.tests || []).forEach(function(t){
      if (hit(t.test_type) || hit(t.test_name) || hit(t.summary) || hit(t.student_name))
        out.push({ kind:'test', ref_id:String(t.id), title:(t.student_name || '') + ' · ' + (t.test_type || ''),
          subtitle:(t.overall_label || String(t.summary || '').slice(0,40)), as_of:t.test_date });
    });
    (C.counsels || []).forEach(function(c){
      if (hit(c.content) || hit(c.topic) || hit(c.student_name))
        out.push({ kind:'counsel', ref_id:String(c.id), title:(c.student_name || '') + ' · ' + (c.topic || '상담'),
          subtitle:String(c.content || '').slice(0,50), as_of:c.session_date });
    });
    out.sort(function(a,b){
      if (a.kind !== b.kind) return a.kind < b.kind ? -1 : 1;
      var av = a.as_of || '', bv = b.as_of || '';
      if (av === bv) return 0;
      if (!av) return 1;
      if (!bv) return -1;
      return av < bv ? 1 : -1;
    });
    return out.slice(0,30);
  }

  /* ---------- 쓰기 ---------- */
  var W = {
    wa_m_step_toggle: function(p){
      var id = num(p.sid);
      Object.keys(STEPS).forEach(function(k){ if (num(STEPS[k].id) === id) STEPS[k].status = p.status; });
      rebuildRoadmaps();
    },
    wa_m_report_send: function(p){
      var r = REPORTS[num(p.rid)];
      if (r) { r.sent_date = today(); r.status = '발송'; }
      rebuildReports();
    },
    wa_m_report_update: function(p){
      var r = REPORTS[num(p.rid)]; if (!r) return;
      if (p.start) r.report_period_start = p.start;
      if (p.end) r.report_period_end = p.end;
      if (p.rtype) r.report_type = p.rtype;
      r.overall_progress = p.overall || null; r.strengths = p.strengths || null;
      r.areas_for_improvement = p.improve || null; r.teacher_comments = p.comments || null;
      r.next_period_goals = p.goals || null;
      rebuildReports();
    },
    wa_m_report_add: function(p){
      var sid = num(p.sid);
      var id = 0;
      Object.keys(REPORTS).forEach(function(k){ id = Math.max(id, Number(k)); });
      REPORTS[id + 1] = { id:id + 1, student_id:sid, student_name:(STUDENTS[sid] || {}).name || '',
        report_period_start:p.start, report_period_end:p.end, report_type:p.rtype,
        overall_progress:p.overall || null, strengths:p.strengths || null,
        areas_for_improvement:p.improve || null, teacher_comments:p.comments || null,
        next_period_goals:p.goals || null, status:'초안', sent_date:null, created_at:new Date().toISOString() };
      rebuildReports();
    },
    wa_m_target_add: function(p){
      var sid = num(p.sid), id = 0;
      Object.keys(TARGETS).forEach(function(k){ id = Math.max(id, Number(k)); });
      TARGETS[id + 1] = { sid:sid, target_id:id + 1, university:p.university, department:p.department || '',
        admission_type:p.admission_type || '', target_year:p.target_year ? Number(p.target_year) : null,
        required_grade:p.required_grade || null, priority:p.priority ? Number(p.priority) : 3,
        target_status:'검토', __ord:1e6 + id };
      rebuildRoadmaps();
    },
    wa_m_counsel_add: function(p){
      var sid = num(p.sid);
      COUNSELS.push({ sid:sid, session_date:p.d, counselor:p.counselor, topic:p.topic,
        content:p.content || '', prescription:p.prescription || '',
        next_date:p.next_date || null, status:'완료' });
      rebuildCounsels();
      var sm = (DATA['wa_summary'] || {}).rows && DATA['wa_summary'].rows[0];
      if (sm) sm.counsel = (Number(sm.counsel) || 0) + 1;
    },
    wa_m_cls_att: function(p){
      var c = CLASSES[num(p.cid)]; if (!c) return;
      c.attendance = p.attendance; c.status = p.attendance;
      ((DATA['wa_home_recent_classes'] || {}).rows || []).forEach(function(r){
        if (r.class_date === c.class_date && r.start_time === c.start_time && r.student_name === c.student_name)
          r.status = c.status;
      });
      if (c.student_id != null) rebuildStudentRecent(num(c.student_id));
    },
    wa_m_hw_score: function(p){
      var h = HOMEWORK[num(p.hid)]; if (!h) return;
      h.status = p.status; h.score = (p.score == null ? '' : p.score);
      if (h.student_id != null) rebuildStudentRecent(num(h.student_id));
    }
  };

  /* ---------- Bridge 대체 ---------- */
  window.agentdb = {
    executeQuery: async function(name, params){
      params = params || {};
      if (name === 'wa_search') return { rows: doSearch(String(params.kw || '')) };
      var k = keyOf(name, params);
      if (DATA[k]) return { rows: DATA[k].rows || [] };
      if (W[name]) { W[name](params); persist(); return { rows: [] }; }
      if (DATA[name]) return { rows: DATA[name].rows || [] };
      throw new Error('오프라인 모드에 "' + name + '" 데이터가 없습니다');
    },
    getSchema: async function(){ return { tables: [] }; },
    getAppInfo: async function(){
      return { id:'standalone', name:'다움 통합 웹앱 (단독 실행)', scope:'workspace' };
    },
    print: function(){ window.print(); },
    downloadPdf: function(){ window.print(); }
  };

  /* ---------- 배너 ---------- */
  window.__standaloneInfo = { snapshot_at: SNAPSHOT_AT };

  window.addEventListener('DOMContentLoaded', function(){
    var rst = document.getElementById('sa-reset');
    if (rst) rst.onclick = function(){
      if (confirm('내장 스냅샷 상태로 되돌립니다. 이 브라우저에 저장된 변경사항이 삭제됩니다. 계속할까요?'))
        window.__resetStandalone();
    };
  });
})();

</script>

    {k:'created_at',h:'작성일',fmt:'date'},{k:'sent_at',h:'발송일',fmt:'date'},{k:'status',h:'상태',fmt:'pill'}]},
  onboarding:  { q:'wa_onboard',      label:'기관 온보딩', hint:'기관별 8단계 진행률', cols:[
    {k:'name',h:'기관'},{k:'org_type',h:'유형'},{k:'student_count',h:'학생',fmt:'num'},
    {k:'done_steps',h:'완료 단계',fmt:'num'},{k:'progress_pct',h:'진행률 %',fmt:'num'}]},
  guide:       { kind:'intro' },
};

</script>
<script>
// 다움 통합 웹앱 — 메인 셸, 라우팅, 전역 검색, 학생 요약, 인라인 편집, 모바일 햄버거.
(function () {
  const CORE = window.CORE_NAV, MORE = window.MORE_NAV, T = window.TABLE_ROUTES;
  const db = window.agentdb;

  // ---------- 유틸 ----------
  function esc(v){const d=document.createElement('div');d.textContent=v==null?'':String(v);return d.innerHTML;}
  function fmtDate(v){if(!v)return'';return String(v).slice(0,10);}
  function fmtNum(v){if(v==null||v==='')return'';const n=Number(v);if(!isFinite(n))return esc(v);return n.toLocaleString('ko-KR');}
  function pillClass(v){const s=String(v||'');
    if(/완료|발송|운영중|정상|진행|확정|제출|출석/i.test(s))return'pill pill-ok';
    if(/대기|예정|미발송|초안|준비|보류|지각|배부/i.test(s))return'pill pill-warn';
    if(/실패|지연|미제출|경고|취소|중단|종료|결석/i.test(s))return'pill pill-danger';
    return'pill';}
  function updateTs(){const el=document.getElementById('ts');if(!el)return;
    el.textContent='기준 '+new Date().toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});}
  function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800);}

  // ---------- 사이드바 ----------
  function renderNav(){
    const nav = document.getElementById('nav');
    nav.replaceChildren();
    const lab = document.createElement('div');lab.className='nav-section-label';lab.textContent='핵심 메뉴';nav.append(lab);
    CORE.forEach(r=>{
      const a=document.createElement('a');a.className='nav-item';a.href='#'+r.id;a.dataset.id=r.id;
      a.innerHTML='<span class="ic">'+esc(r.icon)+'</span><span>'+esc(r.label)+'</span>';
      nav.append(a);
    });
    const more = document.createElement('div');more.className='nav-more';more.id='moreToggle';
    more.innerHTML='<span class="caret">▸</span> 더 보기 ('+MORE.length+')';
    nav.append(more);
    const moreList = document.createElement('div');moreList.id='moreList';moreList.style.display='none';
    MORE.forEach(r=>{
      const a=document.createElement('a');a.className='nav-item';a.href='#'+r.id;a.dataset.id=r.id;
      a.innerHTML='<span class="ic">·</span><span style="font-size:12px">'+esc(r.label)+'</span>';
      moreList.append(a);
    });
    nav.append(moreList);
    more.onclick = ()=>{const open = moreList.style.display!=='none';moreList.style.display=open?'none':'block';more.classList.toggle('open',!open);};
    // 모바일 메뉴 선택 시 닫기
    nav.addEventListener('click',(e)=>{if(e.target.closest('.nav-item')){document.getElementById('side').classList.remove('open');document.getElementById('mobile-mask').classList.remove('show');}});
  }
  function setActive(id){
    document.querySelectorAll('.nav-item').forEach(el=>el.classList.toggle('active',el.dataset.id===id));
  }

  // ---------- 라우팅 ----------
  function parseHash(){
    const h = (location.hash||'#home').replace(/^#/,'');
    const [id, arg] = h.split('/');
    return {id, arg};
  }
  function go(path){if('#'+path!==location.hash)location.hash=path;else render();}
  async function render(){
    const {id, arg} = parseHash();
    const root = document.getElementById('route');
    const navId = (id==='stu'||id==='org') ? (id==='stu'?'students':'orgs') : id;
    setActive(navId);
    root.innerHTML = '<div class="skl" style="width:40%; margin-bottom:10px"></div><div class="skl" style="width:85%; margin-bottom:6px"></div><div class="skl" style="width:70%"></div>';
    try{
      if(id==='home')         return await renderHome(root);
      if(id==='students')     return await renderStudentsPick(root);
      if(id==='stu')          return await renderStudentHub(root, parseInt(arg,10));
      if(id==='orgs')         return await renderOrgsList(root);
      if(id==='org')          return await renderOrgDetail(root, parseInt(arg,10));
      if(id==='prep')         return await renderPrep(root, parseInt(arg,10));
      if(id==='daily')        return await renderDaily(root);
      if(id==='tests')        return await renderTestsReports(root);
      if(id==='rx')           return await renderRxPaths(root);
      if(id==='settings')     return renderSettings(root);
      if(id==='guide')        return renderGuide(root);
      if(T[id])               return await renderTable(root, id);
      root.innerHTML = '<div class="err-note">알 수 없는 화면: '+esc(id)+'</div>';
    }catch(e){
      console.error(e);
      root.innerHTML = '<div class="err-note">오류: '+esc(e.message||e)+'</div>';
    }
    updateTs();
  }

  // ---------- 홈 ----------
  async function renderHome(root){
    root.innerHTML =
      '<div class="hero"><div class="micro">홈</div><h1>전체 운영 현황</h1><p>학생·기관·일정·관리 필요·리포트 요약.</p></div>'+
      '<div class="kpis" id="kpis"></div>'+
      '<div class="panels two"><div class="panel" id="pa"></div><div class="panel" id="pb"></div></div>'+
      '<div class="panels two" style="margin-top:14px"><div class="panel" id="pc"></div><div class="panel" id="pd"></div></div>';

    async function stage(fn){try{await fn();}catch(e){console.error(e);}await new Promise(r=>setTimeout(r,0));}

    await stage(async()=>{
      const r = await db.executeQuery('wa_summary',{});
      const s = (r.rows&&r.rows[0])||{};
      document.getElementById('kpis').innerHTML = [
        ['관리 중 학생',s.students],['등록 기관',s.orgs],['이번 달 수업',s.classes_month],
        ['진단 검사',s.tests],['상담 기록',s.counsel],['미발송 리포트',s.unsent]
      ].map(x=>'<div class="kpi"><div class="k">'+esc(x[0])+'</div><div class="v">'+esc(fmtNum(x[1]))+'</div></div>').join('');
    });

    await stage(async()=>{
      const r = await db.executeQuery('wa_home_recent_classes',{});
      document.getElementById('pa').innerHTML =
        '<div class="ph"><div class="pt">최근·다가오는 수업</div><div class="pa">일자 가까운 순 10건</div></div>'+
        tableHtml(r.rows,[{k:'class_date',h:'일자',fmt:'date'},{k:'start_time',h:'시간'},{k:'student_name',h:'학생',link:'stu'},
          {k:'subject_name',h:'과목'},{k:'status',h:'상태',fmt:'pill'}]);
    });

    await stage(async()=>{
      const r = await db.executeQuery('wa_home_attention',{});
      document.getElementById('pb').innerHTML =
        '<div class="ph"><div class="pt">관리 필요</div><div class="pa">진도<70%</div></div>'+
        tableHtml(r.rows,[{k:'student_name',h:'학생',link:'stu'},{k:'subject_name',h:'과목'},
          {k:'unit_name',h:'단원'},{k:'progress_pct',h:'진도 %',fmt:'num'}]);
    });

    await stage(async()=>{
      const r = await db.executeQuery('wa_home_drafts',{});
      document.getElementById('pc').innerHTML =
        '<div class="ph"><div class="pt">미발송 리포트</div><div class="pa">학부모 리포트</div></div>'+
        tableHtml(r.rows,[{k:'report_period',h:'기간'},{k:'student_name',h:'학생',link:'stu'},
          {k:'created_at',h:'작성일',fmt:'date'},{k:'status',h:'상태',fmt:'pill'}]);
    });

    await stage(async()=>{
      const r = await db.executeQuery('wa_home_orgs',{});
      document.getElementById('pd').innerHTML =
        '<div class="ph"><div class="pt">기관 현황</div><div class="pa">학생 수</div></div>'+
        tableHtml(r.rows,[{k:'name',h:'기관'},{k:'org_type',h:'유형'},
          {k:'student_count',h:'학생',fmt:'num'},{k:'status',h:'상태',fmt:'pill'}]);
    });
  }

  // ---------- 학생 찾기 ----------
  async function renderStudentsPick(root){
    root.innerHTML =
      '<div class="hero"><div class="micro">학생</div><h1>학생 찾기</h1><p>상단 검색창 또는 아래 목록에서 학생을 선택하면 요약 페이지가 열립니다.</p></div>'+
      '<div class="panel" id="pSt"></div>';
    const r = await db.executeQuery('wa_students_pick',{});
    document.getElementById('pSt').innerHTML =
      '<div class="ph"><div class="pt">전체 학생</div><div class="pa">'+r.rows.length+'명</div></div>'+
      tableHtml(r.rows,[{k:'name',h:'이름',link:'stu'},{k:'grade',h:'학년'},
        {k:'school',h:'학교'},{k:'org_name',h:'소속 기관'}], 'stu');
  }

  // ---------- 학생 요약 페이지 (#stu/<id>) ----------
  async function renderStudentHub(root, sid){
    if(!sid){root.innerHTML='<div class="err-note">학생 번호가 없습니다.</div>';return;}
    root.innerHTML =
      '<div id="stuHead"></div>'+
      '<div class="grid2" style="margin-bottom:14px"><div class="panel" id="sB"></div><div class="panel" id="sR"></div></div>'+
      '<div class="grid2" style="margin-bottom:14px"><div class="panel" id="sP"></div><div class="panel" id="sT"></div></div>'+
      '<div class="grid2" style="margin-bottom:14px"><div class="panel" id="sG"></div><div class="panel" id="sRm"></div></div>'+
      '<div class="grid2"><div class="panel" id="sC"></div><div class="panel" id="sRep"></div></div>';

    async function stage(fn){try{await fn();}catch(e){console.error(e);}}

    await stage(async()=>{
      const r = await db.executeQuery('wa_stu_basic',{sid});
      const s = (r.rows&&r.rows[0])||null;
      if(!s){document.getElementById('stuHead').innerHTML='<div class="err-note">학생을 찾을 수 없습니다.</div>';return;}
      document.getElementById('stuHead').innerHTML =
        '<div class="stu-head"><div class="av">'+esc((s.name||'?').charAt(0))+'</div>'+
        '<div><div class="nm">'+esc(s.name)+'</div><div class="sub">'+
        [...new Set([s.student_code,s.grade,s.school,s.org_name].filter(Boolean))].map(esc).join(' · ')+'</div></div>'+
        '<div class="right-btns">'+
        '<button class="btn" id="btnCounsel">+ 상담 기록</button>'+
        '<button class="btn primary" id="btnPrep">상담 준비 열기</button>'+
        '</div></div>';
      document.getElementById('btnCounsel').onclick=()=>openCounselModal(sid, s.name);
      document.getElementById('btnPrep').onclick=()=>go('prep/'+sid);

      document.getElementById('sB').innerHTML =
        '<div class="ph"><div class="pt">기본정보</div></div>'+
        '<div class="kv">'+
        kvRow('학교', s.school)+kvRow('학년', s.grade)+
        kvRow('소속 기관', (s.org_name||'')+(s.org_type?' ('+s.org_type+')':''))+
        kvRow('학부모', [s.parent_name,s.parent_phone,s.parent_email].filter(Boolean).join(' · '))+
        kvRow('학습 스타일', s.learning_style)+kvRow('목표', s.learning_goal)+
        kvRow('상태', s.status)+kvRow('등록일', fmtDate(s.enrolled_date))+
        '</div>';
    });

    await stage(async()=>{
      const r = await db.executeQuery('wa_stu_recent',{sid});
      document.getElementById('sR').innerHTML =
        '<div class="ph"><div class="pt">최근 수업·숙제</div><div class="pa">최신 20건</div></div>'+
        tableHtml(r.rows,[{k:'kind',h:'',fmt:'pill'},{k:'d',h:'일자',fmt:'date'},
          {k:'subject',h:'과목'},{k:'title',h:'내용'},{k:'status',h:'상태',fmt:'pill'}]);
    });

    await stage(async()=>{
      const r = await db.executeQuery('wa_stu_progress',{sid});
      document.getElementById('sP').innerHTML =
        '<div class="ph"><div class="pt">진도·성취</div><div class="pa">단원별</div></div>'+
        tableHtml(r.rows,[{k:'subject_name',h:'과목'},{k:'unit_name',h:'단원'},
          {k:'progress_pct',h:'진도 %',fmt:'num'},{k:'achievement',h:'성취',fmt:'num'}]);
    });

    await stage(async()=>{
      const r = await db.executeQuery('wa_stu_tests',{sid});
      document.getElementById('sT').innerHTML =
        '<div class="ph"><div class="pt">검사 결과</div><div class="pa">MLST·MCDT·NEO</div></div>'+
        tableHtml(r.rows,[{k:'test_date',h:'일자',fmt:'date'},{k:'test_type',h:'검사'},
          {k:'overall_label',h:'결과'},{k:'summary',h:'요약'}]);
    });

    await stage(async()=>{
      const r = await db.executeQuery('wa_stu_grades',{sid});
      document.getElementById('sG').innerHTML =
        '<div class="ph"><div class="pt">내신 성적·등급</div></div>'+
        tableHtml(r.rows,[{k:'school_year',h:'학년도'},{k:'semester',h:'학기'},
          {k:'subject_name',h:'과목'},{k:'achievement',h:'성취'},{k:'grade',h:'등급',fmt:'num'}]);
    });

    await stage(async()=>{
      const [tr, sr] = await Promise.all([
        db.executeQuery('wa_stu_roadmap',{sid}),
        db.executeQuery('wa_stu_roadmap_steps',{sid}),
      ]);
      const panel = document.getElementById('sRm');
      panel.innerHTML =
        '<div class="ph"><div class="pt">진학 목표·로드맵</div>'+
        '<div><button class="mini-btn" id="btnAddTarget">+ 희망 대학</button></div></div>'+
        tableHtml(tr.rows,[{k:'university',h:'대학'},{k:'department',h:'학과'},
          {k:'admission_type',h:'전형'},{k:'target_year',h:'연도',fmt:'num'},
          {k:'done_steps',h:'완료',fmt:'num'},{k:'step_count',h:'전체',fmt:'num'}])+
        renderRoadmapSteps(sr.rows||[]);
      panel.querySelector('#btnAddTarget').onclick=()=>openTargetModal(sid);
      panel.querySelectorAll('input[data-step]').forEach(cb=>cb.onchange=async()=>{
        const stepId = parseInt(cb.dataset.step,10);
        const newStatus = cb.checked ? '완료' : '예정';
        try{ await db.executeQuery('wa_m_step_toggle',{sid:stepId, status:newStatus}); toast(newStatus+' 처리됨'); render(); }
        catch(err){ toast('실패: '+(err.message||err)); cb.checked=!cb.checked; }
      });
    });

    await stage(async()=>{
      const r = await db.executeQuery('wa_stu_counsel',{sid});
      document.getElementById('sC').innerHTML =
        '<div class="ph"><div class="pt">상담 기록·처방</div></div>'+
        tableHtml(r.rows,[{k:'session_date',h:'일자',fmt:'date'},{k:'topic',h:'주제'},
          {k:'content_preview',h:'내용'},{k:'next_date',h:'다음',fmt:'date'}]);
    });

    await stage(async()=>{
      const r = await db.executeQuery('wa_stu_reports',{sid});
      const rows = (r.rows||[]).map(x=>{
        const isDraft = !x.sent_date;
        const parts = [];
        if(isDraft) parts.push('<button class="mini-btn" data-edit="'+x.id+'">수정</button>');
        if(isDraft) parts.push('<button class="mini-btn" data-send="'+x.id+'">발송</button>');
        return {...x, action: parts.join(' ')};
      });
      const panel = document.getElementById('sRep');
      panel.innerHTML =
        '<div class="ph"><div class="pt">학부모 리포트</div>'+
        '<div><button class="mini-btn" id="btnAddReport">+ 리포트 작성</button></div></div>'+
        tableHtml(rows,[{k:'report_period_start',h:'시작',fmt:'date'},{k:'report_period_end',h:'종료',fmt:'date'},
          {k:'status',h:'상태',fmt:'pill'},{k:'sent_date',h:'발송',fmt:'date'},{k:'action',h:'',raw:true}]);
      panel.querySelector('#btnAddReport').onclick=()=>openReportModal(sid, null);
      panel.querySelectorAll('button[data-edit]').forEach(b=>b.onclick=(e)=>{e.stopPropagation();openReportModal(sid, parseInt(b.dataset.edit,10));});
      panel.querySelectorAll('button[data-send]').forEach(b=>b.onclick=async(e)=>{
        e.stopPropagation();
        const rid = parseInt(b.dataset.send,10);
        try{ await db.executeQuery('wa_m_report_send',{rid}); toast('리포트 발송 처리됨'); render(); }
        catch(err){ toast('실패: '+(err.message||err)); }
      });
    });
  }

  function kvRow(k,v){return '<div class="k">'+esc(k)+'</div><div class="v">'+esc(v==null||v===''?'-':v)+'</div>';}

  // ---------- 기관 현황 (목록 + 상세) ----------
  async function renderOrgsList(root){
    root.innerHTML =
      '<div class="hero"><div class="micro">기관</div><h1>기관 현황</h1><p>학교·지자체 센터·개인 — 기관을 선택하면 상세 현황이 열립니다.</p></div>'+
      '<div class="panel" id="pO"></div>';
    const r = await db.executeQuery('wa_orgs_pick',{});
    const rows = r.rows.map(x=>({...x, _link_org: x.id}));
    document.getElementById('pO').innerHTML =
      '<div class="ph"><div class="pt">전체 기관</div><div class="pa">'+r.rows.length+'곳</div></div>'+
      tableHtml(rows,[{k:'name',h:'기관',link:'org'},{k:'org_type',h:'유형',fmt:'pill'},
        {k:'region',h:'지역'},{k:'student_count',h:'학생',fmt:'num'},{k:'status',h:'상태',fmt:'pill'}], 'org');
  }

  async function renderOrgDetail(root, oid){
    if(!oid){root.innerHTML='<div class="err-note">기관 번호가 없습니다.</div>';return;}
    root.innerHTML =
      '<div id="orgHead"></div>'+
      '<div class="kpis" id="orgKpis"></div>'+
      '<div class="panels two"><div class="panel" id="orgInfo"></div><div class="panel" id="orgStu"></div></div>';

    const [d, st] = await Promise.all([
      db.executeQuery('wa_org_detail',{oid}),
      db.executeQuery('wa_org_students',{oid}),
    ]);
    const o = (d.rows&&d.rows[0])||null;
    if(!o){root.innerHTML='<div class="err-note">기관을 찾을 수 없습니다.</div>';return;}

    document.getElementById('orgHead').innerHTML =
      '<div class="stu-head"><div class="av" style="background:var(--ink-700)">'+esc((o.name||'?').charAt(0))+'</div>'+
      '<div><div class="nm">'+esc(o.name)+'</div><div class="sub">'+
      [o.org_type,o.region,o.program_name,o.cohort].filter(Boolean).map(esc).join(' · ')+'</div></div>'+
      '<div class="right-btns"><button class="btn" onclick="location.hash=\'#orgs\'">← 목록</button></div></div>';

    document.getElementById('orgKpis').innerHTML = [
      ['학생',o.student_count],['이번 달 수업',o.classes_month],
      ['30일 상담',o.counsel_30d],['미발송 리포트',o.unsent_reports],
    ].map(x=>'<div class="kpi"><div class="k">'+esc(x[0])+'</div><div class="v">'+esc(fmtNum(x[1]))+'</div></div>').join('');

    document.getElementById('orgInfo').innerHTML =
      '<div class="ph"><div class="pt">기관 정보</div></div>'+
      '<div class="kv">'+
      kvRow('유형',o.org_type)+kvRow('지역',o.region)+kvRow('주소',o.address)+
      kvRow('담당',[o.contact_name,o.contact_phone,o.contact_email].filter(Boolean).join(' · '))+
      kvRow('프로그램',o.program_name)+kvRow('기수',o.cohort)+
      kvRow('기간',[fmtDate(o.start_date),fmtDate(o.end_date)].filter(Boolean).join(' ~ '))+
      kvRow('정원',o.student_quota)+kvRow('상태',o.status)+kvRow('비고',o.note)+
      '</div>';

    document.getElementById('orgStu').innerHTML =
      '<div class="ph"><div class="pt">소속 학생</div><div class="pa">'+(st.rows||[]).length+'명</div></div>'+
      tableHtml(st.rows,[{k:'name',h:'이름',link:'stu'},{k:'grade',h:'학년'},
        {k:'avg_progress',h:'평균 진도',fmt:'num'},{k:'test_count',h:'검사',fmt:'num'},
        {k:'counsel_count',h:'상담',fmt:'num'},{k:'unsent',h:'미발송',fmt:'num'}], 'stu');
  }

  // ---------- 상담 준비 (#prep 또는 #prep/<sid>) ----------

  // ---------- 표 유틸 ----------
  // forceLink: 'stu' → 이 표의 row.id 는 학생 id / 'org' → row.id 는 기관 id
  // student_id 컬럼이 있으면 그 값이 항상 우선한다(리포트·수업처럼 id 가 다른 엔티티일 때).
  const A = 'style="color:var(--brand-500);text-decoration:none;font-weight:600" onclick="event.stopPropagation()"';
  function tableHtml(rows, cols, forceLink){
    if(!rows||!rows.length) return '<div class="empty">표시할 자료가 없습니다.</div>';
    const stuIdOf = r => (r.student_id!=null ? r.student_id : (forceLink==='stu' ? r.id : null));
    const head = '<tr>'+cols.map(c=>'<th class="'+(c.fmt==='num'?'num':'')+'">'+esc(c.h)+'</th>').join('')+'</tr>';
    const body = rows.slice(0,100).map(row=>{
      const stu = stuIdOf(row);
      const linkTo = row._link_prep ? ('prep/'+row._link_prep) :
                     row._link_org  ? ('org/'+row._link_org) :
                     forceLink==='org' ? (row.id ? 'org/'+row.id : '') :
                     (stu!=null ? ('stu/'+stu) : '');
      const trAttr = linkTo ? ' class="row-link" data-link="'+esc(linkTo)+'"' : '';
      return '<tr'+trAttr+'>'+cols.map(c=>{
        let v = row[c.k];
        if(c.raw) return '<td>'+(v||'')+'</td>';
        if(c.fmt==='date') v = fmtDate(v);
        else if(c.fmt==='num') v = fmtNum(v);
        else if(c.fmt==='pill' && v!=null && v!=='') return '<td data-label="'+esc(c.h)+'"><span class="'+pillClass(v)+'">'+esc(v)+'</span></td>';
        if((c.link==='stu'||c.link==='prep') && stu!=null) return '<td data-label="'+esc(c.h)+'"><a href="#'+(c.link==='prep'?'prep/':'stu/')+stu+'" '+A+'>'+esc(v)+'</a></td>';
        if(c.link==='org' && row.id) return '<td data-label="'+esc(c.h)+'"><a href="#org/'+row.id+'" '+A+'>'+esc(v)+'</a></td>';
        return '<td data-label="'+esc(c.h)+'" class="'+(c.fmt==='num'?'num':'')+'">'+esc(v==null?'':v)+'</td>';
      }).join('')+'</tr>';
    }).join('');
    const more = rows.length>100 ? '<div class="pa" style="margin-top:8px">상위 100건만 표시</div>' : '';
    const html = '<table class="tbl m-cards"><thead>'+head+'</thead><tbody>'+body+'</tbody></table>'+more;
    // 행 클릭 바인딩은 호출부 밖에서 — 간단히 inline onclick 생략, 대신 아래 전역 바인딩 사용
    return html;
  }

  // ---------- 전역 행 클릭 (row-link data-link) ----------
  document.addEventListener('click',(e)=>{
    const tr = e.target.closest('tr.row-link');
    if(tr && !e.target.closest('a,button')){
      const lk = tr.dataset.link;
      if(lk) location.hash = '#'+lk;

  // ---------- 전역 검색 ----------
  let srTimer=null;
  function initSearch(){
    const inp = document.getElementById('srInput');
    const drop = document.getElementById('srDrop');
    const clr = document.getElementById('srClear');
    inp.addEventListener('input',()=>{
      clr.style.display = inp.value ? 'inline' : 'none';
      clearTimeout(srTimer);
      const kw = inp.value.trim();
      if(!kw){drop.style.display='none';return;}
      srTimer = setTimeout(()=>runSearch(kw), 220);
    });
    clr.onclick=()=>{inp.value='';clr.style.display='none';drop.style.display='none';inp.focus();};
    document.addEventListener('click',(e)=>{if(!e.target.closest('.search')) drop.style.display='none';});
    inp.addEventListener('focus',()=>{if(drop.innerHTML) drop.style.display='block';});
  }
  async function runSearch(kw){
    const drop = document.getElementById('srDrop');
    drop.innerHTML = '<div class="sr-empty">검색 중…</div>';drop.style.display='block';
    try{
      const r = await db.executeQuery('wa_search',{kw});
      const rows = r.rows||[];
      if(!rows.length){drop.innerHTML='<div class="sr-empty">검색 결과 없음</div>';return;}
      const groups = {student:[],org:[],test:[],counsel:[]};
      rows.forEach(x=>{(groups[x.kind]||(groups[x.kind]=[])).push(x);});
      const labels = {student:'학생', org:'기관', test:'검사', counsel:'상담'};
      let html = '';
      ['student','org','test','counsel'].forEach(k=>{
        if(!groups[k]||!groups[k].length) return;
        html += '<div class="sr-section">'+labels[k]+'</div>';
        groups[k].forEach(x=>{
          const hash = k==='student' ? 'stu/'+x.ref_id : k==='org' ? 'org/'+x.ref_id : k==='test' ? 'tests' : 'counsel';
          html += '<div class="sr-item" data-h="'+esc(hash)+'">'+
            '<div><div class="sr-t">'+esc(x.title)+'</div><div class="sr-sub">'+esc(x.subtitle||'')+'</div></div>'+
            '<div style="color:var(--ink-400);font-size:11px;align-self:center">'+esc(fmtDate(x.as_of))+'</div></div>';
        });
      });
      drop.innerHTML = html;
      drop.querySelectorAll('.sr-item').forEach(el=>el.onclick=()=>{location.hash='#'+el.dataset.h;drop.style.display='none';document.getElementById('srInput').value='';document.getElementById('srClear').style.display='none';});
    }catch(e){drop.innerHTML='<div class="sr-empty">오류: '+esc(e.message||e)+'</div>';}
  }

      '<label>상담사</label><input type="text" id="mCn" placeholder="예: 다움컨설턴트" />'+
      '<label>주제</label><select id="mT"><option>진학</option><option>학습</option><option>진로</option><option>생활</option></select>'+
      '<label>상담 내용</label><textarea id="mCo" placeholder="상담 요지"></textarea>'+
      '<label>처방 (선택)</label><textarea id="mPr" placeholder="학습 처방"></textarea>'+
      '<label>다음 상담 예정일 (선택)</label><input type="date" id="mN" />'+
      '<div class="foot"><button class="btn" onclick="_closeModal()">취소</button><button class="btn primary" id="mSave">저장</button></div>'
    );
    document.getElementById('mSave').onclick=async()=>{
      const d=document.getElementById('mD').value;
      const counselor=document.getElementById('mCn').value||'다움컨설턴트';
      const topic=document.getElementById('mT').value;
      const content=document.getElementById('mCo').value;
      const presc=document.getElementById('mPr').value;
      const nd=document.getElementById('mN').value;
      if(!content.trim()){toast('상담 내용을 입력하세요');return;}
      try{
        await db.executeQuery('wa_m_counsel_add',{sid, d, counselor, topic, content, prescription:presc||null, next_date:nd||null});
        closeModal(); toast('상담 기록 추가됨'); render();
      }catch(e){ toast('실패: '+(e.message||e)); }
    };
  }

  // 로드맵 단계 체크리스트(목표별로 그룹)
  function renderRoadmapSteps(steps){
    if(!steps.length) return '<div class="empty" style="padding:14px">등록된 로드맵 단계가 없습니다.</div>';
    const grouped = {};
    steps.forEach(s=>{
      const key = s.target_id || 'none';
      if(!grouped[key]) grouped[key] = {uni: s.university||'(목표 없음)', dept: s.department||'', items: []};
      grouped[key].items.push(s);
    });
    const blocks = Object.keys(grouped).map(k=>{
      const g = grouped[k];
      const title = esc(g.uni) + (g.dept?' · '+esc(g.dept):'');
      const items = g.items.map(s=>{
        const done = s.status==='완료';
        const when = s.school_year ? (s.school_year+'학년 '+s.semester+'학기') : (s.target_date?fmtDate(s.target_date):'');
        return '<label style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--ink-50);font-size:12.5px;cursor:pointer">'+
          '<input type="checkbox" data-step="'+s.id+'" '+(done?'checked':'')+' />'+
          '<span style="flex:1;color:'+(done?'var(--ink-400)':'var(--ink-800)')+';text-decoration:'+(done?'line-through':'none')+'">'+
          (s.category?'<span class="pill pill-brand" style="margin-right:6px">'+esc(s.category)+'</span>':'')+
          esc(s.title)+'</span>'+
          '<span style="color:var(--ink-500);font-size:11px">'+esc(when)+'</span></label>';
      }).join('');
      return '<div style="margin-top:10px"><div style="font-size:11px;font-weight:700;color:var(--brand-500);margin-bottom:4px">'+title+'</div>'+items+'</div>';
    }).join('');
    return '<div style="margin-top:10px;border-top:1px solid var(--ink-100);padding-top:10px">'+
      '<div class="pa" style="margin-bottom:4px">단계 체크</div>'+blocks+'</div>';
  }

  // 희망 대학 추가 모달
  function openTargetModal(sid){
    openModal(
      '<h3>희망 대학 추가</h3>'+
      '<label>대학 *</label><input type="text" id="tU" placeholder="예: 서울대학교" />'+
      '<label>학과</label><input type="text" id="tD" placeholder="예: 컴퓨터공학과" />'+
      '<label>전형</label><select id="tA"><option value="">선택</option><option>학생부종합</option><option>학생부교과</option><option>논술</option><option>정시</option><option>특기자</option><option>기타</option></select>'+
      '<label>목표 연도</label><input type="number" id="tY" placeholder="예: 2028" min="2026" max="2035" />'+
      '<label>필요 등급 (평균)</label><input type="number" id="tG" placeholder="예: 2.5" step="0.1" min="1" max="9" />'+
      '<label>우선순위 (1-5, 작을수록 높음)</label><input type="number" id="tP" value="3" min="1" max="5" />'+
      '<label>메모</label><textarea id="tN" placeholder="메모"></textarea>'+
      '<div class="foot"><button class="btn" onclick="_closeModal()">취소</button><button class="btn primary" id="mSave">추가</button></div>'
    );
    document.getElementById('mSave').onclick=async()=>{
      const uni=document.getElementById('tU').value.trim();
      if(!uni){toast('대학명을 입력하세요');return;}
      try{
        await db.executeQuery('wa_m_target_add',{
          sid, university:uni,
          department:document.getElementById('tD').value,
          admission_type:document.getElementById('tA').value,
          target_year:document.getElementById('tY').value,
          required_grade:document.getElementById('tG').value,
          priority:document.getElementById('tP').value,
          note:document.getElementById('tN').value,
        });
        closeModal(); toast('목표 추가됨'); render();
      }catch(e){ toast('실패: '+(e.message||e)); }
    };
  }

  // 리포트 작성/수정 모달 (rid=null 이면 신규)
  async function openReportModal(sid, rid){
    let r = null;
    if(rid){
      try{ const q = await db.executeQuery('wa_report_one',{rid}); r = q.rows && q.rows[0]; sid = sid || (r && r.student_id); }
      catch(e){ toast('불러오기 실패: '+(e.message||e)); return; }
    }
    if(!sid){toast('학생을 알 수 없습니다');return;}
    const today = new Date();
    const monStart = new Date(today.getFullYear(), today.getMonth(), 1).toISOString().slice(0,10);
    const monEnd = new Date(today.getFullYear(), today.getMonth()+1, 0).toISOString().slice(0,10);
    const v = (k, def)=> esc(r && r[k]!=null ? r[k] : (def==null?'':def));
    openModal(
      '<h3>'+(rid?'리포트 수정':'리포트 작성')+(r?' — '+esc(r.student_name||''):'')+'</h3>'+
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">'+
        '<div><label>기간 시작</label><input type="date" id="rS" value="'+(r?fmtDate(r.report_period_start):monStart)+'" /></div>'+
        '<div><label>기간 종료</label><input type="date" id="rE" value="'+(r?fmtDate(r.report_period_end):monEnd)+'" /></div>'+
      '</div>'+
      '<label>유형</label><select id="rT">'+
        ['월간','주간','학기','특별'].map(x=>'<option '+(r&&r.report_type===x?'selected':'')+'>'+x+'</option>').join('')+
      '</select>'+
      '<label>전반적 진전</label><textarea id="rOv" placeholder="학습 전반의 진척">'+v('overall_progress')+'</textarea>'+
      '<label>강점</label><textarea id="rSt" placeholder="학생의 강점">'+v('strengths')+'</textarea>'+
      '<label>개선 영역</label><textarea id="rIm" placeholder="보완할 점">'+v('areas_for_improvement')+'</textarea>'+
      '<label>컨설턴트 코멘트</label><textarea id="rCm">'+v('teacher_comments')+'</textarea>'+
      '<label>다음 기간 목표</label><textarea id="rGl">'+v('next_period_goals')+'</textarea>'+
      '<div class="foot"><button class="btn" onclick="_closeModal()">취소</button><button class="btn primary" id="mSave">저장</button></div>'
    );
    document.getElementById('mSave').onclick=async()=>{
      const payload = {
        start:document.getElementById('rS').value,
        end:document.getElementById('rE').value,
        rtype:document.getElementById('rT').value,
        overall:document.getElementById('rOv').value,
        strengths:document.getElementById('rSt').value,
        improve:document.getElementById('rIm').value,
        comments:document.getElementById('rCm').value,
        goals:document.getElementById('rGl').value,
      };
      try{
        if(rid) await db.executeQuery('wa_m_report_update',{rid, ...payload});
        else    await db.executeQuery('wa_m_report_add',{sid, ...payload});
        closeModal(); toast(rid?'리포트 수정됨':'리포트 작성됨'); render();
      }catch(e){ toast('실패: '+(e.message||e)); }
    };
  }

  // ---------- 모바일 햄버거 ----------
  function initHamb(){
    const hamb = document.getElementById('hamb');
    const side = document.getElementById('side');
    const mask = document.getElementById('mobile-mask');
    hamb.onclick=()=>{side.classList.add('open');mask.classList.add('show');};
    mask.onclick=()=>{side.classList.remove('open');mask.classList.remove('show');};
  }

  // ---------- 부팅 ----------
  function boot(){
    renderNav(); initSearch(); initHamb();
    window.addEventListener('hashchange',()=>{render();updateTs();});
    document.getElementById('refresh').onclick=()=>{render();updateTs();};
    render();
    console.log('[init] done');
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot();
})();

</script>
</body>
</html>
