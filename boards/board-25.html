        <p class="t-body" style="margin:8px 0 0">학생을 고르면 진도·출결·평가·AI 세션 데이터를 모아 리포트 초안을 자동으로 만듭니다. 검토 후 직접 발송하세요.</p>
      </div>
      <span class="gs-pill"><span class="dot"></span><span id="ts">—</span></span>
    </div>

    <div class="rp-setup">
      <div class="rp-fg">
        <label for="s-student">학생</label>
        <select id="s-student"></select>
      </div>
      <div class="rp-fg">
        <label for="s-type">리포트 유형</label>
        <select id="s-type">
          <option value="월간">월간</option>
          <option value="학기">학기</option>
        </select>
      </div>
      <div class="rp-fg">
        <label for="s-from">기간 시작</label>
        <input type="date" id="s-from">
      </div>
      <div class="rp-fg">
        <label for="s-to">기간 종료</label>
        <input type="date" id="s-to">
      </div>
      <button class="rp-btn rp-btn-primary" id="generate">리포트 생성</button>
    </div>

    <div class="rp-layout">
      <div class="rp-card">
        <div class="rp-card-head">
          <div class="t">리포트 미리보기</div>
          <span class="gs-pill" id="previewBadge" style="display:none"><span class="dot"></span><span id="previewBadgeText">초안</span></span>
        </div>
        <div class="rp-card-body" id="preview">
          <div class="rp-empty">학생과 기간을 선택한 뒤 <b>리포트 생성</b>을 눌러 주세요.</div>
        </div>
      </div>

      <div class="rp-card">
        <div class="rp-card-head"><div class="t">저장된 리포트</div><span class="gs-pill" id="draftCount">0</span></div>
        <div class="rp-card-body" id="drafts">
          <div class="rp-empty">학생을 선택하면 저장된 리포트가 표시됩니다.</div>
        </div>
      </div>
    </div>
  </div>

  <div class="rp-toast" id="toast"></div>

  <script>
// 학부모 리포트 생성기 — 학생·기간을 고르면 진도/출결/평가/AI세션 데이터를 모아
// 리포트 초안 텍스트를 만들고 parent_reports 에 '초안' 상태로 저장합니다.
(function () {
  var g = window.gsDash;

  var state = {
    students: [],
    studentId: null,
    type: '월간',
    from: '',
    to: '',
    generated: null, // { overall, attendance, assessment, strengths, areas, summary, suggestedGoals }
  };

  function esc(s) { return g.esc(s == null ? '' : String(s)); }
  function num(v) { var n = Number(v); return isNaN(n) ? 0 : n; }
  function pad(n) { return String(n).padStart(2, '0'); }
  function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function lastDay(y, m) { return new Date(y, m + 1, 0).getDate(); }

  function toast(msg, ok) {
    var t = document.getElementById('toast');
    if (!t) return;
    t.textContent = msg;
    t.className = 'rp-toast show ' + (ok ? 'ok' : 'err');
    setTimeout(function () { t.className = 'rp-toast ' + (ok ? 'ok' : 'err'); }, 2800);
  }

  var PLACEHOLDER = /^(없음|해당\s*없음|해당없음|무|미해당|없슴|특이\s*사항\s*없음|n\/?a|-+|–+)$/i;
  var OVERALL = /^(전\s*영역|전반적\s*우수|전반적으로\s*우수|전반적\s*향상)$/;
  function isPlaceholder(s) { return PLACEHOLDER.test(String(s).trim()); }

  // '없음 - 심화 도전 추천' 처럼 총평 뒤에 부가설명이 붙은 값을 통째로 제거하고,
  // 쉼표·가운뎃점·하이픈 나열을 항목 단위로 분리합니다.
  function splitList(str) {
    if (!str) return [];
    var s = String(str)
      .replace(/(^|[,、·])\s*(?:없음|해당\s*없음|해당없음|무|미해당|없슴)\s*[-–—:]\s*[^,、·]*/gi, '$1')
      .replace(/\s+[-–—]\s+/g, ',');
    return s.split(/[,、·]/)
      .map(function (v) { return v.trim().replace(/\s+/g, ' '); })
      .filter(function (v) { return v && !isPlaceholder(v); });
  }

  // '개념 연결' ⊂ '개념 간 연결' 처럼 한 표현이 다른 표현의 부분수열이면 중복으로 봅니다.
  function isSubseq(a, b) {
    if (a.length < 2 || a.length >= b.length) return false;
    var i = 0;
    for (var j = 0; j < b.length && i < a.length; j++) { if (b.charAt(j) === a.charAt(i)) i++; }
    return i === a.length;
  }

  // 중복 제거 → 포함관계 정리 → 구체 항목이 있으면 '전 영역' 류 총평은 생략
  function cleanList(arr) {
    var seen = {}, out = [];
    arr.forEach(function (v) {
      v = String(v == null ? '' : v).trim().replace(/\s+/g, ' ');
      if (!v || isPlaceholder(v) || seen[v]) return;
      seen[v] = 1; out.push(v);
    });
    out = out.filter(function (v) {
      var nv = String(v).replace(/\s+/g, '');
      return !out.some(function (w) { return w !== v && isSubseq(nv, String(w).replace(/\s+/g, '')); });
    });
    if (out.length > 1) out = out.filter(function (v) { return !OVERALL.test(v); });
    return out;
  }

  function defaultRange(type) {
    var n = new Date(), y = n.getFullYear(), m = n.getMonth() + 1;
    if (type === '월간') {
      return { from: y + '-' + pad(m) + '-01', to: y + '-' + pad(m) + '-' + pad(lastDay(y, m - 1)) };
    }
    if (m >= 3 && m <= 8) return { from: y + '-03-01', to: y + '-08-31' };
    if (m >= 9) return { from: y + '-09-01', to: (y + 1) + '-02-28' };
    return { from: (y - 1) + '-09-01', to: y + '-02-28' };
  }

  function applyDefaultRange() {
    var r = defaultRange(state.type);
    state.from = r.from; state.to = r.to;
    document.getElementById('s-from').value = r.from;
    document.getElementById('s-to').value = r.to;
  }

  function syncGenerateBtn() {
    var btn = document.getElementById('generate');
    if (!btn) return;
    btn.disabled = !document.getElementById('s-student').value;
  }

  async function loadStudents() {
    var res = await window.agentdb.executeQuery('rpt_students', {});
    state.students = res.rows;
    document.getElementById('s-student').innerHTML = '<option value="">— 학생 선택 —</option>' +
      state.students.map(function (s) {
        return '<option value="' + s.id + '">' + esc(s.name) + (s.grade ? ' (' + esc(s.grade) + ')' : '') + '</option>';
      }).join('');
    console.log('[data] students loaded: ' + state.students.length);
  }

  // ---------- 텍스트 생성 ----------
  function buildOverall(p) {
    if (!p || num(p.total_units) === 0) return '해당 기간에 등록된 학습 진도 기록이 없습니다.';
    var parts = [];
    parts.push('총 ' + num(p.total_units) + '개 단원 중 ' + num(p.completed) + '개를 완료했고, ' + num(p.in_progress) + '개 단원을 학습 중입니다.');
    parts.push('평균 진도율은 ' + num(p.avg_progress) + '%, 평균 숙련도는 ' + num(p.avg_mastery) + '점입니다.');
    if (p.unit_list) parts.push('단원별 진도: ' + p.unit_list + '.');
    return parts.join(' ');
  }

  function buildAttendance(a) {
    if (!a || num(a.total) === 0) return '해당 기간에 예정된 수업이 없습니다.';
    var seg = ['총 ' + num(a.total) + '회 수업 중 출석 ' + num(a.present) + '회'];
    if (num(a.late)) seg.push('지각 ' + num(a.late) + '회');
    if (num(a.absent)) seg.push('결석 ' + num(a.absent) + '회');
    if (num(a.excused)) seg.push('사전결석 ' + num(a.excused) + '회');
    var recorded = num(a.present) + num(a.late) + num(a.absent) + num(a.excused);
    var rate = recorded ? Math.round((num(a.present) + num(a.late)) / recorded * 100) : 0;
    var tail;
    if (!recorded) tail = ' 아직 출결이 기록되지 않았습니다.';
    else if (recorded < num(a.total)) tail = ' 기록된 ' + recorded + '회 기준 출석률은 ' + rate + '%입니다.';
    else tail = ' 출석률은 ' + rate + '%입니다.';
    return seg.join(', ') + '였습니다.' + tail;
  }

  function buildAssessment(list) {
    if (!list || !list.length) return '해당 기간에 응시한 평가가 없습니다.';
    var scores = list.map(function (r) { return num(r.score); });
    var avg = Math.round(scores.reduce(function (s, v) { return s + v; }, 0) / scores.length);
    var txt = '기간 내 ' + list.length + '회 평가에 응시했으며 평균 ' + avg + '점입니다.';
    if (list.length >= 2) {
      var f = list[0], l = list[list.length - 1];
      var d = num(l.score) - num(f.score);
      var dir = d > 0 ? '상승' : (d < 0 ? '하락' : '유지');
      txt += ' ' + String(f.taken_date).slice(0, 10) + ' ' + num(f.score) + '점에서 ' +
        String(l.taken_date).slice(0, 10) + ' ' + num(l.score) + '점으로 ' + dir + ' 추세입니다.';
    }
    return txt;
  }

  function buildInsights(sessions, assessments) {
    var strengths = [], areas = [], goals = [];
    sessions.forEach(function (s) {
      strengths = strengths.concat(splitList(s.strengths_identified));
      areas = areas.concat(splitList(s.weaknesses_identified));
      goals = goals.concat(splitList(s.next_recommendation));
    });
    assessments.forEach(function (a) {
      strengths = strengths.concat(splitList(a.strong_areas));
      areas = areas.concat(splitList(a.weak_areas));
    });
    strengths = cleanList(strengths); areas = cleanList(areas); goals = cleanList(goals);
    return {
      strengths: strengths.length ? 'AI 튜터 세션과 평가에서 관찰된 강점: ' + strengths.join(', ') + '.' : '기록된 강점 데이터가 없습니다.',
      areas: areas.length ? '보완이 필요한 부분: ' + areas.join(', ') + '.' : '기록된 보완점 데이터가 없습니다.',
      goals: goals.length ? '다음 기간에는 ' + goals.join(', ') + '에 집중할 것을 제안합니다.' : '',
    };
  }

  function buildSummary(student, p, a, list) {
    var name = student ? student.name : '학생';
    var parts = [];
    parts.push(name + ' 학생의 ' + state.from + ' ~ ' + state.to + ' 리포트입니다.');
    if (a && num(a.total) > 0) {
      var recorded = num(a.present) + num(a.late) + num(a.absent) + num(a.excused);
      var rate = recorded ? Math.round((num(a.present) + num(a.late)) / recorded * 100) : 0;
      if (recorded) parts.push('총 ' + num(a.total) + '회 수업 중 ' + recorded + '회 출결이 기록되었고, 출석률 ' + rate + '%입니다.');
      else parts.push('총 ' + num(a.total) + '회 수업이 예정되어 있습니다.');
    }
    if (p && num(p.total_units) > 0) {
      parts.push('평균 진도율 ' + num(p.avg_progress) + '%, 평균 숙련도 ' + num(p.avg_mastery) + '점으로 학습을 이어가고 있습니다.');
    }
    if (list && list.length) {
      var scores = list.map(function (r) { return num(r.score); });
      parts.push('평가 평균은 ' + Math.round(scores.reduce(function (s, v) { return s + v; }, 0) / scores.length) + '점입니다.');
    }
    return parts.join(' ');
  }

  // ---------- 미리보기 렌더 ----------
  function sec(title, text, muted) {
    return '<div class="rp-sec"><div class="h"><span class="dot"></span>' + esc(title) + '</div>' +
      '<div class="txt' + (muted ? ' muted' : '') + '">' + esc(text) + '</div></div>';
  }

  function renderPreview() {
    var box = document.getElementById('preview');
    if (!state.generated) {
      box.innerHTML = '<div class="rp-empty">학생과 기간을 선택한 뒤 <b>리포트 생성</b>을 눌러 주세요.</div>';
      return;
    }
    var st = state.students.find(function (s) { return Number(s.id) === Number(state.studentId); });
    var d = state.generated;
    var chips = d.assessments.map(function (a) {
      return '<span class="rp-chip">' + esc(String(a.taken_date).slice(0, 10)) + ' <b>' + num(a.score) + '점</b></span>';
    }).join('');

    box.innerHTML =
      '<div class="rp-doc-head">' +
        '<div class="who">' + esc(st ? st.name : '학생') + (st && st.grade ? ' <span class="grade">' + esc(st.grade) + '</span>' : '') + '</div>' +
        '<div class="meta">' + esc(state.type) + ' 리포트 · ' + esc(state.from) + ' ~ ' + esc(state.to) + '</div>' +
      '</div>' +
      sec('종합 요약', d.summary) +
      sec('학습 진도', d.overall) +
      sec('출결', d.attendance) +
      '<div class="rp-sec"><div class="h"><span class="dot"></span>평가 점수·추이</div>' +
        '<div class="txt">' + esc(d.assessment) + '</div>' +
        (chips ? '<div class="rp-trend">' + chips + '</div>' : '') +
      '</div>' +
      sec('강점', d.strengths) +
      sec('보완점', d.areas) +
      '<div class="rp-sec"><div class="h"><span class="dot"></span>교사 코멘트</div>' +
        '<div class="rp-edit"><textarea id="e-teacher" placeholder="학생에 대한 코멘트를 입력하세요."></textarea></div></div>' +
      '<div class="rp-sec"><div class="h"><span class="dot"></span>다음 기간 목표</div>' +
        '<div class="rp-edit"><textarea id="e-goals" placeholder="다음 기간 학습 목표를 입력하세요."></textarea></div></div>' +
      '<div class="rp-actions"><button class="rp-btn rp-btn-primary" id="save">초안 저장</button></div>';

    document.getElementById('e-goals').value = d.suggestedGoals || '';
    document.getElementById('save').addEventListener('click', saveDraft);
    var badge = document.getElementById('previewBadge');
    badge.style.display = '';
    document.getElementById('previewBadgeText').textContent = '초안 미저장';
    console.log('[render] preview rendered for student ' + state.studentId);
  }

  // ---------- 생성 ----------
  async function generate() {
    var sid = document.getElementById('s-student').value;
    state.from = document.getElementById('s-from').value;
    state.to = document.getElementById('s-to').value;
    state.type = document.getElementById('s-type').value;
    if (!sid) { toast('학생을 선택하세요', false); return; }
    if (!state.from || !state.to) { toast('기간을 입력하세요', false); return; }
    state.studentId = sid;

    var btn = document.getElementById('generate');
    btn.disabled = true;
    btn.textContent = '생성 중…';
    try {
      var params = { student_id: Number(sid), from: state.from, to: state.to };
      var res = await Promise.all([
        window.agentdb.executeQuery('rpt_progress', { student_id: Number(sid) }),
        window.agentdb.executeQuery('rpt_attendance', params),
        window.agentdb.executeQuery('rpt_assessments', params),
        window.agentdb.executeQuery('rpt_sessions', params),
      ]);
      var p = res[0].rows[0] || null;
      var a = res[1].rows[0] || null;
      var list = res[2].rows;
      var sessions = res[3].rows;
      var ins = buildInsights(sessions, list);
      var st = state.students.find(function (s) { return Number(s.id) === Number(sid); });
      state.generated = {
        overall: buildOverall(p),
        attendance: buildAttendance(a),
        assessment: buildAssessment(list),
        strengths: ins.strengths,
        areas: ins.areas,
        suggestedGoals: ins.goals,
        summary: buildSummary(st, p, a, list),
        assessments: list,
      };
      console.log('[data] report generated: progress=' + (p ? num(p.total_units) : 0) + ' units, attendance=' + (a ? num(a.total) : 0) + ' classes, assessments=' + list.length + ', sessions=' + sessions.length);
      renderPreview();
      await loadDrafts();
      toast('리포트 초안을 생성했습니다', true);
    } catch (e) {
      console.error('[error]', e.message);
      toast('오류: ' + e.message, false);
    } finally {
      btn.textContent = '리포트 생성';
      syncGenerateBtn();
    }
  }

  // ---------- 저장 ----------
  async function saveDraft() {
    if (!state.generated) return;
    var teacher = document.getElementById('e-teacher').value;
    var goals = document.getElementById('e-goals').value;
    var btn = document.getElementById('save');
    btn.disabled = true;
    try {
      await window.agentdb.executeQuery('rpt_insert', {
        student_id: Number(state.studentId),
        report_period_start: state.from,
        report_period_end: state.to,
        report_type: state.type,
        overall_progress: state.generated.overall,
        attendance_summary: state.generated.attendance,
        assessment_summary: state.generated.assessment,
        strengths: state.generated.strengths,
        areas_for_improvement: state.generated.areas,
        teacher_comments: teacher || null,
        ai_summary: state.generated.summary,
        next_period_goals: goals || null,
        status: '초안',
        sent_date: null,
      });
      document.getElementById('previewBadgeText').textContent = '초안 저장됨';
      toast('초안으로 저장했습니다', true);
      console.log('[event] draft saved');
      await loadDrafts();
    } catch (e) {
      console.error('[error]', e.message);
      toast('오류: ' + e.message, false);
    } finally {
      btn.disabled = false;
    }
  }

  // ---------- 저장된 리포트 ----------
  async function loadDrafts() {
    var box = document.getElementById('drafts');
    if (!state.studentId) {
      box.innerHTML = '<div class="rp-empty">학생을 선택하면 저장된 리포트가 표시됩니다.</div>';
      return;
    }
    try {
      var res = await window.agentdb.executeQuery('rpt_drafts', { student_id: Number(state.studentId) });
      document.getElementById('draftCount').textContent = res.row_count;
      if (!res.rows.length) {
        box.innerHTML = '<div class="rp-empty">아직 저장된 리포트가 없습니다.</div>';
        return;
      }
      box.innerHTML = res.rows.map(function (r) {
        var tone = r.status === '발송완료' ? 'success' : 'warn';
        return '<div class="rp-draft"><div class="top">' +
          '<span class="type">' + esc(r.report_type || '리포트') + '</span>' +
          g.tag(r.status || '초안', tone) +
          '</div><div class="period">' + esc(String(r.report_period_start).slice(0, 10)) + ' ~ ' + esc(String(r.report_period_end).slice(0, 10)) + '</div></div>';
      }).join('');
    } catch (e) {
      console.error('[error]', e.message);
      box.innerHTML = '<div class="rp-empty" style="color:var(--danger-500)">오류: ' + esc(e.message) + '</div>';
    }
  }

  function showError(e) {
    console.error('[error]', e.message || e);
    var el = document.getElementById('error');
    el.replaceChildren();
    var t = document.createElement('div');
    t.textContent = 'Error: ' + (e.message || e);
    var b = document.createElement('button');
    b.textContent = 'Retry';
    b.onclick = function () { el.style.display = 'none'; boot(); };
    el.append(t, b);
    el.style.display = 'flex';
  }

  async function boot() {
    console.log('[init] starting');
    try {
      await loadStudents();
      applyDefaultRange();
      syncGenerateBtn();
      document.getElementById('s-type').addEventListener('change', function (e) {
        state.type = e.target.value;
        applyDefaultRange();
      });
      document.getElementById('s-student').addEventListener('change', function (e) {
        state.studentId = e.target.value || null;
        state.generated = null;
        document.getElementById('previewBadge').style.display = 'none';
        document.getElementById('preview').innerHTML = '<div class="rp-empty">학생과 기간을 선택한 뒤 <b>리포트 생성</b>을 눌러 주세요.</div>';
        syncGenerateBtn();
        loadDrafts();
      });
      document.getElementById('generate').addEventListener('click', generate);
      document.getElementById('ts').textContent = '기준 ' + new Date().toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
      document.getElementById('loading').style.display = 'none';
      document.getElementById('root').style.display = 'block';
      console.log('[init] done');
    } catch (e) {
      document.getElementById('loading').style.display = 'none';
      showError(e);
    }
  }

  window.Rpt = { boot: boot, state: state, generate: generate };
})();

</script>
  <script>
// 진입점 — 학부모 리포트 생성기를 초기화합니다.
// 실제 로직은 sections/report.js 의 window.Rpt 가 담당합니다.
(function () {
  function boot() {
    if (!window.Rpt || typeof window.Rpt.boot !== 'function') {
      console.error('[init] Rpt module missing');
      var el = document.getElementById('error');
      if (el) { el.textContent = 'Error: report module failed to load'; el.style.display = 'flex'; }
      return;
    }
    window.Rpt.boot();
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();

</script>
