    t.rate = t.n ? Math.round(t.done / t.n * 100) : 0;
    t.avgFocus = t.focusN ? (t.focusSum / t.focusN).toFixed(1) : '—';
    t.achieve = t.plan ? Math.round(t.act / t.plan * 100) : 0;
    return t;
  }

  function renderKpis() {
    var el = document.getElementById('kpis'); if (!el) return;
    var t = totals(state.plans);
    el.innerHTML = g().kpiRow([
      { label: '학습 과제', value: g().fmtInt(t.n), sub: '건' },
      { label: '완료율', value: t.rate + '%', sub: t.done + '/' + t.n, accent: t.rate >= 80 ? 'ok' : t.rate >= 50 ? 'warn' : '' },
      { label: '실제 학습시간', value: g().fmtInt(t.act), sub: '분 · 계획 ' + g().fmtInt(t.plan) },
      { label: '계획 달성률', value: t.achieve + '%', sub: '실제/계획' },
      { label: '평균 집중도', value: t.avgFocus, sub: '5점 만점' },
    ]);
  }

  async function loadStudents() {
    var res = await window.agentdb.executeQuery('sp_students', {});
    state.students = res.rows || [];
    var sel = document.getElementById('stu-sel');
    sel.innerHTML = state.students.map(function (s) {
      var n = Number(s.plan_count || 0);
      return '<option value="' + s.id + '">' + esc(s.name) + ' (' + esc(fmt(s.grade)) + (s.school ? ' · ' + esc(s.school) : '') + ')' + (n ? ' · 과제 ' + n : ' · 과제 없음') + '</option>';
    }).join('');
    sel.onchange = function () { selectStudent(Number(sel.value)); };
    console.log('[data] students', state.students.length);
  }

  async function loadStatic() {
    var s = await window.agentdb.executeQuery('sp_subjects', {});
    state.subjects = s.rows || [];
    var c = await window.agentdb.executeQuery('sp_curriculum', {});
    state.curriculum = c.rows || [];
    fillSubject();
    console.log('[data] subjects', state.subjects.length, 'curriculum', state.curriculum.length);
  }

  function subjectName(id) { var s = state.subjects.filter(function (x) { return x.id === id; })[0]; return s ? s.subject_name : null; }
  function fillSubject() {
    var el = document.getElementById('s-subj'); if (!el) return;
    el.innerHTML = '<option value="">(과목 없음)</option>' + state.subjects.map(function (s) { return '<option value="' + s.id + '">' + esc(s.subject_name) + '</option>'; }).join('');
  }
  function fillCurriculum(subjectId, cur) {
    var el = document.getElementById('s-cur'); if (!el) return;
    var list = subjectId ? state.curriculum.filter(function (c) { return c.subject_id === Number(subjectId); }) : state.curriculum;
    el.innerHTML = '<option value="">(단원 미지정)</option>' + list.map(function (c) {
      return '<option value="' + c.id + '">' + esc(c.subject_name) + ' · ' + esc(c.unit_name) + '</option>';
    }).join('');
    el.value = cur == null ? '' : String(cur);
  }

  async function selectStudent(id) { state.studentId = id; await refresh(); }

  async function refresh() {
    var sid = state.studentId;
    var stu = stuById(sid);
    var chip = document.getElementById('stu-chip');
    if (chip) chip.textContent = stu ? (fmt(stu.school) + ' · ' + fmt(stu.grade)) : '—';
    try {
      var p = await window.agentdb.executeQuery('sp_plans', { student_id: sid });
      state.plans = p.rows || [];
    } catch (e) { console.error('[error]', e.message); state.plans = []; }
    renderPlans(); renderChart(); renderBySubject(); renderKpis();
    console.log('[data] plans', state.plans.length);
  }

  function renderPlans() {
    var el = document.getElementById('plans'); if (!el) return;
    if (!state.plans.length) { el.innerHTML = '<div class="empty-note">학습 계획이 없습니다.<br>‘과제 추가’로 오늘의 학습을 계획하세요.</div>'; return; }
    var groups = {}, order = [];
    state.plans.forEach(function (p) {
      var k = dstr(p.plan_date);
      if (!groups[k]) { groups[k] = []; order.push(k); }
      groups[k].push(p);
    });
    order.sort(function (a, b) { return a < b ? 1 : -1; });
    el.innerHTML = order.map(function (k) {
      var items = groups[k];
      var t = totals(items);
      return '<div class="day-group"><div class="day-head"><span class="dh-d">' + esc(fmtDate(k)) + ' (' + dow(k) + ')</span>' +
        '<span class="dh-s">' + t.done + '/' + t.n + ' 완료 · 실제 ' + t.act + '분 / 계획 ' + t.plan + '분</span></div>' +
        items.map(function (p) {
          var sn = p.subject_id == null ? '기타' : (p.subject_name || subjectName(p.subject_id) || '기타');
          return '<div class="task ' + (p.done ? 'done' : '') + '">' +
            '<div class="ck" data-ck="' + p.id + '">' + (p.done ? '✓' : '') + '</div>' +
            '<div class="t-main"><div class="t-title">' + esc(p.task) + '</div>' +
            '<div class="t-meta"><span class="cat-tag">' + esc(sn) + '</span>' +
            (p.unit_name ? '<span>' + esc(p.unit_name) + '</span>' : '') +
            '<span>계획 ' + num(p.target_minutes) + '분</span>' +
            (p.focus_score != null ? '<span>집중도 ' + esc(p.focus_score) + '/5</span>' : '') +
            (p.note ? '<span>· ' + esc(p.note) + '</span>' : '') + '</div>' +
            '<div class="t-edit"><label>실제</label><input type="number" data-act="' + p.id + '" value="' + (p.actual_minutes == null ? '' : p.actual_minutes) + '" placeholder="분">' +
            '<label>집중</label><input type="number" min="1" max="5" data-foc="' + p.id + '" value="' + (p.focus_score == null ? '' : p.focus_score) + '" placeholder="1-5">' +
            '<button class="row-btn" data-save="' + p.id + '">기록</button>' +
            '<button class="row-btn" data-edit="' + p.id + '">수정</button>' +
            '<button class="row-btn danger" data-del="' + p.id + '">삭제</button></div>' +
            '</div></div>';
        }).join('') + '</div>';
    }).join('');
    el.querySelectorAll('[data-ck]').forEach(function (b) { b.onclick = function () { toggleDone(Number(b.getAttribute('data-ck'))); }; });
    el.querySelectorAll('[data-save]').forEach(function (b) { b.onclick = function () { saveRecord(Number(b.getAttribute('data-save'))); }; });
    el.querySelectorAll('[data-edit]').forEach(function (b) { b.onclick = function () { open(Number(b.getAttribute('data-edit'))); }; });
    el.querySelectorAll('[data-del]').forEach(function (b) { b.onclick = function () {
      var id = Number(b.getAttribute('data-del'));
      confirmDialog('과제 삭제', '이 학습 과제를 삭제할까요?', function () { del(id); });
    }; });
    el.querySelectorAll('[data-subj]').forEach(function () {});
  }

  function renderChart() {
    var el = document.getElementById('chart'); if (!el) return;
    if (!state.plans.length) { el.innerHTML = '<div class="empty-note">데이터가 없습니다.</div>'; return; }
    var byDate = {};
    state.plans.forEach(function (p) {
      var k = dstr(p.plan_date);
      if (!byDate[k]) byDate[k] = { plan: 0, act: 0 };
      byDate[k].plan += num(p.target_minutes);
      byDate[k].act += num(p.actual_minutes);
    });
    var keys = Object.keys(byDate).sort();
    var max = Math.max.apply(null, keys.map(function (k) { return Math.max(byDate[k].plan, byDate[k].act); })) || 1;
    el.innerHTML = '<div class="chart">' + keys.map(function (k) {
      var d = byDate[k];
      var hp = Math.round(d.plan / max * 100), ha = Math.round(d.act / max * 100);
      return '<div class="col"><div class="bars">' +
        '<div class="b plan" style="height:' + Math.max(2, hp) + '%" title="계획 ' + d.plan + '분"></div>' +
        '<div class="b act" style="height:' + Math.max(2, ha) + '%" title="실제 ' + d.act + '분"></div>' +
        '</div><div class="cl">' + esc(k.slice(5).replace('-', '/')) + '</div></div>';
    }).join('') + '</div>';
  }

  function renderBySubject() {
    var el = document.getElementById('bySubject'); if (!el) return;
    if (!state.plans.length) { el.innerHTML = '<div class="empty-note">데이터가 없습니다.</div>'; return; }
    var m = {}, order = [];
    state.plans.forEach(function (p) {
      var k = p.subject_id == null ? '기타' : (p.subject_name || subjectName(p.subject_id) || '기타');
      if (!m[k]) { m[k] = { n: 0, done: 0, plan: 0, act: 0 }; order.push(k); }
      m[k].n++; if (p.done) m[k].done++;
      m[k].plan += num(p.target_minutes); m[k].act += num(p.actual_minutes);
    });
    order.sort(function (a, b) { return m[b].act - m[a].act; });
    el.innerHTML = '<table class="sum-tbl"><thead><tr><th>과목</th><th>과제</th><th>완료</th><th>실제(분)</th><th>달성</th></tr></thead><tbody>' +
      order.map(function (k) {
        var d = m[k];
        var rate = d.plan ? Math.round(d.act / d.plan * 100) : 0;
        return '<tr><td>' + esc(k) + '</td><td>' + d.n + '</td><td>' + d.done + '</td><td>' + d.act + '</td>' +
          '<td><div class="mini-bar" title="' + rate + '%"><i style="width:' + Math.min(100, rate) + '%"></i></div></td></tr>';
      }).join('') + '</tbody></table>';
  }

  function open(id) {
    state.edit = id || null;
    var p = id ? state.plans.filter(function (x) { return x.id === id; })[0] : null;
    document.getElementById('sp-title').textContent = p ? '과제 수정' : '과제 추가';
    document.getElementById('s-date').value = p ? dstr(p.plan_date) : new Date().toISOString().slice(0, 10);
    document.getElementById('s-subj').value = p && p.subject_id != null ? String(p.subject_id) : '';
    fillCurriculum(p ? p.subject_id : '', p ? p.curriculum_id : null);
    document.getElementById('s-task').value = p ? p.task : '';
    document.getElementById('s-target').value = p ? (p.target_minutes == null ? '' : p.target_minutes) : '';
    document.getElementById('s-actual').value = p ? (p.actual_minutes == null ? '' : p.actual_minutes) : '';
    document.getElementById('s-focus').value = p && p.focus_score != null ? String(p.focus_score) : '';
    document.getElementById('s-done').value = p && p.done ? 'true' : 'false';
    document.getElementById('s-note').value = p ? (p.note || '') : '';
    show('#sp-mask');
  }

  async function save() {
    var task = val('s-task'), date = val('s-date');
    if (!date) { toast('날짜를 입력하세요.', 'err'); return; }
    if (!task) { toast('과제 내용을 입력하세요.', 'err'); return; }
    var sid = val('s-subj') ? Number(val('s-subj')) : null;
    var row = {
      id: state.edit || null, student_id: state.studentId, plan_date: date,
      subject_id: sid, curriculum_id: val('s-cur') ? Number(val('s-cur')) : null,
      task: task, target_minutes: val('s-target') ? Number(val('s-target')) : null,
      actual_minutes: val('s-actual') ? Number(val('s-actual')) : null,
      done: val('s-done') === 'true', focus_score: val('s-focus') ? Number(val('s-focus')) : null,
      note: val('s-note') || null
    };
    try {
      await window.agentdb.executeQuery('sp_save', { p_row: JSON.stringify([row]) });
      toast('과제를 저장했습니다.'); hide('#sp-mask');
      await refresh(); await loadStudents(); document.getElementById('stu-sel').value = String(state.studentId);
    } catch (e) { console.error('[error]', e.message); toast('저장 실패: ' + e.message, 'err'); }
  }
  async function del(id) {
    try { await window.agentdb.executeQuery('sp_delete', { p_id: id }); toast('삭제했습니다.');
      await refresh(); await loadStudents(); document.getElementById('stu-sel').value = String(state.studentId);
    } catch (e) { console.error('[error]', e.message); toast('삭제 실패: ' + e.message, 'err'); }
  }
  async function toggleDone(id) {
    var p = state.plans.filter(function (x) { return x.id === id; })[0]; if (!p) return;
    try {
      await window.agentdb.executeQuery('sp_toggle', { p_id: id, p_done: !p.done, p_actual: p.actual_minutes == null ? null : Number(p.actual_minutes), p_focus: p.focus_score == null ? null : Number(p.focus_score) });
      toast(p.done ? '미완료로 변경' : '완료 처리'); await refresh();
    } catch (e) { console.error('[error]', e.message); toast('변경 실패: ' + e.message, 'err'); }
  }
  async function saveRecord(id) {
    var actEl = document.querySelector('[data-act="' + id + '"]');
    var focEl = document.querySelector('[data-foc="' + id + '"]');
    var p = state.plans.filter(function (x) { return x.id === id; })[0]; if (!p) return;
    var act = actEl && actEl.value !== '' ? Number(actEl.value) : null;
    var foc = focEl && focEl.value !== '' ? Number(focEl.value) : null;
    try {
      await window.agentdb.executeQuery('sp_toggle', { p_id: id, p_done: !!p.done, p_actual: act, p_focus: foc });
      toast('학습 기록을 반영했습니다.'); await refresh();
    } catch (e) { console.error('[error]', e.message); toast('기록 실패: ' + e.message, 'err'); }
  }

  function setup() {
    var a = document.getElementById('btn-add'); if (a) a.onclick = function () { open(null); };
    var sc = document.getElementById('s-cancel'); if (sc) sc.onclick = function () { hide('#sp-mask'); };
    var ss = document.getElementById('s-save'); if (ss) ss.onclick = save;
    var sj = document.getElementById('s-subj'); if (sj) sj.onchange = function () { fillCurriculum(sj.value, null); };
  }

  async function init() {
    await loadStudents();
    await loadStatic();
    await new Promise(function (r) { setTimeout(r, 0); });
    var withPlans = state.students.filter(function (s) { return Number(s.plan_count) > 0; });
    var target = withPlans[0] || state.students[0];
    if (target) { document.getElementById('stu-sel').value = String(target.id); await selectStudent(target.id); }
  }

  return { setup: setup, init: init, _state: state };
})();

</script>
  <script>
/* 공부코치 — 진입점. */
function showError(msg) {
  document.getElementById('loading').style.display = 'none';
  const errEl = document.getElementById('error');
  errEl.replaceChildren();
  const text = document.createElement('div');
  text.textContent = '오류: ' + msg;
  const btn = document.createElement('button');
  btn.className = 'btn btn-ghost';
  btn.style.marginTop = '12px';
  btn.textContent = '다시 시도';
  btn.onclick = () => { errEl.style.display = 'none'; document.getElementById('loading').style.display = 'block'; init(); };
  errEl.append(text, btn);
  errEl.style.display = 'block';
}
function showContent() {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('error').style.display = 'none';
  document.getElementById('app').removeAttribute('hidden');
}
async function init() {
  console.log('[init] starting');
  try {
    window.Co.setup();
    showContent();
    await window.Co.init();
    const ts = document.getElementById('ts');
    if (ts) ts.textContent = '기준 ' + new Date().toLocaleString('ko-KR');
    console.log('[init] done');
  } catch (e) {
    console.error('[error]', e.message);
    showError(e.message);
  }
}
init();

</script>
</body>
