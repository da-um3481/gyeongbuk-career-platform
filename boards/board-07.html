  <script>
// 범용 CRUD 폼 엔진 — 엔티티 정의만 바꾸면 모든 테이블에 재사용됩니다.
(function () {
  var g = window.gsDash;

  function esc(s) { return g.esc(s == null ? '' : String(s)); }
  function pad(n) { return String(n).padStart(2, '0'); }

  var state = {
    entityKey: null,
    editingId: null,
    options: {},
    listRows: [],
    search: '',
  };

  function toast(msg, ok) {
    var t = document.getElementById('toast');
    if (!t) return;
    t.textContent = msg;
    t.className = 'toast show ' + (ok ? 'ok' : 'err');
    setTimeout(function () { t.className = 'toast ' + (ok ? 'ok' : 'err'); }, 2800);
  }

  function confirmDialog(title, msg) {
    return new Promise(function (resolve) {
      var mask = document.getElementById('modalMask');
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalMsg').textContent = msg;
      mask.classList.add('show');
      var okBtn = document.getElementById('modalOk');
      var cancelBtn = document.getElementById('modalCancel');
      function cleanup(val) {
        mask.classList.remove('show');
        okBtn.removeEventListener('click', onOk);
        cancelBtn.removeEventListener('click', onCancel);
        resolve(val);
      }
      function onOk() { cleanup(true); }
      function onCancel() { cleanup(false); }
      okBtn.addEventListener('click', onOk);
      cancelBtn.addEventListener('click', onCancel);
    });
  }

  async function loadDynamicOptions() {
    var keys = Object.keys(window.DYNAMIC);
    for (var i = 0; i < keys.length; i++) {
      var k = keys[i];
      var def = window.DYNAMIC[k];
      try {
        var res = await window.agentdb.executeQuery(def.query, {});
        state.options[k] = res.rows.map(function (r) {
          return { value: def.value(r), label: def.label(r) };
        });
      } catch (e) {
        state.options[k] = [];
        console.error('[options] failed for', k, e.message);
      }
    }
    console.log('[data] dynamic options loaded:', Object.keys(state.options).map(function (k) {
      return k + '=' + state.options[k].length;
    }).join(', '));
  }

  function toInputValue(type, v) {
    if (v == null) return '';
    var s = String(v);
    if (type === 'date') return s.slice(0, 10);
    if (type === 'time') return s.slice(0, 5);
    if (type === 'datetime') {
      var d = new Date(s);
      if (isNaN(d)) return '';
      return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
    }
    return s;
  }

  function fieldHtml(f) {
    var req = f.required ? ' <span class="req">*</span>' : '';
    var span = f.span2 ? ' span2' : '';
    var id = 'f_' + f.name;
    var inner = '';
    if (f.type === 'textarea') {
      inner = '<textarea id="' + id + '" data-field="' + f.name + '"></textarea>';
    } else if (f.type === 'select') {
      inner = '<select id="' + id + '" data-field="' + f.name + '"><option value="">— 선택 —</option>';
      (f.options || []).forEach(function (o) { inner += '<option value="' + esc(o) + '">' + esc(o) + '</option>'; });
      inner += '</select>';
    } else if (f.type === 'dynamic') {
      inner = '<select id="' + id + '" data-field="' + f.name + '"><option value="">— 선택 —</option>';
      (state.options[f.source] || []).forEach(function (o) {
        inner += '<option value="' + esc(o.value) + '">' + esc(o.label) + '</option>';
      });
      inner += '</select>';
    } else {
      var it = 'text';
      if (f.type === 'number') it = 'number';
      else if (f.type === 'date') it = 'date';
      else if (f.type === 'time') it = 'time';
      else if (f.type === 'datetime') it = 'datetime-local';
      inner = '<input type="' + it + '" id="' + id + '" data-field="' + f.name + '"' +
        (f.placeholder ? ' placeholder="' + esc(f.placeholder) + '"' : '') + '>';
    }
    return '<div class="fg' + span + '">' +
      '<label for="' + id + '">' + esc(f.label) + req + '</label>' + inner +
      '<div class="err" id="err_' + f.name + '"></div></div>';
  }

  function renderForm(entity) {
    return '<div class="panel">' +
      '<div class="panel-head"><div class="t">' + esc(entity.title) + '</div></div>' +
      '<div class="panel-body">' +
        '<div class="edit-banner" id="edit-banner" style="display:none">' +
          '<span id="edit-banner-text"></span>' +
          '<button class="btn btn-ghost" style="padding:3px 10px;font-size:11.5px" id="cancel-edit">취소</button>' +
        '</div>' +
        '<div class="form-grid" id="form-grid">' + entity.fields.map(fieldHtml).join('') + '</div>' +
        '<div class="form-actions">' +
          '<button class="btn btn-primary" id="submit-btn">저장</button>' +
          '<button class="btn btn-ghost" id="reset-btn">초기화</button>' +
        '</div>' +
      '</div></div>';
  }

  function fmtDateTime(v) {
    var d = new Date(v);
    if (isNaN(d)) return String(v);
    return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  function badge(v) {
    var tone = 'pill-neutral';
    if (['수강중', '완료', '출석', '발송완료', '양호', '높음', '매우 높음'].indexOf(v) >= 0) tone = 'pill-ok';
    else if (['휴원', '지각', '사전결석', '초안', '주의', '보통'].indexOf(v) >= 0) tone = 'pill-warn';
    else if (['퇴원', '결석', '취소', '낮음', '긴급'].indexOf(v) >= 0) tone = 'pill-danger';
    return '<span class="pill ' + tone + '">' + esc(v) + '</span>';
  }

  function fmtCell(col, val) {
    if (val == null || val === '') return '<span style="color:var(--ink-300)">—</span>';
    if (col.date) return esc(String(val).slice(0, 10));
    if (col.time) return esc(String(val).slice(0, 5));
    if (col.datetime) return esc(fmtDateTime(val));
    if (col.badge) return badge(val);
    return esc(String(val));
  }

  function renderListTable(entity) {
    var lp = document.getElementById('list-panel');
    if (!lp) return;
    var rows = state.listRows.filter(function (r) {
      if (!state.search) return true;
      var hay = Object.keys(r).map(function (k) { return r[k]; }).join(' ').toLowerCase();
      return hay.indexOf(state.search.toLowerCase()) >= 0;
    });
    var head = '<th style="width:1%"></th>' + entity.listCols.map(function (c) {
      return '<th>' + esc(c.label) + '</th>';
    }).join('');
    var body = rows.map(function (r) {
      var cells = entity.listCols.map(function (c) {
        var style = c.wide ? ' style="white-space:normal;max-width:300px"' : '';
        return '<td' + style + '>' + fmtCell(c, r[c.key]) + '</td>';
      }).join('');
      return '<tr>' +
        '<td class="actions">' +
          '<button class="row-btn" data-edit="' + r.id + '">수정</button>' +
          '<button class="row-btn danger" data-del="' + r.id + '">삭제</button>' +
        '</td>' + cells + '</tr>';
    }).join('');
    if (!rows.length) {
      body = '<tr><td colspan="' + (entity.listCols.length + 1) + '" class="empty-note">데이터 없음</td></tr>';
    }

    lp.innerHTML = '<div class="panel">' +
      '<div class="panel-head"><div class="t">' + esc(entity.tab) + ' 목록</div>' +
        '<span class="pill pill-neutral">' + rows.length + '건</span></div>' +
      '<div class="panel-body">' +
        '<div class="list-tools"><input id="list-search" placeholder="검색…" value="' + esc(state.search) + '"></div>' +
        '<div class="scroll-x"><table class="grid"><thead><tr>' + head + '</tr></thead><tbody>' + body + '</tbody></table></div>' +
      '</div></div>';

    var searchEl = document.getElementById('list-search');
    if (searchEl) {
      searchEl.addEventListener('input', function (e) {
        state.search = e.target.value;
        renderListTable(entity);
        var s2 = document.getElementById('list-search');
        if (s2) { s2.focus(); try { s2.setSelectionRange(s2.value.length, s2.value.length); } catch (x) {} }
      });
    }
    lp.querySelectorAll('[data-edit]').forEach(function (b) {
      b.addEventListener('click', function () { startEdit(entity, Number(b.getAttribute('data-edit'))); });
    });
    lp.querySelectorAll('[data-del]').forEach(function (b) {
      b.addEventListener('click', function () { doDelete(entity, Number(b.getAttribute('data-del'))); });
    });
  }

  async function loadList(entity) {
    var lp = document.getElementById('list-panel');
    if (lp) {
      lp.innerHTML = '<div class="panel"><div class="panel-head"><div class="t">' + esc(entity.tab) + ' 목록</div></div>' +
        '<div class="panel-body"><div class="empty-note">불러오는 중…</div></div></div>';
    }
    try {
      var res = await window.agentdb.executeQuery(entity.listQuery, {});
      state.listRows = res.rows;
      renderListTable(entity);
    } catch (e) {
      console.error('[list] error', e.message);
      if (lp) {
        lp.innerHTML = '<div class="panel"><div class="panel-body"><div class="empty-note" style="color:var(--danger-500)">오류: ' + esc(e.message) + '</div></div></div>';
      }
    }
  }

  function startEdit(entity, id) {
    var row = state.listRows.find(function (r) { return Number(r.id) === id; });
    if (!row) return;
    entity.fields.forEach(function (f) {
      var el = document.getElementById('f_' + f.name);
      if (!el) return;
      el.value = toInputValue(f.type, row[f.name]);
    });
    state.editingId = id;
    var labelVal = row.name || row.student_name || ('#' + id);
    document.getElementById('edit-banner-text').textContent = '수정 중: ' + labelVal;
    document.getElementById('edit-banner').style.display = 'flex';
    document.getElementById('submit-btn').textContent = '수정 저장';
    var panel = document.getElementById('panel');
    if (panel) panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function resetForm(entity) {
    entity.fields.forEach(function (f) {
      var el = document.getElementById('f_' + f.name);
      if (el) el.value = '';
    });
    state.editingId = null;
    var banner = document.getElementById('edit-banner');
    if (banner) banner.style.display = 'none';
    var sb = document.getElementById('submit-btn');
    if (sb) sb.textContent = '저장';
  }

  async function submitForm(entity) {
    entity.fields.forEach(function (f) {
      var e = document.getElementById('err_' + f.name);
      if (e) e.style.display = 'none';
    });
    var data = {};
    var invalid = null;
    entity.fields.forEach(function (f) {
      var el = document.getElementById('f_' + f.name);
      var raw = el ? el.value : '';
      if (f.required && (raw == null || String(raw).trim() === '')) invalid = invalid || f;
      if (raw === '') data[f.name] = null;
      else if (f.type === 'number' || f.type === 'dynamic') data[f.name] = Number(raw);
      else data[f.name] = raw;
    });
    if (invalid) {
      var errEl = document.getElementById('err_' + invalid.name);
      if (errEl) { errEl.textContent = '필수 항목입니다'; errEl.style.display = 'block'; }
      toast('필수 항목을 입력하세요: ' + invalid.label, false);
      return;
    }
    var btn = document.getElementById('submit-btn');
    btn.disabled = true;
    try {
      if (state.editingId) {
        data.id = state.editingId;
        await window.agentdb.executeQuery(entity.updateQuery, data);
        toast('수정되었습니다', true);
      } else {
        await window.agentdb.executeQuery(entity.insertQuery, data);
        toast('저장되었습니다', true);
      }
      resetForm(entity);
      await loadList(entity);
      if (entity.key === 'students') await loadDynamicOptions();
    } catch (e) {
      console.error('[submit] error', e.message);
      toast('오류: ' + e.message, false);
    } finally {
      btn.disabled = false;
    }
  }

  async function doDelete(entity, id) {
    var row = state.listRows.find(function (r) { return Number(r.id) === id; });
    var label = row ? (row.name || row.student_name || ('#' + id)) : ('#' + id);
    var warn = entity.key === 'students'
      ? '이 학생의 수업·세션·평가·진도·리포트 기록도 함께 삭제됩니다. 계속할까요?'
      : '이 기록을 삭제할까요? 되돌릴 수 없습니다.';
    var ok = await confirmDialog('삭제 확인', '「' + label + '」 — ' + warn);
    if (!ok) return;
    try {
      await window.agentdb.executeQuery(entity.deleteQuery, { id: id });
      toast('삭제되었습니다', true);
      if (state.editingId === id) resetForm(entity);
      await loadList(entity);
      if (entity.key === 'students') await loadDynamicOptions();
    } catch (e) {
      console.error('[delete] error', e.message);
      toast('오류: ' + e.message, false);
    }
  }

  function bindForm(entity) {
    document.getElementById('submit-btn').addEventListener('click', function () { submitForm(entity); });
    document.getElementById('reset-btn').addEventListener('click', function () { resetForm(entity); });
    var ce = document.getElementById('cancel-edit');
    if (ce) ce.addEventListener('click', function () { resetForm(entity); });
  }

  async function renderEntity(key) {
    var entity = window.ENTITIES.find(function (e) { return e.key === key; });
    if (!entity) return;
    state.entityKey = key;
    state.editingId = null;
    state.search = '';
    document.getElementById('panel').innerHTML =
      '<div class="split">' + renderForm(entity) + '<div id="list-panel"></div></div>';
    bindForm(entity);
    await loadList(entity);
  }

  window.Rx = {
    state: state,
    toast: toast,
    loadDynamicOptions: loadDynamicOptions,
    renderEntity: renderEntity,
  };
})();

</script>
  <script>
// 진입점 — 탭바를 구성하고, 선택된 엔티티의 입력 폼 + 목록을 렌더합니다.
// 실제 CRUD 로직은 sections/form-engine.js 의 window.Rx 가 담당합니다.
(function () {
  var Rx = window.Rx;

  function updateTimestamp() {
    var el = document.getElementById('ts');
    if (!el) return;
    var d = new Date();
    var p = function (n) { return String(n).padStart(2, '0'); };
    el.textContent = d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) +
      ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  function renderTabbar() {
    var bar = document.getElementById('tabbar');
    if (!bar) return;
    bar.innerHTML = window.ENTITIES.map(function (e) {
      return '<button class="tabbtn" data-key="' + e.key + '">' + e.tab + '</button>';
    }).join('');
    bar.querySelectorAll('.tabbtn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        selectTab(btn.getAttribute('data-key'));
      });
    });
  }

  function selectTab(key) {
    document.querySelectorAll('#tabbar .tabbtn').forEach(function (b) {
      b.classList.toggle('active', b.getAttribute('data-key') === key);
    });
    Rx.renderEntity(key);
  }

  async function init() {
    console.log('[init] data entry center starting');
    renderTabbar();
    updateTimestamp();
    setInterval(updateTimestamp, 60000);
    await Rx.loadDynamicOptions();
    selectTab(window.ENTITIES[0].key);
    console.log('[init] data entry center ready');
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();

</script>
