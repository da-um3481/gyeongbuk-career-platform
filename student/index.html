<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>다움 학습노트 — 학생</title>
<link rel="icon" href="/favicon.png" />
<style>
  :root{
    --ink-0:#fff; --ink-50:#f6f8f9; --ink-100:#eceff2; --ink-200:#dde3e8;
    --ink-400:#9aa4b0; --ink-500:#6b7683; --ink-600:#4e5865; --ink-800:#26303b; --ink-900:#141a22;
    --brand:#12707c; --brand-soft:#e6f2f4; --purple:#6a4fa3;
    --ok:#1f9d55; --warn:#b7791f; --danger:#c0392b;
  }
  *{box-sizing:border-box;word-break:keep-all}
  html,body{margin:0;height:100%}
  body{background:var(--ink-50);color:var(--ink-900);font-family:'Pretendard','Inter',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:720px;margin:0 auto;padding:0 16px 40px}
  header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--ink-100)}
  .bar{max-width:720px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
  .bar img{width:32px;height:32px;object-fit:contain}
  .bar .t{font-weight:800;font-size:15px;line-height:1.2}
  .bar .t small{display:block;font-size:11px;font-weight:500;color:var(--ink-500);margin-top:1px}
  .bar .sp{flex:1}
  .ghost{border:1px solid var(--ink-200);background:#fff;border-radius:8px;height:30px;padding:0 10px;font-size:12px;color:var(--ink-600);cursor:pointer}
  .ghost:hover{border-color:var(--brand);color:var(--brand)}

  /* 로그인 */
  .login{min-height:calc(100vh - 60px);display:grid;place-items:center;padding:24px 16px}
  .card{background:#fff;border:1px solid var(--ink-100);border-radius:16px;padding:26px 22px;width:100%;max-width:360px;box-shadow:0 10px 30px rgba(18,32,46,.06)}
  .card img{width:64px;height:64px;display:block;margin:0 auto 8px}
  .card h1{font-size:17px;text-align:center;margin:0 0 2px}
  .card .sub{text-align:center;font-size:12px;color:var(--ink-500);margin-bottom:18px}
  label{display:block;font-size:11px;color:var(--ink-600);margin:10px 0 4px}
  input{width:100%;height:42px;padding:0 12px;border:1px solid var(--ink-200);border-radius:10px;font-size:14px;outline:none;background:#fff}
  input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(18,112,124,.1)}
  .primary{width:100%;height:44px;margin-top:16px;border:0;border-radius:10px;background:var(--brand);color:#fff;font-size:14px;font-weight:700;cursor:pointer}
  .primary:disabled{opacity:.6}
  .err{color:var(--danger);font-size:12px;min-height:16px;margin-top:8px;text-align:center}

  /* 본문 */
  .hello{padding:20px 0 6px}
  .hello h2{margin:0;font-size:19px}
  .hello p{margin:4px 0 0;font-size:12.5px;color:var(--ink-500)}
  .tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 0 4px;position:sticky;top:53px;background:var(--ink-50);z-index:10}
  .tabs button{flex:0 0 auto;border:0;background:#fff;border:1px solid var(--ink-100);color:var(--ink-600);border-radius:999px;padding:8px 14px;font-size:12.5px;font-weight:600;cursor:pointer}
  .tabs button.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .sec{background:#fff;border:1px solid var(--ink-100);border-radius:14px;padding:16px;margin-top:12px}
  .sec h3{margin:0 0 10px;font-size:13.5px;display:flex;align-items:center;gap:6px}
  .sec h3 .cnt{font-size:11px;color:var(--ink-500);font-weight:500}
  .row{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--ink-50)}
  .row:first-of-type{border-top:0;padding-top:0}
  .row .d{flex:0 0 auto;width:52px;font-size:11px;color:var(--ink-500);line-height:1.5}
  .row .b{flex:1;min-width:0}
  .row .b b{font-size:13px;font-weight:700;display:block}
  .row .b span{font-size:11.5px;color:var(--ink-500)}
  .pill{display:inline-flex;align-items:center;padding:2px 8px;border-radius:999px;font-size:10.5px;font-weight:700;background:var(--ink-100);color:var(--ink-600)}
  .pill.ok{background:#DCF4E6;color:var(--ok)}
  .pill.warn{background:#FBEBD0;color:var(--warn)}
  .pill.brand{background:var(--brand-soft);color:var(--brand)}
  .pill.mute{background:var(--ink-100);color:var(--ink-500)}
  .empty{text-align:center;color:var(--ink-400);font-size:12.5px;padding:18px 0}
  .mini{height:28px;padding:0 10px;border:1px solid var(--ink-200);border-radius:8px;background:#fff;font-size:11.5px;color:var(--ink-700);cursor:pointer;white-space:nowrap}
  .mini:hover{border-color:var(--brand);color:var(--brand)}
  .mini.go{background:var(--brand);border-color:var(--brand);color:#fff}
  .bar-l{height:6px;background:var(--ink-100);border-radius:999px;overflow:hidden;margin-top:6px}
  .bar-l i{display:block;height:100%;background:var(--brand);border-radius:999px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .kpi{background:var(--ink-50);border-radius:10px;padding:10px}
  .kpi b{font-size:16px;display:block}
  .kpi span{font-size:11px;color:var(--ink-500)}
  .foot-note{text-align:center;font-size:11px;color:var(--ink-400);margin-top:24px}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(10px);background:#141a22;color:#fff;padding:9px 16px;border-radius:10px;font-size:12.5px;opacity:0;pointer-events:none;transition:.2s;z-index:60}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .modal{position:fixed;inset:0;background:rgba(20,26,34,.45);display:none;align-items:center;justify-content:center;padding:18px;z-index:50}
  .modal.show{display:flex}
  .modal .box{background:#fff;border-radius:14px;padding:20px;width:100%;max-width:380px}
  .modal h3{margin:0 0 8px;font-size:15px}
  .modal .foot{display:flex;gap:8px;margin-top:14px}
  .modal .foot button{flex:1;height:40px;border-radius:10px;border:1px solid var(--ink-200);background:#fff;font-size:13px;cursor:pointer}
  .modal .foot .primary{margin:0;border:0;background:var(--brand);color:#fff;font-weight:700}
  @media (max-width:420px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="bar">
    <img src="/logo-mark.png" alt="DA.UM" />
    <div class="t">다움 학습노트<small>학생용</small></div>
    <div class="sp"></div>
    <button class="ghost" id="btnPw" style="display:none">비밀번호</button>
    <button class="ghost" id="btnOut" style="display:none">로그아웃</button>
  </div>
</header>

<div id="app"><div class="login"><div class="card"><div class="err">불러오는 중…</div></div></div></div>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"></div>

<script src="/student/app.js"></script>
</body>
</html>
