<style>
:root {

* { box-sizing:border-box; }
body { margin:0; font-family: "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif; color:var(--ink); background:var(--bg); }

.wrap { max-width:1280px; margin:0 auto; padding:18px 18px 40px; }
.toolbar { display:grid; grid-template-columns: minmax(260px, 1.8fr) minmax(180px, .7fr); gap:10px; align-items:end; margin-bottom:14px; }
label { font-size:13px; font-weight:700; color:#30445b; display:block; margin:0 0 5px; }

button { border:0; border-radius:8px; padding:11px 13px; font-weight:700; background:#1e5b9e; color:white; cursor:pointer; min-height:44px; }

.layout { display:grid; grid-template-columns: 380px 1fr; gap:14px; align-items:start; }
.list { background:white; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
.list-head { padding:10px 12px; background:#eef4fb; border-bottom:1px solid var(--line); font-weight:800; }
.item { padding:12px; border-bottom:1px solid var(--line); cursor:pointer; }
.item:hover, .item.active { background:#f2f7fc; }
.item h3 { margin:0 0 7px; font-size:16px; line-height:1.35; }
.meta { display:flex; flex-wrap:wrap; gap:6px; align-items:center; color:var(--muted); font-size:12px; }
.badge { display:inline-flex; align-items:center; border-radius:999px; padding:3px 8px; background:var(--chip); color:#244d77; font-weight:700; white-space:nowrap; }
.badge.pri { background:#fff0c2; color:#765200; }
.detail { background:white; border:1px solid var(--line); border-radius:8px; padding:18px; min-height:620px; }
.detail h2 { margin:0 0 9px; font-size:25px; line-height:1.32; }
.conflict { display:inline-block; color:#7c2d25; background:#fff1ef; border:1px solid #ffd2cc; border-radius:8px; padding:8px 10px; font-weight:800; margin:4px 0 14px; }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
section.block { border-top:1px solid var(--line); padding-top:14px; margin-top:14px; }
section.block h3 { margin:0 0 8px; font-size:17px; color:#163d62; }
ul { margin:0; padding-left:20px; line-height:1.6; }
p { line-height:1.72; }
.answer { background:#f7fafc; border:1px solid #dce6ef; border-radius:8px; padding:13px; line-height:1.75; }
.sources a { display:inline-block; margin:3px 6px 3px 0; color:#174e8a; word-break:break-all; }
.empty { padding:30px; color:var(--muted); text-align:center; }
.actions { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
.note { margin-top:18px; color:#5a6878; font-size:13px; line-height:1.55; }
mark { background:#fff29b; padding:0 2px; }
@media (max-width: 900px) {
  .toolbar, .layout, .grid2 { grid-template-columns:1fr; }
  .detail { min-height:0; }
}
@media print {
  header, .toolbar, .list, .actions { display:none; }
  body { background:white; }
  .wrap { max-width:none; padding:0; }
  .layout { display:block; }
  .detail { border:0; padding:0; }
}
</style>

<script id="source-data" type="application/json">[{"priority": "A+", "field": "AI·디지털", "title": "AI 기본법 시행과 고영향 AI 규제", "keywords": "AI 기본법 고영향 AI 생성형 AI 합성콘텐츠 기본권 안전 설명가능성", "conflict": "혁신 촉진 ↔ 기본권·안전 규제", "background": "AI 기본법은 인공지능 산업 육성과 신뢰 확보를 함께 요구하는 틀이다. 면접에서는 기술 자체보다 채용, 의료, 금융, 교육평가처럼 개인의 권리에 영향을 주는 영역에서 어느 정도의 사전 규제와 사후 책임을 둘 것인지가 핵심이다.", "pro": ["고영향 AI에 대한 투명성 요구는 차별과 안전사고를 줄인다.", "생성형 AI 표시 의무는 허위정보와 딥페이크 피해를 예방한다.", "법적 기준이 생기면 기업도 예측 가능하게 투자할 수 있다."], "con": ["초기 규제가 과도하면 국내 AI 기업의 개발 속도가 늦어질 수 있다.", "고영향 AI의 범위가 모호하면 현장 혼란이 커진다.", "표시 의무만으로는 악의적 조작 콘텐츠를 막기 어렵다."], "questions": ["고영향 AI를 별도로 규제해야 하는 이유는 무엇인가?", "AI 면접·학생평가에 AI가 쓰인다면 어떤 조건이 필요할까?", "AI 산업 육성과 기본권 보호가 충돌할 때 우선 기준은 무엇인가?", "생성형 AI 표시 의무의 한계와 보완책을 말해 보라."], "answer": "저는 AI 기본법의 방향이 규제와 진흥을 동시에 설계해야 한다고 봅니다. AI는 의료 진단, 채용, 대출, 교육평가처럼 개인의 삶을 직접 바꿀 수 있기 때문에 결과 설명, 위험관리, 인간의 최종 책임이 필요합니다. 다만 모든 AI를 같은 강도로 규제하면 중소기업과 연구 현장이 위축될 수 있으므로 고영향 영역을 중심으로 차등 규제해야 합니다. 학교나 공공기관은 AI 사용 사실을 알리고, 이의제기 절차와 사람의 재검토 권리를 보장해야 합니다. 성공 여부는 산업 투자액만이 아니라 차별 민원, 사고 재발률, 설명 가능성 개선 정도로 함께 평가해야 합니다.", "check": "시행령·고영향 AI 세부 범위, 생성형 AI 표시 세부 기준 재확인", "sources": ["https://www.law.go.kr/lsInfoP.do?lsId=014820"]}, {"priority": "A+", "field": "교육·의료", "title": "2027 의대 증원과 지역의사제", "keywords": "의대 정원 지역의사제 필수의료 의료공공성 지역격차 직업선택 자유", "conflict": "의료공공성 ↔ 직업선택의 자유·교육의 질", "background": "의대 정원 확대는 수험생에게 직접 관련된 입시 현안이면서 지역 의료 붕괴, 필수의료 기피, 교육 여건, 직업 선택의 자유를 동시에 묻는 고확률 주제다.", "pro": ["지역·필수의료 인력 부족을 국가가 방치하기 어렵다.", "공공적 지원을 받는 선발이라면 일정한 지역 복무 의무를 설계할 수 있다.", "비수도권 의료 접근성 개선은 생명권과 직결된다."], "con": ["단순 증원만으로 필수과 기피와 지역 이탈을 해결하기 어렵다.", "의학교육 실습 여건이 따라오지 않으면 교육의 질이 낮아질 수 있다.", "장기 의무복무는 개인의 직업 선택 자유와 충돌할 수 있다."], "questions": ["의대 정원 확대가 지역 의료 문제를 실제로 해결할 수 있을까?", "지역의사제는 정당한 공공정책인가, 과도한 제한인가?", "교육의 질을 보장하려면 무엇을 먼저 점검해야 하는가?", "필수의료 기피 문제의 원인을 정원 부족만으로 볼 수 있을까?"], "answer": "의대 증원은 필요하지만, 정원 확대만으로 지역 의료 문제가 해결된다고 보기는 어렵습니다. 지역에 의사가 부족한 이유는 인원 부족뿐 아니라 근무 여건, 보상, 법적 위험, 교육·생활 인프라가 함께 작용하기 때문입니다. 지역의사제도 공공 장학금과 지역 수련, 적정 보상, 의무복무 이후 정착 지원이 결합될 때 정당성이 커집니다. 반대로 강제 배치처럼 보이면 직업 선택의 자유 침해 논란이 생깁니다. 따라서 정부는 대학별 교육 여건, 필수과 수련 환경, 지역 근무 유지율을 공개하고, 단기 증원보다 장기 정착률을 핵심 지표로 삼아야 합니다.", "check": "2027학년도 최종 모집인원, 지역의사제 법안 처리 상태, 의대별 교육 여건", "sources": ["https://www.mohw.go.kr/gallery.es?act=view&bid=0003&list_no=379870&mid=a10605040000&tag="]}, {"priority": "A+", "field": "환경·인구·사회", "title": "2035 국가 온실가스 감축목표", "keywords": "2035 NDC 온실가스 감축 탄소중립 기후위기 산업경쟁력 전력정책", "conflict": "미래세대 기후책임 ↔ 산업경쟁력·전환비용", "background": "2035 NDC는 기후윤리를 넘어 산업 전환, 전기요금, 재생에너지, 원전, 탄소국경조정까지 연결되는 종합형 면접 주제다.", "pro": ["강한 감축목표는 미래세대 피해와 국제 통상 리스크를 줄인다.", "녹색 산업과 에너지 효율 투자를 촉진한다.", "기업의 장기 투자 방향을 명확히 한다."], "con": ["전환 속도가 너무 빠르면 제조업 비용과 고용 충격이 커질 수 있다.", "전력망·저장장치가 따라오지 않으면 목표가 선언에 그칠 수 있다.", "취약계층 에너지 비용 부담이 커질 수 있다."], "questions": ["기후목표를 높이면 어떤 산업·세대 갈등이 생길까?", "기후정책에서 공정전환이 필요한 이유는 무엇인가?", "청소년 세대가 기후정책에 더 강하게 요구할 수 있는 근거는 무엇인가?"], "answer": "2035 NDC는 단순한 환경 목표가 아니라 산업정책이기도 합니다. 감축 목표를 낮게 잡으면 미래세대와 수출기업이 더 큰 기후 비용과 통상 장벽을 부담할 수 있습니다. 그러나 목표만 높이고 전력망, 재생에너지 입지, 산업 전환 지원을 마련하지 않으면 현장 비용만 커집니다. 그래서 저는 감축 목표와 함께 업종별 전환 로드맵, 노동자 재교육, 취약계층 전기요금 보호, 지역별 재생에너지 이익 공유가 같이 가야 한다고 봅니다. 성공 지표는 배출량뿐 아니라 전환 과정의 고용 유지와 에너지 빈곤 감소까지 포함해야 합니다.", "check": "정부 최종 제출 NDC 수치, 산업별 감축 로드맵, 전력수급계획", "sources": ["https://ebrief.korea.kr/briefing/66875"]}, {"priority": "A+", "field": "경제·노동·금융", "title": "국민연금 개혁과 세대 간 형평성", "keywords": "국민연금 보험료율 소득대체율 기금소진 세대 형평성 노후소득", "conflict": "재정 지속가능성 ↔ 세대 간 형평성", "background": "국민연금은 청소년에게도 미래 부담과 노후 보장이라는 방식으로 직접 연결된다. 면접에서는 보험료 인상 찬반보다 어떤 세대가 어떤 위험을 부담하는지가 핵심이다.", "pro": ["보험료율 조정은 기금 고갈 시점을 늦추고 제도 신뢰를 높인다.", "소득대체율을 일정 수준 유지해야 노인빈곤을 줄일 수 있다.", "일찍 개혁할수록 충격을 나눌 수 있다."], "con": ["청년 세대는 고용 불안 속에서 보험료 부담 증가를 크게 느낄 수 있다.", "기금 고갈 시점 연장만으로 장기 지속가능성이 완성되지는 않는다.", "사각지대 노동자는 개혁의 혜택에서 밀릴 수 있다."], "questions": ["국민연금 개혁에서 청년 세대가 불리하다고 느끼는 이유는 무엇인가?", "보험료율 인상과 급여 보장의 균형은 어떻게 잡아야 하는가?", "국민연금 사각지대를 줄이는 방법을 제안해 보라."], "answer": "국민연금 개혁은 어느 한 세대의 양보만 요구해서는 지속되기 어렵습니다. 보험료를 조금씩 올리는 것은 기금 안정에 필요하지만, 청년들은 불안정 고용과 주거비 부담 속에서 현재 부담을 크게 느낍니다. 따라서 보험료율 조정은 저소득·플랫폼 노동자 지원, 출산·군복무 크레딧 확대, 기금 운용 투명성 강화와 함께 가야 합니다. 또한 소득대체율을 무조건 낮추면 노인빈곤이 악화될 수 있으므로 기초연금, 퇴직연금과의 역할 분담도 필요합니다. 성공은 기금소진 시점뿐 아니라 가입 사각지대 감소와 세대별 순부담 공개로 평가해야 합니다.", "check": "보험료율 단계 인상 일정, 소득대체율, 기금 재정추계 최신값", "sources": ["https://www.nps.or.kr/pnsinfo/ntpsklg/getOHAF0104M0.do"]}, {"priority": "A+", "field": "경제·노동·금융", "title": "한미 관세·전략투자와 경제안보", "keywords": "한미 관세 전략투자 공급망 경제안보 보호무역 자유무역", "conflict": "자유무역 ↔ 경제안보·공급망 자립", "background": "미중 경쟁과 미국 통상정책 변화 속에서 관세, 강제노동, 과잉생산, 전략산업 투자가 함께 다뤄지는 주제다.", "pro": ["전략산업 투자는 공급망 리스크를 줄이고 일자리를 만들 수 있다.", "인권·안보 기준을 반영한 통상정책은 국제 규범을 강화한다.", "핵심 소재·부품 자립은 위기 대응력을 높인다."], "con": ["관세는 소비자 가격 상승과 기업 비용 부담으로 이어질 수 있다.", "보호무역이 확산되면 수출 중심 경제에 불리하다.", "기업 투자가 정치적 조건에 지나치게 묶일 수 있다."], "questions": ["자유무역과 경제안보가 충돌할 때 국가는 무엇을 우선해야 하는가?", "관세 정책은 국내 산업 보호인가, 소비자 부담인가?", "청소년 소비자와 노동자는 통상정책의 영향을 어떻게 받는가?"], "answer": "최근 통상정책은 값싼 상품을 자유롭게 거래하는 문제를 넘어 안보와 인권, 공급망 안정까지 포함합니다. 핵심 산업을 보호하려는 관세와 전략투자는 위기 대응력을 높일 수 있지만, 비용은 소비자 가격과 기업 부담으로 돌아올 수 있습니다. 그래서 저는 모든 산업을 보호하기보다 반도체, 배터리, 에너지처럼 안보성이 큰 분야에 한정하고, 관세로 생긴 부담은 취약계층과 중소기업 지원으로 완화해야 한다고 봅니다. 정책 효과는 국내 생산 증가뿐 아니라 소비자 물가, 수출 감소, 공급망 안정성을 함께 보며 판단해야 합니다.", "check": "미국 통상조치 최종 관세율, 한국 기업 투자 조건, WTO·FTA 분쟁 가능성", "sources": ["https://www.yna.co.kr/view/AKR20260724080100003"]}, {"priority": "A", "field": "AI·디지털", "title": "생성형 AI 저작권·딥페이크", "keywords": "생성형 AI 저작권 딥페이크 초상권 학습데이터 창작자 권리", "conflict": "기술혁신 ↔ 창작자 권리·인격권", "background": "생성형 AI는 창작 도구이면서 타인의 저작물, 얼굴, 목소리를 학습·모방할 수 있어 저작권과 인격권 논쟁을 낳는다.", "pro": ["AI는 창작 접근성을 높이고 새로운 산업을 만든다.", "공정한 학습 기준이 마련되면 교육·연구 활용이 커진다.", "탐지·표시 기술은 피해 예방에 도움을 준다."], "con": ["무단 학습은 창작자의 경제적 권리를 침해할 수 있다.", "딥페이크는 명예훼손과 성범죄 피해로 이어질 수 있다.", "AI 생성물의 책임 주체가 불분명하다."], "questions": ["AI 학습에 저작물을 사용하는 것은 어디까지 허용해야 하는가?", "딥페이크 피해를 줄이기 위한 학교·플랫폼의 역할은 무엇인가?", "AI 창작물을 인간 창작물과 같은 방식으로 보호해야 할까?"], "answer": "생성형 AI는 창작의 문턱을 낮추지만, 타인의 작품과 얼굴을 무단으로 이용할 수 있다는 점에서 명확한 기준이 필요합니다. 저는 공익적 연구와 개인 학습은 일정 범위에서 허용하되, 상업적 서비스는 학습 데이터 출처 공개, 보상 체계, 삭제 요청권을 갖춰야 한다고 봅니다. 딥페이크는 표현의 자유 문제가 아니라 피해자의 인격권과 안전 문제로 접근해야 합니다. 학교에서는 제작 금지 교육만이 아니라 피해 신고 절차와 디지털 시민성 교육을 병행해야 합니다. 성공 기준은 AI 산업 성장과 함께 창작자 보상, 피해 신고 처리 속도, 재유포 차단률입니다.", "check": "저작권법 개정 논의, 딥페이크 처벌·플랫폼 책임 강화안", "sources": ["https://www.copyright.or.kr/information-materials/trend/tmis/view.do?brdctsno=55125"]}, {"priority": "A", "field": "교육·의료", "title": "고교학점제 보완과 평가 공정성", "keywords": "고교학점제 선택과목 최소 성취수준 평가 공정성 학교 간 격차", "conflict": "학생 선택권 ↔ 평가 공정성·학교 간 격차", "background": "고교학점제는 학생 선택권을 넓히지만 학교 규모, 과목 개설, 평가 방식 차이가 대입 공정성 문제로 이어질 수 있다.", "pro": ["학생 진로에 맞는 과목 선택과 책임 있는 학습을 강화한다.", "획일적 교육과정에서 벗어나 다양한 역량을 보여줄 수 있다.", "최소 성취수준 보장은 학습 결손을 줄이는 장치가 될 수 있다."], "con": ["학교별 개설 과목 차이가 입시 기회 격차로 이어질 수 있다.", "과목 선택이 전략화되면 진로 탐색보다 내신 유불리가 커진다.", "교사 업무와 평가 부담이 늘어날 수 있다."], "questions": ["고교학점제가 대입 공정성을 높이는가, 낮추는가?", "소규모 학교 학생의 선택권을 어떻게 보장할 수 있을까?", "학생의 과목 선택을 평가할 때 무엇을 봐야 할까?"], "answer": "고교학점제의 취지는 학생이 진로에 맞게 배우도록 하는 데 있습니다. 그러나 학교마다 개설 과목과 교사 수가 다르면 선택권 자체가 불평등해질 수 있습니다. 그래서 공동교육과정, 온라인 수업, 지역 대학·기관 연계가 필요하며, 대입에서는 어려운 과목을 선택한 노력과 성취를 함께 보아야 합니다. 또한 최소 성취수준 보장은 낙인보다 보충학습 기회로 설계되어야 합니다. 제도 성공은 선택 과목 수만이 아니라 소규모 학교 학생의 이수 기회, 과목 쏠림 감소, 학생 만족도와 학업성취 회복률로 평가해야 합니다.", "check": "교육부 보완방안, 2026학년도 적용 범위, 대입 반영 방식", "sources": ["https://www.korea.kr/news/policyFocusView.do?newsId=148958816&pkgId=49500831"]}, {"priority": "A", "field": "환경·인구·사회", "title": "저출생·인구감소와 구조개혁", "keywords": "저출생 합계출산율 인구감소 출산지원 주거 돌봄 성평등 지역소멸", "conflict": "출산지원 ↔ 개인의 선택·구조개혁", "background": "출산율 반등 여부보다 왜 아이를 낳기 어려운 사회가 되었는지, 현금 지원과 구조개혁을 어떻게 결합할지가 핵심이다.", "pro": ["돌봄·주거·교육비 지원은 출산 포기의 구조적 원인을 낮춘다.", "인구감소는 지역, 국방, 연금, 노동시장에 장기 영향을 준다.", "일·가정 양립 정책은 성평등과 노동생산성에도 도움을 준다."], "con": ["출산을 국가 목표로만 강조하면 개인의 선택을 압박할 수 있다.", "현금 지원만으로 고용·주거 불안을 해결하기 어렵다.", "지역 인프라가 사라지면 출산지원 효과도 제한된다."], "questions": ["저출생을 개인의 선택 문제로 볼 수 없는 이유는 무엇인가?", "출산지원금보다 중요한 구조개혁은 무엇인가?", "청년 세대의 삶의 안정과 인구정책은 어떻게 연결되는가?"], "answer": "저출생은 개인이 아이를 원하지 않는다는 단순한 문제가 아니라 주거, 고용, 돌봄, 성평등이 모두 연결된 구조 문제입니다. 현금 지원은 단기 부담을 줄일 수 있지만, 안정된 일자리와 주거, 믿을 수 있는 돌봄이 없으면 지속 효과가 작습니다. 또한 출산을 애국심으로 압박하면 개인의 삶을 수단화할 위험이 있습니다. 저는 청년 주거 안정, 육아휴직의 실질적 사용, 남성 돌봄 참여, 지역 의료·교육 인프라를 함께 개선해야 한다고 봅니다. 성공 지표는 출산율뿐 아니라 청년 삶의 만족도와 경력단절 감소까지 포함해야 합니다.", "check": "2025·2026 출생통계 확정치, 인구정책 예산, 지역별 차이", "sources": ["https://kostat.go.kr"]}, {"priority": "A", "field": "경제·노동·금융", "title": "청년고용과 ‘쉬었음’ 증가", "keywords": "청년고용 쉬었음 니트 첫 일자리 경력직 선호 노동시장 이중구조 AI 전환", "conflict": "개인 책임 ↔ 노동시장 진입구조·AI 전환", "background": "청년층 ‘쉬었음’ 증가는 취업 의지 부족으로만 설명하기 어렵다. 첫 일자리의 질, 경력직 선호, 자동화, 지역 격차가 함께 작동한다.", "pro": ["직업훈련과 구직 지원은 노동시장 진입 지연을 줄인다.", "중소기업 근로조건 개선은 첫 일자리 선택지를 넓힌다.", "AI 전환 교육은 미래 일자리 대응력을 높인다."], "con": ["지원정책이 단기 프로그램에 그치면 실제 취업으로 이어지기 어렵다.", "청년 문제를 개인 역량 부족으로만 보면 구조 개선이 늦어진다.", "AI 교육도 지역·계층별 접근성 격차가 생길 수 있다."], "questions": ["청년 ‘쉬었음’을 개인의 태도 문제로만 보면 왜 위험한가?", "첫 일자리의 질이 왜 중요한가?", "AI 시대 청년 고용정책은 어떤 역량을 길러야 하는가?"], "answer": "청년 ‘쉬었음’ 증가는 개인의 의지 부족만으로 설명할 수 없습니다. 기업은 경력직을 선호하고, 청년은 낮은 임금과 불안정한 일자리를 피하려 하며, AI 전환은 초급 일자리 구조를 바꿉니다. 따라서 정책은 이력서 특강보다 산업 현장 경험, 직무 교육, 지역 일자리 연결, 중소기업 근로조건 개선을 함께 다뤄야 합니다. 청년도 직무 탐색과 기초 역량을 갖추어야 하지만, 사회는 첫 실패가 장기 배제로 이어지지 않도록 재도전 경로를 만들어야 합니다. 성과는 취업률뿐 아니라 일자리 유지율과 임금 수준으로 봐야 합니다.", "check": "통계청 고용동향 최신 월, 쉬었음 정의와 연령대, 청년고용대책", "sources": ["https://kostat.go.kr"]}, {"priority": "A", "field": "경제·노동·금융", "title": "개정 노동조합법과 하청 노동권", "keywords": "노동조합법 하청 노동자 원청 사용자 노란봉투법 손해배상 교섭권", "conflict": "하청 노동권 ↔ 기업의 경영 예측가능성", "background": "개정 노동조합법은 원청과 하청 노동자의 실질적 지배·교섭 관계, 파업 손해배상 제한 등 노동권과 경영권의 경계를 묻는다.", "pro": ["실질적으로 노동조건을 좌우하는 원청이 교섭에 책임져야 한다.", "과도한 손해배상은 헌법상 노동3권을 위축시킬 수 있다.", "하청 구조의 위험 전가를 줄인다."], "con": ["사용자 범위가 넓어지면 기업의 법적 예측가능성이 낮아질 수 있다.", "불법행위 책임 제한이 재산권 침해 논란을 낳을 수 있다.", "교섭 상대가 복잡해져 노사관계 비용이 커질 수 있다."], "questions": ["원청이 하청 노동자의 사용자로 인정될 수 있는 조건은 무엇인가?", "노동3권과 기업 재산권이 충돌할 때 기준은 무엇인가?", "노동시장 이중구조를 줄이기 위한 대안을 제시하라."], "answer": "하청 노동권 문제의 핵심은 형식상 사용자가 아니라 실제로 임금과 작업조건을 누가 결정하느냐입니다. 원청이 작업방식과 단가를 강하게 통제한다면 교섭 책임도 일정 부분 져야 합니다. 다만 사용자 범위를 너무 불명확하게 넓히면 기업은 어느 수준까지 책임져야 하는지 예측하기 어렵습니다. 따라서 법은 실질적 지배력, 계약 구조, 안전·임금 결정권 같은 판단 기준을 구체화해야 합니다. 동시에 파업 손해배상은 폭력이나 고의적 파괴는 책임을 묻되, 정당한 쟁의행위를 위축시키지 않는 방향이어야 합니다.", "check": "개정 법률 시행일, 하위 규정, 헌법소원·판례 동향", "sources": ["https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=285131&viewCls=lsRvsDocInfoR"]}, {"priority": "A", "field": "AI·디지털", "title": "소버린 AI와 AI 데이터센터", "keywords": "소버린 AI 파운데이션 모델 데이터센터 전력 반도체 디지털 주권", "conflict": "디지털 주권 ↔ 비용·에너지·개방성", "background": "국가가 자체 AI 모델과 데이터 인프라를 갖춰야 하는지, 글로벌 AI 생태계와 어떻게 협력할지가 쟁점이다.", "pro": ["자국 언어·문화·공공데이터에 맞는 AI를 만들 수 있다.", "해외 플랫폼 의존을 낮추고 안보 리스크를 줄인다.", "데이터센터와 반도체 산업 경쟁력을 키울 수 있다."], "con": ["대규모 투자와 전력 사용이 필요해 비용 부담이 크다.", "닫힌 국가주의로 흐르면 기술 혁신과 국제 협력이 줄 수 있다.", "데이터센터 입지 갈등과 환경 부담이 생긴다."], "questions": ["소버린 AI가 필요한 이유와 한계는 무엇인가?", "AI 데이터센터가 지역사회에 주는 이익과 부담은 무엇인가?", "국가 AI와 민간 AI의 역할은 어떻게 나눠야 할까?"], "answer": "소버린 AI는 모든 기술을 국내에서만 만들자는 뜻이라기보다, 한국어와 공공서비스, 산업 보안에 필요한 핵심 역량을 확보하자는 의미로 봐야 합니다. 해외 플랫폼에만 의존하면 비용, 데이터 이전, 문화적 편향 문제가 생길 수 있습니다. 그러나 자체 모델 개발은 막대한 전력과 예산을 요구하므로 무조건 국산화보다 공공성이 큰 분야를 우선해야 합니다. 데이터센터는 지역 일자리와 세수를 만들 수 있지만 전력망과 냉각수, 환경 부담을 함께 논의해야 합니다. 성과는 모델 성능뿐 아니라 공공서비스 개선, 에너지 효율, 중소기업 활용도까지 봐야 합니다.", "check": "독자 AI 파운데이션 모델 평가, 데이터센터 전력·입지 정책", "sources": ["https://www.msit.go.kr/eng/"]}, {"priority": "A", "field": "경제·노동·금융", "title": "원화 스테이블코인·예금토큰·CBDC", "keywords": "스테이블코인 예금토큰 CBDC 프로젝트 한강 디지털자산 금융안정", "conflict": "금융혁신 ↔ 금융안정·소비자보호", "background": "디지털화폐 논의는 결제 편의성뿐 아니라 은행 예금 이탈, 통화주권, 개인정보, 불법자금 위험까지 포함한다.", "pro": ["결제 비용과 속도를 개선하고 핀테크 혁신을 촉진한다.", "원화 기반 디지털자산은 해외 코인 의존을 낮출 수 있다.", "예금토큰 실험은 안전한 디지털 결제 인프라를 만들 수 있다."], "con": ["민간 스테이블코인이 커지면 은행 예금과 금융안정이 흔들릴 수 있다.", "발행주체와 준비자산 규제가 약하면 소비자 피해가 생긴다.", "거래 추적과 개인정보 보호의 균형이 어렵다."], "questions": ["스테이블코인과 CBDC는 무엇이 다른가?", "디지털화폐가 금융소외를 줄일까, 개인정보 침해를 키울까?", "민간 발행과 공공 통제의 균형은 어떻게 잡아야 할까?"], "answer": "디지털화폐는 편리하지만 돈에 대한 신뢰를 다루기 때문에 실험적으로 접근해야 합니다. 스테이블코인은 빠른 결제와 새로운 서비스를 만들 수 있지만, 준비자산이 불투명하면 이용자가 손실을 볼 수 있고 은행 예금이 급격히 빠질 위험도 있습니다. CBDC와 예금토큰은 공공성과 안정성이 장점이지만 개인정보 침해 우려가 있습니다. 그래서 저는 발행주체 자격, 준비자산 공개, 이용자 보호, 자금세탁 방지 기준을 먼저 세우고 제한된 실험으로 확대해야 한다고 봅니다. 성공은 거래량보다 사고 발생률, 금융포용, 개인정보 보호 수준으로 평가해야 합니다.", "check": "디지털자산기본법·스테이블코인 법안 처리, 한국은행 실험 결과", "sources": ["https://www.fsc.go.kr/po010106/86373"]}, {"priority": "A", "field": "환경·인구·사회", "title": "산불·폭염·집중호우와 국가 예방책임", "keywords": "산불 폭염 집중호우 재난 기후적응 국가책임 예방 복구 취약계층", "conflict": "개인 대비 ↔ 국가 예방책임·기후적응", "background": "기후재난은 자연현상이지만 피해 규모는 예방 투자, 도시계획, 경보체계, 취약계층 보호에 따라 달라진다.", "pro": ["국가는 생명과 안전을 보호할 의무가 있으므로 예방 투자가 필요하다.", "기후적응 인프라는 장기적으로 복구비를 줄인다.", "취약계층 보호는 재난 불평등을 줄인다."], "con": ["모든 재난 피해를 국가 책임으로만 돌리면 개인·지자체의 대비가 약해질 수 있다.", "예방 예산은 단기 성과가 보이지 않아 우선순위 갈등이 생긴다.", "위험지역 규제는 재산권과 지역경제 문제를 낳을 수 있다."], "questions": ["재난 피해를 줄이기 위해 예방과 복구 중 무엇이 더 중요한가?", "기후재난에서 취약계층이 더 큰 피해를 보는 이유는 무엇인가?", "위험지역 개발 제한은 정당한가?"], "answer": "산불과 폭염, 집중호우는 자연재해이지만 피해를 키우거나 줄이는 것은 사회의 선택입니다. 위험지역 개발, 배수시설, 산림 관리, 경보 전달, 대피 지원이 부족하면 같은 비와 더위도 더 큰 참사가 됩니다. 저는 재난정책의 중심을 사후 복구에서 사전 예방으로 옮겨야 한다고 봅니다. 다만 개인과 지자체의 책임도 있으므로 중앙정부는 위험지도와 예산을 제공하고, 지자체는 현장 대피계획을 구체화해야 합니다. 성공 지표는 복구비 지출이 아니라 인명피해 감소, 대피 취약계층 지원률, 위험시설 개선률이어야 합니다.", "check": "해당 연도 재난 통계, 폭염·산불 대책, 기후적응대책", "sources": ["https://www.korea.kr/news/policyNewsView.do?newsId=148960601"]}, {"priority": "A", "field": "사회·문화·미디어", "title": "청소년 SNS 연령제한과 플랫폼 책임", "keywords": "청소년 SNS 연령제한 플랫폼 책임 알고리즘 중독 개인정보 호주 16세", "conflict": "청소년 보호 ↔ 표현·접근의 자유·프라이버시", "background": "호주의 16세 미만 SNS 제한 사례는 청소년 정신건강, 알고리즘 책임, 연령 확인 과정의 개인정보 문제를 함께 묻는다.", "pro": ["중독적 설계와 유해 콘텐츠로부터 청소년을 보호할 수 있다.", "플랫폼에 안전 설계 책임을 부과하는 계기가 된다.", "부모와 학교만으로 해결하기 어려운 구조 문제를 다룬다."], "con": ["연령 확인 과정에서 개인정보 수집이 늘 수 있다.", "청소년의 표현·참여·정보 접근권이 제한될 수 있다.", "우회 접속이 쉬우면 실효성이 낮다."], "questions": ["청소년 SNS 제한은 보호인가, 과잉통제인가?", "플랫폼 알고리즘에 어떤 책임을 물어야 하는가?", "연령 확인과 개인정보 보호를 어떻게 양립할 수 있을까?"], "answer": "청소년 SNS 문제는 사용 시간을 개인이 조절하지 못해서만 생기는 문제가 아닙니다. 플랫폼은 오래 머물게 하는 알고리즘과 알림 설계를 통해 이용자의 행동을 유도합니다. 따라서 청소년 보호를 위해 일정한 연령 제한이나 추천 알고리즘 제한은 검토할 수 있습니다. 다만 전면 금지는 표현의 자유와 정보 접근권, 개인정보 수집 문제를 낳을 수 있습니다. 저는 연령 확인 정보를 최소화하고, 야간 알림 제한, 유해 콘텐츠 추천 금지, 기본 비공개 설정처럼 설계 책임을 강화하는 방식이 더 현실적이라고 봅니다.", "check": "호주 시행 세부 기준, 국내 플랫폼 규제 논의, 청소년 정신건강 통계", "sources": ["https://www.esafety.gov.au/young-people/pressures-from-social-media"]}, {"priority": "A", "field": "사회·문화·미디어", "title": "K-콘텐츠 수출·AI·IP", "keywords": "K콘텐츠 수출 생성형 AI IP 저작권 플랫폼 창작자 보상", "conflict": "문화산업 성장 ↔ 창작자 권리·플랫폼 의존", "background": "K-콘텐츠는 단순한 문화 인기보다 IP 소유권, 글로벌 플랫폼 협상력, AI 학습권리, 창작노동 보상으로 확장되는 주제다.", "pro": ["콘텐츠 수출은 국가 이미지와 산업 경쟁력을 높인다.", "AI 제작 도구는 번역·편집·시각효과 비용을 낮춘다.", "IP 전략은 장기 수익과 파생 산업을 키운다."], "con": ["플랫폼 의존이 커지면 창작자가 수익 배분에서 불리할 수 있다.", "AI 학습과 자동 제작이 창작노동을 대체할 수 있다.", "상업적 성공 위주로 다양성이 줄어들 수 있다."], "questions": ["K-콘텐츠 성공을 수출액만으로 평가해도 될까?", "AI가 창작산업에 주는 기회와 위험은 무엇인가?", "창작자와 플랫폼의 수익 배분을 어떻게 개선할 수 있을까?"], "answer": "K-콘텐츠의 성장은 자랑스러운 일이지만, 수출액만 보면 산업 내부의 불균형을 놓칠 수 있습니다. 글로벌 플랫폼이 유통을 장악하면 제작사는 흥행해도 IP를 충분히 보유하지 못할 수 있고, 창작자는 불안정 노동에 놓일 수 있습니다. 생성형 AI는 번역과 제작비 절감에 도움이 되지만, 학습 데이터와 보상 기준이 없으면 창작자의 권리를 침해할 수 있습니다. 그래서 정부와 산업은 IP 보유율, 창작자 표준계약, AI 학습 보상, 중소 제작사 해외 진출 지원을 함께 봐야 합니다. 성공은 매출뿐 아니라 권리 배분의 공정성으로 평가해야 합니다.", "check": "콘텐츠산업 매출·수출 확정 통계, AI 활용 실태, 표준계약 개선", "sources": ["https://welcon.kocca.kr/en/info/business/1957553"]}, {"priority": "A", "field": "법·정치·국제", "title": "검찰청 폐지·공소청·중대범죄수사청", "keywords": "검찰개혁 공소청 중대범죄수사청 수사 기소 분리 권력분립", "conflict": "권한 분산 ↔ 수사 효율·책임성", "background": "수사와 기소를 나누는 검찰개혁은 권력기관 견제와 범죄 대응 효율 사이의 균형을 묻는 전형적인 법·정치 면접 주제다.", "pro": ["수사와 기소 권한 집중을 줄여 권력 남용을 방지할 수 있다.", "기관 간 견제는 인권 보호에 도움이 된다.", "검사의 기소 판단을 더 객관화할 수 있다."], "con": ["기관이 나뉘면 책임 소재가 불분명해지고 수사가 지연될 수 있다.", "중대범죄 대응 전문성이 약화될 수 있다.", "정치적 개편으로 보이면 국민 신뢰가 낮아질 수 있다."], "questions": ["수사권과 기소권을 분리해야 하는 이유는 무엇인가?", "권한 분산과 수사 효율 중 무엇이 더 중요한가?", "새 기관의 정치적 중립성을 보장하려면 무엇이 필요할까?"], "answer": "검찰개혁의 핵심은 특정 기관에 너무 큰 권한이 집중될 때 생기는 남용 위험을 줄이는 것입니다. 수사와 기소를 분리하면 서로 견제할 수 있고 피의자의 권리 보호에도 도움이 될 수 있습니다. 그러나 기관만 나누면 사건 처리 지연과 책임 회피가 생길 수 있습니다. 따라서 조직개편보다 중요한 것은 사건 이송 기준, 기록 공유, 지휘·감독 책임, 정치적 중립 장치입니다. 저는 권한 분산의 원칙에는 찬성하지만, 국민이 체감하는 기준은 이름이 바뀌었는지가 아니라 억울한 수사 감소와 중대범죄 대응 능력 유지라고 봅니다.", "check": "조직개편 시행일, 하위 법령, 실제 사건 처리 절차", "sources": ["https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=285131&viewCls=lsRvsDocInfoR"]}, {"priority": "A", "field": "법·정치·국제", "title": "2027 개헌 논의", "keywords": "개헌 권력구조 기본권 지방분권 대통령제 국민투표 2027", "conflict": "정치개혁 필요 ↔ 사회적 합의·정치적 이용 우려", "background": "개헌은 권력구조, 기본권, 지방분권, 선거제도 등 다양한 쟁점을 포함하지만 정치적 이해관계와 국민적 합의가 핵심 변수다.", "pro": ["1987년 체제가 반영하지 못한 디지털 기본권, 기후권, 지방분권을 논의할 수 있다.", "권력구조 개편으로 대통령에게 집중된 권한을 조정할 수 있다.", "사회 변화에 맞게 헌법 가치를 갱신할 수 있다."], "con": ["정치권 이해관계에 따라 개헌이 정략화될 수 있다.", "국민적 합의 없이 추진하면 사회 갈등이 커진다.", "권력구조 논쟁이 민생 의제를 밀어낼 수 있다."], "questions": ["현행 헌법을 바꿔야 한다면 가장 중요한 의제는 무엇인가?", "개헌을 선거 일정과 함께 추진할 때 장단점은 무엇인가?", "청소년과 미래세대의 권리는 헌법에 어떻게 반영될 수 있을까?"], "answer": "개헌은 단순히 대통령 임기를 바꾸는 문제가 아니라 우리 사회의 기본 규칙을 다시 정하는 일입니다. 디지털 기본권, 기후위기, 지방분권처럼 1987년 헌법이 충분히 담지 못한 의제는 논의할 필요가 있습니다. 그러나 개헌이 특정 정치세력의 유불리로 보이면 국민적 신뢰를 얻기 어렵습니다. 저는 권력구조 논의와 기본권 논의를 분리해 공개 숙의하고, 청년·지역·전문가 참여를 넓혀야 한다고 봅니다. 성공 조건은 빠른 추진이 아니라 국민이 내용을 이해하고 동의할 수 있는 절차적 정당성입니다.", "check": "국회 개헌특위 구성, 합의 의제, 국민투표 일정", "sources": ["https://www.yna.co.kr/view/AKR20260508141300001"]}, {"priority": "A", "field": "법·정치·국제", "title": "우크라이나 전쟁과 정의로운 평화", "keywords": "우크라이나 전쟁 영토보전 휴전 평화 식량안보 국제법", "conflict": "정의로운 평화 ↔ 빠른 휴전·민간인 보호", "background": "우크라이나 전쟁은 영토 보전과 침략 금지 원칙, 휴전의 현실성, 민간인 피해, 식량·에너지 안보를 함께 묻는다.", "pro": ["침략을 인정하지 않는 원칙은 국제질서를 지키는 데 필요하다.", "피해국의 주권과 영토보전을 존중해야 한다.", "장기적으로 불법 침략의 보상을 막아야 한다."], "con": ["전쟁 장기화는 민간인 피해와 난민, 식량 위기를 키운다.", "빠른 휴전이 생명을 구할 수 있다는 현실론도 있다.", "군사지원이 확전 위험을 높일 수 있다."], "questions": ["정의로운 평화와 빠른 휴전이 충돌할 때 무엇을 우선해야 하는가?", "국제사회는 침략국에 어떤 책임을 물어야 하는가?", "전쟁이 한국 청소년의 삶과 연결되는 지점을 말해 보라."], "answer": "우크라이나 전쟁에서 빠른 휴전은 민간인 생명을 구할 수 있다는 점에서 중요합니다. 그러나 침략으로 얻은 이익을 그대로 인정하면 국제사회는 힘으로 국경을 바꿔도 된다는 신호를 줄 수 있습니다. 그래서 저는 정의로운 평화와 인도주의적 휴전이 함께 논의되어야 한다고 봅니다. 즉 민간인 보호와 포로 교환, 곡물 수출 안전을 즉시 확보하되, 최종 평화안은 우크라이나의 주권과 국제법 원칙을 존중해야 합니다. 한국도 에너지 가격, 식량안보, 국제규범이라는 측면에서 이 문제와 연결되어 있습니다.", "check": "휴전 협상 상태, 민간인 피해 통계, 곡물·에너지 영향", "sources": ["https://www.reuters.com/world/pope-leo-renews-call-ukraine-war-end-2026-08-09/"]}, {"priority": "A", "field": "법·정치·국제", "title": "가자 인도주의 위기와 국제인도법", "keywords": "가자 인도주의 위기 국제인도법 자위권 비례성 구별원칙 민간인 보호", "conflict": "자위권 ↔ 비례성·구별원칙·인도지원", "background": "가자 문제는 특정 편을 암기하는 것이 아니라 민간인 보호, 자위권, 비례성, 인도지원 접근이라는 국제인도법의 기준을 적용하는 주제다.", "pro": ["국가는 공격으로부터 국민을 보호할 자위권이 있다.", "무장단체의 민간인 방패 사용도 국제법 위반이다.", "안보 위협을 무시한 평화는 지속되기 어렵다."], "con": ["자위권도 민간인 구별과 비례성 원칙을 넘어설 수 없다.", "봉쇄와 의료·식량 부족은 집단적 처벌 논란을 낳는다.", "민간인 피해가 커지면 장기 평화가 더 어려워진다."], "questions": ["자위권은 어디까지 인정되어야 하는가?", "국제인도법의 구별원칙과 비례성 원칙을 설명해 보라.", "인도주의 위기에서 국제사회가 할 수 있는 역할은 무엇인가?"], "answer": "가자 인도주의 위기는 어느 한쪽의 주장만 반복해서는 설명하기 어렵습니다. 국가는 국민을 보호할 자위권이 있지만, 전쟁 중에도 민간인과 전투원을 구별하고 피해가 과도하지 않도록 해야 합니다. 병원, 식량, 물, 피난민 보호는 정치적 입장과 별개로 보장되어야 합니다. 저는 즉각적인 인도지원 통로 확보, 인질과 민간인 보호, 국제 감시, 장기적인 정치 협상이 함께 필요하다고 봅니다. 면접에서는 감정적 편들기보다 국제법 원칙을 기준으로 민간인 피해를 줄이는 현실적 대안을 제시하는 것이 중요합니다.", "check": "휴전·인도지원 상황, 국제기구 피해 집계, 협상 진행", "sources": ["https://www.un.org/unispal/"]}, {"priority": "A", "field": "교육·의료", "title": "AI 디지털교과서와 교육 데이터 보호", "keywords": "AI 디지털교과서 교육데이터 맞춤형 학습 개인정보 학습격차 에듀테크", "conflict": "맞춤형 학습 ↔ 개인정보·디지털 격차", "background": "AI 디지털교과서는 학생별 학습 진단과 보충을 가능하게 하지만, 학생의 학습기록과 행동 데이터가 어떻게 수집·활용되는지가 핵심 쟁점이다.", "pro": ["학생 수준에 맞춘 피드백으로 학습 결손을 줄일 수 있다.", "교사는 학습 데이터를 바탕으로 더 정밀하게 지도할 수 있다.", "농어촌·소규모 학교의 과목·자료 접근성을 높일 수 있다."], "con": ["학생의 민감한 학습 데이터가 과도하게 수집될 수 있다.", "기기·네트워크·가정환경 차이가 학습 격차로 이어질 수 있다.", "AI 추천에 의존하면 교사의 전문적 판단이 약해질 수 있다."], "questions": ["AI 디지털교과서가 학습격차를 줄일까, 키울까?", "학생 학습데이터는 누가 어디까지 활용할 수 있어야 할까?", "교사의 역할은 AI 도입 이후 어떻게 달라져야 하는가?"], "answer": "AI 디지털교과서는 학생별 약점을 빠르게 파악하고 보충학습을 제공할 수 있다는 점에서 긍정적입니다. 그러나 교육 데이터는 성적뿐 아니라 학습 습관, 관심사, 취약 영역을 담기 때문에 보호 수준이 높아야 합니다. 저는 AI 디지털교과서를 도입하되 수집 데이터 최소화, 학부모·학생 고지, 외부 업체의 재활용 제한, 교사의 최종 판단권을 명확히 해야 한다고 봅니다. 또한 기기와 인터넷 환경이 부족한 학생을 지원하지 않으면 맞춤형 학습이 새로운 격차가 됩니다. 성과는 이용률보다 학습 결손 회복과 개인정보 사고 감소로 평가해야 합니다.", "check": "교육부 AI·디지털 교육자료 기준, 개인정보 처리 기준, 학교 현장 적용 과목", "sources": ["https://www.moe.go.kr/boardCnts/viewRenew.do?boardID=294&boardSeq=105007&lev=0&m=020402"]}, {"priority": "A", "field": "교육·의료", "title": "간병비 부담과 간호·간병통합서비스", "keywords": "간병비 간호간병통합서비스 건강보험 가족돌봄 노인돌봄 의료비", "conflict": "보편적 돌봄 ↔ 재정 부담·인력 부족", "background": "고령화로 병원 간병비가 가족의 경제 부담이 되면서, 간병을 개인 책임으로 둘 것인지 공적 돌봄 체계로 넓힐 것인지가 중요해졌다.", "pro": ["간병비 부담을 낮추면 의료 접근성과 가족의 삶의 질이 개선된다.", "전문 인력이 돌봄을 맡으면 안전과 감염관리 수준이 높아질 수 있다.", "가족돌봄으로 인한 경력단절과 소득 손실을 줄인다."], "con": ["건강보험 재정 부담과 보험료 인상 논란이 생길 수 있다.", "간호·간병 인력이 부족하면 서비스 질이 떨어질 수 있다.", "병원 중심 돌봄만 확대하면 지역·재가 돌봄이 약해질 수 있다."], "questions": ["간병비를 개인 부담으로 두는 것이 공정한가?", "공적 간병 확대에서 가장 먼저 해결할 문제는 무엇인가?", "의료와 복지를 분리해서 볼 수 없는 이유는 무엇인가?"], "answer": "간병은 가족의 사랑만으로 해결할 수 없는 사회적 돌봄 문제가 되었습니다. 고령화가 빨라지면서 장기 입원과 간병비는 가계 파산이나 경력단절로 이어질 수 있습니다. 저는 간호·간병통합서비스를 확대하되 모든 비용을 한 번에 건강보험으로 떠넘기기보다 중증도와 소득 수준에 따라 우선순위를 정해야 한다고 봅니다. 동시에 병원 인력 확충, 처우 개선, 지역 방문돌봄과의 연계가 필요합니다. 성과는 간병비 감소액뿐 아니라 가족돌봄 시간 감소, 환자 안전, 간호 인력 이탈률까지 함께 봐야 합니다.", "check": "건강보험 적용 범위, 간호·간병 인력 수급, 시범사업 성과", "sources": ["https://www.mohw.go.kr"]}, {"priority": "A", "field": "경제·노동·금융", "title": "전 분야 마이데이터와 개인정보 전송요구권", "keywords": "마이데이터 개인정보 전송요구권 데이터 이동권 개인정보보호 플랫폼", "conflict": "데이터 활용 편익 ↔ 개인정보 자기결정권·보안", "background": "마이데이터는 개인이 자신의 정보를 다른 서비스로 옮겨 더 나은 서비스를 받을 수 있게 하지만, 데이터 유출과 과도한 프로파일링 위험도 커진다.", "pro": ["개인이 자기 데이터를 통제하고 더 편리한 서비스를 선택할 수 있다.", "금융을 넘어 교육·고용·의료 분야 혁신을 촉진한다.", "플랫폼 독점 완화와 경쟁 촉진 효과가 있다."], "con": ["전송 과정에서 민감정보 유출 위험이 커질 수 있다.", "이용자가 동의 내용을 충분히 이해하지 못할 수 있다.", "기업이 데이터를 결합해 차별적 가격·서비스를 제공할 수 있다."], "questions": ["개인정보 전송요구권은 왜 필요한가?", "마이데이터가 소비자에게 이익만 주는 것은 아닌 이유는 무엇인가?", "동의 제도의 한계를 보완할 방법을 제안하라."], "answer": "마이데이터는 개인정보를 기업이 보관하는 대상에서 개인이 활용할 수 있는 권리로 바꾸는 제도입니다. 개인은 금융, 교육, 고용 정보를 옮겨 맞춤형 서비스를 받을 수 있지만, 정보가 많아질수록 유출과 차별 위험도 커집니다. 그래서 저는 전송요구권을 확대하되 전송 범위 최소화, 쉬운 동의 철회, 수신기관 심사, 사고 책임 강화가 필요하다고 봅니다. 특히 청소년·고령자처럼 동의 내용을 이해하기 어려운 이용자에게는 더 강한 설명 의무가 있어야 합니다. 성공은 서비스 수보다 정보 유출 감소와 이용자 통제권 강화로 평가해야 합니다.", "check": "개인정보 전송요구권 적용 분야, 전문기관 존 안전을 높이는 기술적 대안을 제안하라."], "answer": "스쿨존 정책의 최우선 목표는 어린이 생명 보호입니다. 다만 모든 시간과 장소에 같은 제한을 적용하는 것이 항상 가장 효과적인지는 검토할 수 있습니다. 저는 어린이 통행량 데이터, 학교·학원 위치, 사고 이력, 보행환경을 기준으로 제한적으로 탄력 운영할 수 있다고 봅니다. 그러나 운전자가 혼동하지 않도록 표지와 신호를 명확히 하고, 횡단보도 조명, 과속 단속, 보도 분리 같은 안전시설을 먼저 강화해야 합니다. 성과는 차량 흐름보다 어린이 사고 감소와 운전자 규칙 준수율로 평가해야 합니다.", "check": "스쿨존 사고 통계, 탄력 운영 지침, 지자체 시범 사례", "sources": ["https://www.molit.go.kr"]}]</script>
<script>
const rows = JSON.parse(document.getElementById('source-data').textContent);
const state = { q:'', field:'', selected:0 };
const $ = id => document.getElementById(id);
const rank = {'A+':0, 'A':1, 'B':2};
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function csvCell(s) { return '"' + String(s ?? '').replaceAll('"','""').replaceAll('\\n',' ') + '"'; }
function searchable(r) { return [r.priority,r.field,r.title,r.keywords,r.conflict,r.background,r.answer,r.check,...r.pro,...r.con,...r.questions].join(' ').toLowerCase(); }
function filtered() {
  const q = state.q.trim().toLowerCase();
  let out = rows.filter(r => (!state.field || r.field === state.field) && (!q || searchable(r).includes(q)));
  out.sort((a,b) => rank[a.priority]-rank[b.priority] || a.title.localeCompare(b.title,'ko'));
  return out;
}
function fillFilters() {
  [...new Set(rows.map(r => r.field))].sort((a,b)=>a.localeCompare(b,'ko')).forEach(v => $('field').insertAdjacentHTML('beforeend', `<option>${escapeHtml(v)}</option>`));
}
function render() {
  const out = filtered();
  if (!out.length) {
    $('list').innerHTML = '<div class="empty">검색 결과가 없습니다.</div>';
    $('detail').innerHTML = '<div class="empty">조건을 바꾸어 다시 검색하세요.</div>';
    return;
  }
  if (!out[state.selected]) state.selected = 0;
  $('list').innerHTML = out.map((r,i) => `<div class="item ${i===state.selected?'active':''}" data-i="${i}"><h3>${escapeHtml(r.title)}</h3><div class="meta"><span class="badge pri">${r.priority}</span><span class="badge">${escapeHtml(r.field)}</span><span>${escapeHtml(r.conflict)}</span></div></div>`).join('');
  document.querySelectorAll('.item').forEach(el => el.addEventListener('click', () => { state.selected = Number(el.dataset.i); render(); }));
  renderDetail(out[state.selected]);
}
function renderDetail(r) {
  $('detail').innerHTML = `
    <div class="meta"><span class="badge pri">${r.priority}</span><span class="badge">${escapeHtml(r.field)}</span></div>
    <h2>${escapeHtml(r.title)}</h2>
    <div class="conflict">${escapeHtml(r.conflict)}</div>
    <section class="block"><h3>배경</h3><p>${escapeHtml(r.background)}</p></section>
    <div class="grid2">
      <section class="block"><h3>추진·찬성 논리</h3><ul>${r.pro.map(x=>`<li>${escapeHtml(x)}</li>`).join('')}</ul></section>
      <section class="block"><h3>신중·반대 논리</h3><ul>${r.con.map(x=>`<li>${escapeHtml(x)}</li>`).join('')}</ul></section>
    </div>
    <section class="block"><h3>예상 질문</h3><ul>${r.questions.map(x=>`<li>${escapeHtml(x)}</li>`).join('')}</ul></section>
    <section class="block"><h3>답변 골격</h3><div class="answer">${escapeHtml(r.answer)}</div></section>
    <section class="block"><h3>면접 직전 확인</h3><p>${escapeHtml(r.check)}</p></section>
    <section class="block sources"><h3>근거 링크</h3>${r.sources.map((s,i)=>`<a target="_blank" rel="noopener" href="${escapeHtml(s)}">출처 ${i+1}</a>`).join('')}</section>
  `;
}
['q','field'].forEach(id => $(id).addEventListener('input', e => { state[id] = e.target.value; state.selected = 0; render(); }));
$('reset').addEventListener('click', () => { state.q=''; state.field=''; ['q','field'].forEach(id => $(id).value = state[id]); render(); });
$('print').addEventListener('click', () => window.print());
$('csv').addEventListener('click', () => {
  const out = filtered();
  const header = ['우선도','분야','주제','핵심충돌','배경','면접직전확인','출처'];
  const lines = [header.map(csvCell).join(',')].concat(out.map(r => [r.priority,r.field,r.title,r.conflict,r.background,r.check,r.sources.join(' | ')].map(csvCell).join(',')));
  const blob = new Blob(['\\ufeff' + lines.join('\\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = '2027_면접_시사이슈_검색결과.csv'; a.click(); URL.revokeObjectURL(a.href);
});
fillFilters();
render();
</script>
</body>
